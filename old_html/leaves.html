<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D-Map | Leaves</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdn.datatables.net/1.13.4/css/jquery.dataTables.min.css" rel="stylesheet">
    <link href="https://cdn.datatables.net/buttons/2.3.6/css/buttons.dataTables.min.css" rel="stylesheet">
    <link href="https://cdn.datatables.net/fixedcolumns/4.3.0/css/fixedColumns.dataTables.min.css" rel="stylesheet">
    <link href="../admin/dmap-theme.css" rel="stylesheet">
</head>
<body>
<div class="app-layout">
    <aside class="sidebar">
        <div class="sidebar-brand">
            <div class="brand-icon">D</div>
            <div><div class="brand-name">D-Map</div><div class="brand-sub">Analytics Dashboard</div></div>
        </div>
        <div class="sidebar-section">Reports</div>
        <nav class="sidebar-nav">
            <a href="./powerbi" class="nav-item"><i class="bi bi-pie-chart nav-icon"></i><span class="nav-label">Dashboard</span></a>
            <a href="./clients" class="nav-item"><i class="bi bi-people nav-icon"></i><span class="nav-label">Clients</span></a>
            <a href="./projectsdetails" class="nav-item"><i class="bi bi-folder2-open nav-icon"></i><span class="nav-label">Projects</span></a>
            <a href="./taskdetails" class="nav-item"><i class="bi bi-check2-square nav-icon"></i><span class="nav-label">Tasks</span></a>
            <a href="./issuedetails" class="nav-item"><i class="bi bi-exclamation-circle nav-icon"></i><span class="nav-label">Changes</span></a>
            <a href="./workrequesttasks" class="nav-item"><i class="bi bi-table nav-icon"></i><span class="nav-label">Raw Data</span></a>
            <a href="./leaves" class="nav-item active"><i class="bi bi-calendar-x nav-icon"></i><span class="nav-label">Leaves</span></a>
        </nav>
        <div class="sidebar-footer"><i class="bi bi-circle-fill" style="color:#22c55e;font-size:8px;"></i><span class="footer-text"> System Online</span></div>
    </aside>

    <div class="main-area">
        <div class="topbar">
            <div style="display:flex;align-items:center;gap:12px;">
                <button class="sidebar-toggle" id="sidebarToggle"><i class="bi bi-chevron-left"></i></button>
                <div>
                    <div class="topbar-title"><i class="bi bi-calendar-x" style="color:var(--accent)"></i> Leaves</div>
                    <div class="topbar-subtitle">Leave management and tracking</div>
                </div>
            </div>
            <div class="topbar-right">
                <button class="btn-action primary" id="btnAddLeave"><i class="bi bi-plus-lg"></i> Add Leave</button>
                <button class="btn-action excel" id="btnExcel"><i class="bi bi-file-earmark-excel"></i> Excel</button>
                <button class="btn-action csv" id="btnCsv"><i class="bi bi-filetype-csv"></i> CSV</button>
            </div>
        </div>

        <div class="content-area">
            <div class="stats-row">
                <div class="stat-card"><div class="stat-icon blue"><i class="bi bi-calendar-check"></i></div><div><div class="stat-value" id="s1">—</div><div class="stat-label">Total Leaves</div></div></div>
                <div class="stat-card"><div class="stat-icon green"><i class="bi bi-sun"></i></div><div><div class="stat-value" id="s2">—</div><div class="stat-label">Full Day</div></div></div>
                <div class="stat-card"><div class="stat-icon orange"><i class="bi bi-sunset"></i></div><div><div class="stat-value" id="s3">—</div><div class="stat-label">Half Day</div></div></div>
                <div class="stat-card"><div class="stat-icon purple"><i class="bi bi-clock"></i></div><div><div class="stat-value" id="s4">—</div><div class="stat-label">Short Leave</div></div></div>
                <div class="stat-card"><div class="stat-icon pink"><i class="bi bi-calendar-plus"></i></div><div><div class="stat-value" id="s5">—</div><div class="stat-label">Planned</div></div></div>
                <div class="stat-card"><div class="stat-icon red"><i class="bi bi-calendar-x"></i></div><div><div class="stat-value" id="s6">—</div><div class="stat-label">Unplanned</div></div></div>
            </div>

            <div class="table-card">
                <div class="loading-overlay" id="loader"><div class="spinner"></div><div class="loading-text">Loading leaves...</div></div>
                <div class="table-card-header">
                    <div class="table-card-title"><span class="dot"></span>Leave Records</div>
                </div>
                <div class="table-card-body">
                    <div class="dt-container">
                        <table id="mainTable" class="display" style="width:100%"><thead></thead><tbody></tbody></table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Add/Edit Leave Modal -->
<div id="leaveModal" style="display:none;position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,0.55);align-items:center;justify-content:center;">
    <div style="background:#1e2433;border:1px solid #2d3548;border-radius:12px;width:600px;max-width:95vw;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 8px 40px rgba(0,0,0,0.5);">
        <div style="padding:20px 24px 16px;border-bottom:1px solid #2d3548;display:flex;align-items:center;gap:10px;">
            <span style="background:#6366f122;border-radius:8px;padding:6px 10px;"><i class="bi bi-calendar-plus" style="color:#6366f1;font-size:18px;"></i></span>
            <div>
                <div class="modal-title" id="modalTitle" style="color:#f1f5f9;font-weight:600;font-size:15px;">Add Leave</div>
                <div style="color:#94a3b8;font-size:12px;">Fill in the leave details</div>
            </div>
            <button onclick="closeLeaveModal()" style="margin-left:auto;background:none;border:none;color:#64748b;font-size:20px;cursor:pointer;line-height:1;">&times;</button>
        </div>
        <div style="padding:16px 24px;overflow-y:auto;flex:1;">
            <form id="leaveForm">
                <input type="hidden" id="leaveId">
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
                    <div class="form-group">
                        <label style="color:#cbd5e1;font-size:13px;margin-bottom:6px;display:block;">User <span style="color:#f43f5e;">*</span></label>
                        <select id="leaveUserId" required style="width:100%;padding:8px 12px;border-radius:7px;border:1px solid #2d3548;background:#131c2e;color:#f1f5f9;font-size:13px;"></select>
                    </div>
                    <div class="form-group">
                        <label style="color:#cbd5e1;font-size:13px;margin-bottom:6px;display:block;">User ID</label>
                        <input type="text" id="leaveUserIdReadonly" readonly style="width:100%;padding:8px 12px;border-radius:7px;border:1px solid #2d3548;background:#1e293b;color:#94a3b8;font-size:13px;">
                    </div>
                    <div class="form-group" style="grid-column:span 2;">
                        <label style="color:#cbd5e1;font-size:13px;margin-bottom:6px;display:block;">Username</label>
                        <input type="text" id="leaveUserNameReadonly" readonly style="width:100%;padding:8px 12px;border-radius:7px;border:1px solid #2d3548;background:#1e293b;color:#94a3b8;font-size:13px;">
                    </div>
                    <div class="form-group">
                        <label style="color:#cbd5e1;font-size:13px;margin-bottom:6px;display:block;">Date <span style="color:#f43f5e;">*</span></label>
                        <input type="date" id="leaveDate" required style="width:100%;padding:8px 12px;border-radius:7px;border:1px solid #2d3548;background:#131c2e;color:#f1f5f9;font-size:13px;">
                    </div>
                    <div class="form-group">
                        <label style="color:#cbd5e1;font-size:13px;margin-bottom:6px;display:block;">Leave Day Type <span style="color:#f43f5e;">*</span></label>
                        <select id="leaveDayType" required style="width:100%;padding:8px 12px;border-radius:7px;border:1px solid #2d3548;background:#131c2e;color:#f1f5f9;font-size:13px;">
                            <option value="Full day">Full day</option>
                            <option value="Half day">Half day</option>
                            <option value="Short Leave">Short Leave</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label style="color:#cbd5e1;font-size:13px;margin-bottom:6px;display:block;">Leave Type <span style="color:#f43f5e;">*</span></label>
                        <select id="leaveType" required style="width:100%;padding:8px 12px;border-radius:7px;border:1px solid #2d3548;background:#131c2e;color:#f1f5f9;font-size:13px;">
                            <option value="Unplanned">Unplanned</option>
                            <option value="Planned">Planned</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label style="color:#cbd5e1;font-size:13px;margin-bottom:6px;display:block;">Status <span style="color:#f43f5e;">*</span></label>
                        <select id="leaveStatus" required style="width:100%;padding:8px 12px;border-radius:7px;border:1px solid #2d3548;background:#131c2e;color:#f1f5f9;font-size:13px;">
                            <option value="Inform">Inform</option>
                            <option value="Not Inform">Not Inform</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label style="color:#cbd5e1;font-size:13px;margin-bottom:6px;display:block;">Leave Reason <span style="color:#f43f5e;">*</span></label>
                        <select id="leaveReason" required style="width:100%;padding:8px 12px;border-radius:7px;border:1px solid #2d3548;background:#131c2e;color:#f1f5f9;font-size:13px;">
                            <option value="Feeling not well">Feeling not well</option>
                            <option value="Emergency">Emergency</option>
                            <option value="Medical">Medical</option>
                            <option value="Family Emergency">Family Emergency</option>
                            <option value="Go Early">Go Early</option>
                            <option value="Personal">Personal</option>
                            <option value="Hospitalized">Hospitalized</option>
                        </select>
                    </div>
                    <div class="form-group" style="grid-column:span 2;">
                        <label style="color:#cbd5e1;font-size:13px;margin-bottom:6px;display:block;">Division</label>
                        <input type="text" id="leaveVertical" readonly style="width:100%;padding:8px 12px;border-radius:7px;border:1px solid #2d3548;background:#1e293b;color:#94a3b8;font-size:13px;">
                    </div>
                    <div class="form-group">
                        <label style="color:#cbd5e1;font-size:13px;margin-bottom:6px;display:block;">Days Count</label>
                        <input type="number" id="leaveDaysCount" step="0.5" min="0.5" value="1" style="width:100%;padding:8px 12px;border-radius:7px;border:1px solid #2d3548;background:#131c2e;color:#f1f5f9;font-size:13px;">
                    </div>
                    <div class="form-group" style="grid-column:span 2;">
                        <label style="color:#cbd5e1;font-size:13px;margin-bottom:6px;display:block;">Reason</label>
                        <select id="leaveReasonText" style="width:100%;padding:8px 12px;border-radius:7px;border:1px solid #2d3548;background:#131c2e;color:#f1f5f9;font-size:13px;">
                            <option value="">Select Reason</option>
                            <option value="Due to heavy rain">Due to heavy rain</option>
                            <option value="Family Emergency">Family Emergency</option>
                            <option value="Feeling not well">Feeling not well</option>
                            <option value="Go Early">Go Early</option>
                            <option value="Goinng on vacation">Goinng on vacation</option>
                            <option value="Medical appointment">Medical appointment</option>
                            <option value="Medical Appointmet">Medical Appointmet</option>
                            <option value="Medical emergency">Medical emergency</option>
                            <option value="Not feeling well">Not feeling well</option>
                            <option value="Personal reason">Personal reason</option>
                            <option value="Personal work">Personal work</option>
                            <option value="Reached late">Reached late</option>
                            <option value="Vacation">Vacation</option>
                        </select>
                    </div>
                    <div class="form-group" style="grid-column:span 2;">
                        <label style="color:#cbd5e1;font-size:13px;margin-bottom:6px;display:block;">Remark</label>
                        <textarea id="leaveRemark" rows="2" style="width:100%;padding:8px 12px;border-radius:7px;border:1px solid #2d3548;background:#131c2e;color:#f1f5f9;font-size:13px;resize:vertical;"></textarea>
                    </div>
                </div>
            </form>
        </div>
        <div style="padding:16px 24px;border-top:1px solid #2d3548;display:flex;gap:10px;justify-content:flex-end;">
            <button onclick="closeLeaveModal()" style="padding:8px 20px;border-radius:7px;border:1px solid #2d3548;background:#2d3548;color:#94a3b8;font-size:13px;cursor:pointer;">Cancel</button>
            <button id="confirmLeaveBtn" style="padding:8px 20px;border-radius:7px;border:none;background:#6366f1;color:#fff;font-size:13px;font-weight:600;cursor:pointer;"><i class="bi bi-check-lg"></i> Save Leave</button>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.3.6/js/dataTables.buttons.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.3.6/js/buttons.html5.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdn.datatables.net/fixedcolumns/4.3.0/js/dataTables.fixedColumns.min.js"></script>
<script>
function getApiBase(){
    var p=window.location.pathname;
    if(p.indexOf('/digilabs/uat/')!==-1) return '/digilabs/uat/dmap/api/';
    return '/digilabs/dmap/api/';
}
const HEADERS = {
    id: 'ID',
    user_id: 'User ID',
    name: 'Username',
    date: 'Date',
    day: 'Day',
    leave_day_type: 'Leave Day Type',
    leave_type: 'Leave Type',
    status: 'Status',
    leave_reason: 'Leave Reason',
    vertical: 'Division',
    days_count: 'Days Count',
    reason: 'Reason',
    remark: 'Remark',
    month: 'Month',
    year: 'Year'
};
const BADGES = {
    leave_type: {Planned:'status-planned', Unplanned:'status-unplanned'},
    status: {Inform:'status-inform', 'Not Inform':'status-not-inform'}
};

let dt;
$(function(){
    $('#sidebarToggle').on('click', function(){
        $('body').toggleClass('sidebar-collapsed');
        var isCollapsed = $('body').hasClass('sidebar-collapsed');
        $(this).find('i').toggleClass('bi-chevron-left bi-chevron-right');
        localStorage.setItem('sidebarCollapsed', isCollapsed);
    });
    if(localStorage.getItem('sidebarCollapsed') === 'true'){
        $('body').addClass('sidebar-collapsed');
        $('#sidebarToggle').find('i').removeClass('bi-chevron-left').addClass('bi-chevron-right');
    }

    loadLeaveUsers();

    $('#leaveUserId').on('change', function(){
        var userId = $(this).val();
        var selectedOption = $(this).find('option:selected');
        var userName = selectedOption.text() || '';
        $('#leaveUserIdReadonly').val(userId);
        $('#leaveUserNameReadonly').val(userName);
        
        if(userId){
            $.getJSON(getApiBase()+'datatable/admin/leaves/users/'+userId+'/division', function(res){
                if(res.success && res.data && res.data.division_name){
                    $('#leaveVertical').val(res.data.division_name);
                } else {
                    $('#leaveVertical').val('');
                }
            });
        } else {
            $('#leaveVertical').val('');
        }
    });

    $('#btnAddLeave').on('click', function(){
        openLeaveModal();
    });

    $('#confirmLeaveBtn').on('click', function(){
        saveLeave();
    });

    $.getJSON(getApiBase()+'datatable/admin/leaves/data', function(res){
        $('#loader').hide();
        var data = res.data||[];
        $('#recordCount').text(data.length+' Records');
        updateLeaveStats(data);

        var cols=[];
        cols.push({
            data:null, title:'Action', orderable:false, searchable:false, width:'80px',
            render:function(v,type,row){
                if(type!=='display') return '';
                return '<button class="edit-btn" onclick="editLeave('+(row?row.id:'')+')" title="Edit" style="background:#6366f122;border:1px solid #6366f144;color:#818cf8;border-radius:6px;padding:3px 7px;cursor:pointer;font-size:13px;margin-right:4px;"><i class="bi bi-pencil"></i></button>'
                       +'<button class="del-btn" onclick="deleteLeave('+(row?row.id:'')+')" title="Delete" style="background:#be123c22;border:1px solid #be123c44;color:#f43f5e;border-radius:6px;padding:3px 7px;cursor:pointer;font-size:13px;"><i class="bi bi-trash3"></i></button>';
            }
        });
        var keyOrder=['id','user_id','name','date','day','leave_day_type','leave_type','status','leave_reason','vertical','days_count','reason','remark','month','year'];
        keyOrder.forEach(function(k){
            if(k==='name'){
                cols.push({
                    data:null, title:HEADERS[k]||k, defaultContent:'N/A',
                    render:function(v,type,row){
                        if(type!=='display') return row && row.user ? row.user.name : 'N/A';
                        return row && row.user ? row.user.name : 'N/A';
                    }
                });
                } else {
                    cols.push({
                        data:k, title:HEADERS[k]||k, defaultContent:'N/A',
                        render:function(v,type){
                            if(type!=='display') return v;
                            var val=v!=null?v:'N/A';
                            if(BADGES[k]&&val&&val!=='N/A'){var c=BADGES[k][val]||'';return '<span class="status-badge '+c+'">'+val+'</span>';}
                            return val;
                        }
                    });
                }
        });

        dt=$('#mainTable').DataTable({
            data:data,columns:cols,
            pageLength:25,lengthMenu:[[25,50,100,200,-1],[25,50,100,200,'All']],
            dom:'<"dt-top-row"lf>rt<"dt-bottom-row"ip>',
            scrollX:true,scrollY:'calc(100vh - 360px)',scrollCollapse:false,autoWidth:false,fixedColumns:{left:4},
            language:{search:'',searchPlaceholder:'Search all columns...',lengthMenu:'Show _MENU_ rows'},
            initComplete:function(){
                var api=this.api();
                var colKeys=['Action'].concat(keyOrder);
                api.columns().every(function(){
                    var col=this,idx=col.index();
                    var th=$(col.header());
                    var labelText=HEADERS[colKeys[idx]]||colKeys[idx];
                    th.empty();
                    var wrap=$('<div class="th-wrap"></div>');
                    wrap.append('<div class="th-label"><span title="'+labelText+'">'+labelText+'</span><span class="th-sort"></span></div>');
                    if(idx>0){
                        var key=colKeys[idx];
                        if(BADGES[key]){
                            var sel=$('<select class="col-filter"><option value="">All</option></select>');
                            Object.keys(BADGES[key]).forEach(function(o){sel.append('<option value="'+o+'">'+o+'</option>');});
                            sel.on('change click mousedown',function(e){e.stopPropagation();});
                            sel.on('change',function(){col.search(this.value).draw();});
                            wrap.append(sel);
                        } else {
                            var inp=$('<input class="col-filter" type="text" placeholder="Filter...">');
                            inp.on('click mousedown focus',function(e){e.stopPropagation();});
                            inp.on('keyup change clear',function(){if(col.search()!==this.value)col.search(this.value).draw();});
                            wrap.append(inp);
                        }
                    }
                    th.append(wrap);
                    th.off('click').on('click',function(e){
                        if($(e.target).closest('.col-filter').length===0){
                            var currentOrder = api.order();
                            if(currentOrder.length && currentOrder[0][0]===idx){
                                api.order([idx, currentOrder[0][1]==='asc'?'desc':'asc']).draw();
                            } else {
                                api.order([idx,'asc']).draw();
                            }
                        }
                    });
                });
            }
        });
        var colTitles=cols.map(function(c){return c.title;});
        new $.fn.dataTable.Buttons(dt,[
            {extend:'excel',className:'buttons-excel',filename:'leaves_'+new Date().toISOString().slice(0,10),exportOptions:{columns:':gt(0):visible',modifier:{page:'all'},orthogonal:'export',format:{header:function(data,col){return colTitles[col]||data;},body:function(data){return data == null ? '' : data;}}}},
            {extend:'csv',className:'buttons-csv',filename:'leaves_'+new Date().toISOString().slice(0,10),exportOptions:{columns:':gt(0):visible',modifier:{page:'all'},orthogonal:'export',format:{header:function(data,col){return colTitles[col]||data;},body:function(data){return data == null ? '' : data;}}}}
        ]);
        $('#btnExcel').on('click',function(){dt.button('.buttons-excel').trigger();});
        $('#btnCsv').on('click',function(){dt.button('.buttons-csv').trigger();});
        dt.on('draw',function(){
            var rows=dt.rows({ filter:'applied' }).data();
            var arr=rows.toArray ? rows.toArray() : rows;
            updateLeaveStats(arr);
            $('#recordCount').text(arr.length+' Records');
        });
    }).fail(function(){$('#loader').html('<div style="color:#be123c;font-size:13px"><i class="bi bi-exclamation-triangle"></i> Failed to load data</div>');});
});

function loadLeaveUsers(){
    $.getJSON(getApiBase()+'datatable/admin/leaves/users', function(res){
        if(res.success && res.data){
            var options = '<option value="">Select User</option>';
            res.data.forEach(function(u){
                options += '<option value="'+u.id+'">'+u.name+' ('+u.email+')</option>';
            });
            $('#leaveUserId').html(options);
        }
    });
}

function updateLeaveStats(data){
    $('#s1').text(data.length);
    $('#s2').text(data.filter(function(r){ return r.leave_day_type === 'Full day'; }).length);
    $('#s3').text(data.filter(function(r){ return r.leave_day_type === 'Half day'; }).length);
    $('#s4').text(data.filter(function(r){ return r.leave_day_type === 'Short Leave'; }).length);
    $('#s5').text(data.filter(function(r){ return r.leave_type === 'Planned'; }).length);
    $('#s6').text(data.filter(function(r){ return r.leave_type === 'Unplanned'; }).length);
}

function openLeaveModal(leave){
    $('#leaveForm')[0].reset();
    $('#leaveId').val('');
    $('#leaveUserIdReadonly').val('');
    $('#leaveUserNameReadonly').val('');
    $('#modalTitle').text('Add Leave');
    $('#leaveUserId').prop('disabled', false);

    if(leave){
        $('#modalTitle').text('Edit Leave');
        $('#leaveId').val(leave.id);
        $('#leaveUserId').val(leave.user_id);
        $('#leaveUserIdReadonly').val(leave.user_id);
        $('#leaveUserNameReadonly').val(leave.user ? leave.user.name : '');
        $('#leaveUserId').prop('disabled', true);
        $('#leaveVertical').val(leave.vertical || '');
        $('#leaveDate').val(leave.date);
        $('#leaveDayType').val(leave.leave_day_type);
        $('#leaveType').val(leave.leave_type);
        $('#leaveStatus').val(leave.status);
        $('#leaveReason').val(leave.leave_reason);
        $('#leaveDaysCount').val(leave.days_count || 1);
        $('#leaveReasonText').val(leave.reason || '');
        $('#leaveRemark').val(leave.remark || '');
    }

    $('#leaveModal').css('display', 'flex');
}

function closeLeaveModal(){
    $('#leaveModal').hide();
}

function editLeave(id){
    $.getJSON(getApiBase()+'datatable/admin/leaves/'+id, function(res){
        if(res.success && res.data){
            openLeaveModal(res.data);
        } else {
            alert('Leave not found');
        }
    });
}

function saveLeave(){
    var id = $('#leaveId').val();
    var data = {
        date: $('#leaveDate').val(),
        user_id: parseInt($('#leaveUserId').val()),
        leave_day_type: $('#leaveDayType').val(),
        leave_type: $('#leaveType').val(),
        status: $('#leaveStatus').val(),
        leave_reason: $('#leaveReason').val(),
        vertical: $('#leaveVertical').val() || null,
        days_count: parseFloat($('#leaveDaysCount').val()) || 1,
        reason: $('#leaveReasonText').val() || null,
        remark: $('#leaveRemark').val() || null
    };

    if(!data.date || !data.user_id){
        alert('Please fill in all required fields');
        return;
    }

    var url = id ? getApiBase()+'datatable/admin/leaves/'+id : getApiBase()+'datatable/admin/leaves';
    var method = id ? 'PUT' : 'POST';

    $.ajax({
        url: url,
        method: method,
        contentType: 'application/json',
        data: JSON.stringify(data),
        success: function(res){
            if(res.success){
                closeLeaveModal();
                location.reload();
            } else {
                alert(res.error || 'Failed to save leave');
            }
        },
        error: function(xhr){
            alert(xhr.responseJSON?.error || 'Failed to save leave');
        }
    });
}

function deleteLeave(id){
    if(!confirm('Are you sure you want to delete this leave?')) return;

    $.ajax({
        url: getApiBase()+'datatable/admin/leaves/'+id,
        method: 'DELETE',
        success: function(res){
            if(res.success){
                location.reload();
            } else {
                alert(res.error || 'Failed to delete leave');
            }
        },
        error: function(xhr){
            alert(xhr.responseJSON?.error || 'Failed to delete leave');
        }
    });
}
</script>
</body>
</html>
