<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Power BI · D-Map Admin</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235b2be0'/%3E%3Ctext x='16' y='22' font-family='Arial' font-size='16' font-weight='700' fill='white' text-anchor='middle'%3ED%3C/text%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="../admin/dmap-theme.css" rel="stylesheet">
    <script>try{document.documentElement.setAttribute('data-theme',localStorage.getItem('themePreference')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'))}catch(e){}</script>
    <script src="../admin/admin-app.js" defer></script>
</head>
<body>
<noscript>The D-Map admin panel needs JavaScript.</noscript>
<script>
document.addEventListener('DOMContentLoaded', function () {
    const D = window.DMap;
    const REPORT = 'https://app.powerbi.com/view?r=eyJrIjoiOTg3NTg0NjAtYWZlZC00MjFkLWEwMTEtNzI2ZjRlYzJiNmFhIiwidCI6IjE4MTljZGNhLTFmMzgtNGU2My05Y2QzLTM3OTQxYTliOWRiNiJ9';
    const body = D.shell({
        page: 'powerbi', title: 'Power BI', icon: 'bar-chart-line', subtitle: 'The published Power BI report for D-Map',
        actions: [{ label: 'Open in new tab', icon: 'box-arrow-up-right', onClick: () => window.open(REPORT, '_blank', 'noopener') }]
    });
    body.innerHTML = '<div class="dm-card dm-embed"><iframe title="D-Map Power BI report" allowfullscreen loading="lazy"></iframe></div>';
    body.querySelector('iframe').src = REPORT;
});
</script>
</body>
</html>
