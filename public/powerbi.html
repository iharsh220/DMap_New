<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D-Map | Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="../admin/dmap-theme.css" rel="stylesheet">
    <script src="../admin/admin-theme.js"></script>
</head>
<body>
<div class="app-layout">
    <aside class="sidebar">
        <div class="sidebar-brand">
            <div class="brand-icon"><i class="bi bi-diagram-3" style="font-size:15px;"></i></div>
            <div><div class="brand-name">D-Map</div><div class="brand-sub">Analytics Dashboard</div></div>
        </div>
        <div class="sidebar-section">Reports</div>
        <nav class="sidebar-nav">
            <a href="./powerbi" class="nav-item active"><i class="bi bi-pie-chart nav-icon"></i><span class="nav-label">Dashboard</span></a>
        </nav>
        <div class="sidebar-section">Projects</div>
        <nav class="sidebar-nav">
            <a href="./projectsdetails" class="nav-item"><i class="bi bi-folder2-open nav-icon"></i><span class="nav-label">Projects</span></a>
            <a href="./clients" class="nav-item"><i class="bi bi-people nav-icon"></i><span class="nav-label">Clients</span></a>
            <a href="./taskdetails" class="nav-item"><i class="bi bi-check2-square nav-icon"></i><span class="nav-label">Tasks</span></a>
            <a href="./issuedetails" class="nav-item"><i class="bi bi-exclamation-circle nav-icon"></i><span class="nav-label">Changes</span></a>
            <a href="./workrequesttasks" class="nav-item"><i class="bi bi-table nav-icon"></i><span class="nav-label">Raw Data</span></a>
        </nav>
        <div class="sidebar-section">Master Card</div>
        <nav class="sidebar-nav">
            <a href="./master-card" class="nav-item"><i class="bi bi-credit-card-2-front nav-icon"></i><span class="nav-label">Rate Card</span></a>
        </nav>
        <div class="sidebar-section">Feedback</div>
        <nav class="sidebar-nav">
            <a href="./feedback" class="nav-item"><i class="bi bi-chat-left-text nav-icon"></i><span class="nav-label">Feedback</span></a>
        </nav>
        <div class="sidebar-section">Leaves</div>
        <nav class="sidebar-nav">
            <a href="./leaves" class="nav-item"><i class="bi bi-calendar-x nav-icon"></i><span class="nav-label">Leaves</span></a>
        </nav>
        <div class="sidebar-footer"><i class="bi bi-circle-fill" style="color:var(--success);font-size:8px;"></i><span class="footer-text"> System Online</span></div>
    </aside>

    <div class="main-area">
        <div class="topbar">
            <div style="display:flex;align-items:center;gap:12px;">
                <button class="sidebar-toggle" id="sidebarToggle"><i class="bi bi-chevron-left"></i></button>
                <div>
                    <div class="topbar-title"><i class="bi bi-pie-chart" style="color:var(--accent)"></i> Dashboard</div>
                    <div class="topbar-subtitle">Analytics and insights</div>
                </div>
            </div>
            <div class="topbar-right">
                <button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle theme"><i class="bi bi-sun"></i></button>
                <div class="user-info">
                    <div class="user-avatar" id="userAvatar">U</div>
                    <div class="user-details">
                        <span class="user-name" id="userName">Admin</span>
                        <span class="user-role" id="userRole">Administrator</span>
                    </div>
                </div>
                <button class="btn-logout" id="btnLogout"><i class="bi bi-box-arrow-right"></i> Logout</button>
            </div>
        </div>

        <div class="content-area">
            <iframe class="powerbi-iframe"
                    src="https://app.powerbi.com/view?r=eyJrIjoiOTg3NTg0NjAtYWZlZC00MjFkLWEwMTEtNzI2ZjRlYzJiNmFhIiwidCI6IjE4MTljZGNhLTFmMzgtNGU2My05Y2QzLTM3OTQxYTliOWRiNiJ9"
                    allowFullScreen="true"
                    loading="lazy">
            </iframe>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script>
$(function(){
    function getApiBase(){
        var p = window.location.pathname;
        var i = p.indexOf('/datatable/admin/');
        if(i > -1) return p.substring(0, i) + '/';
        if(p.indexOf('/digilabs/uat/') !== -1) return '/digilabs/uat/dmap/api/';
        return '/digilabs/dmap/api/';
    }

    // Check session
    if(!localStorage.getItem('accessToken')){
        window.location.href = getApiBase() + 'datatable/admin/login';
        return;
    }

    // Load user info
    var userData = localStorage.getItem('userData');
    if(userData){
        try {
            var user = JSON.parse(userData);
            var name = user.name || user.email || 'Admin';
            var initials = name.split(' ').map(function(n){return n[0];}).join('').substring(0,2).toUpperCase();
            $('#userName').text(name);
            $('#userAvatar').text(initials);
            if(user.jobRole && user.jobRole.role_title){
                $('#userRole').text(user.jobRole.role_title);
            }
        } catch(e){}
    }

    $('#btnLogout').on('click', function(){
        if(confirm('Are you sure you want to logout?')){
            localStorage.removeItem('accessToken');
            localStorage.removeItem('refreshToken');
            localStorage.removeItem('userData');
            window.location.href = getApiBase() + 'datatable/admin/login';
        }
    });

    $('#sidebarToggle').on('click', function(){
        $('body').toggleClass('sidebar-collapsed');
        var isCollapsed = $('body').hasClass('sidebar-collapsed');
        $(this).find('i').toggleClass('bi-chevron-left bi-chevron-right');
        localStorage.setItem('sidebarCollapsed', isCollapsed);
    });
    if(localStorage.getItem('sidebarCollapsed') === 'true'){
        $('body').addClass('sidebar-collapsed');
        $('#sidebarToggle').find('i').removeClass('bi-chevron-left').addClass('bi-chevron-right');
    }
});
</script>
</body>
</html>
