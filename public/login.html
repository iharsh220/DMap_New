<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D-Map | Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --accent: #3a5bd9;
            --accent-hover: #2a4ed9;
            --accent-light: rgba(58, 91, 217, 0.12);
            --bg: #12141a;
            --card-bg: #1b1e27;
            --border: #2c303c;
            --text-1: #e8eaf0;
            --text-2: #b8bccf;
            --text-3: #7a8196;
            --error: #ea5849;
            --success: #4ade80;
            --radius: 10px;
            --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        html, body { height: 100%; font-family: var(--font); background: var(--bg); color: var(--text-1); display: flex; align-items: center; justify-content: center; }
        .login-wrapper { width: 100%; max-width: 440px; padding: 28px; }
        .login-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 18px; box-shadow: 0 12px 48px rgba(0,0,0,.45); padding: 46px 42px; }
        .logo { display: flex; align-items: center; justify-content: center; gap: 11px; margin-bottom: 10px; }
        .logo-icon { width: 54px; height: 54px; background: linear-gradient(135deg, var(--accent), #3b82f6); border-radius: 14px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 26px; font-weight: 700; box-shadow: 0 6px 18px rgba(37,99,235,0.35); }
        .logo-text { font-size: 22px; font-weight: 700; color: var(--text-1); letter-spacing: -0.3px; }
        .login-title { text-align: center; font-size: 28px; font-weight: 700; color: var(--text-1); margin-bottom: 8px; }
        .login-subtitle { text-align: center; font-size: 15px; color: var(--text-3); margin-bottom: 36px; }
        .form-group { margin-bottom: 24px; }
        .form-group label { display: block; font-size: 14px; font-weight: 600; color: var(--text-2); margin-bottom: 9px; }
        .input-wrapper { position: relative; }
        .input-wrapper i { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--text-3); font-size: 17px; pointer-events: none; }
        .input-wrapper input { width: 100%; padding: 15px 16px 15px 48px; border: 1px solid var(--border); border-radius: 12px; font-size: 15px; font-family: var(--font); color: var(--text-1); background: var(--bg); transition: border-color .15s, box-shadow .15s; }
        .input-wrapper input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-light); }
        .input-wrapper input::placeholder { color: var(--text-3); }
        .form-options { display: flex; align-items: center; justify-content: space-between; margin-bottom: 28px; font-size: 14px; }
        .checkbox-wrapper { display: flex; align-items: center; gap: 7px; cursor: pointer; }
        .checkbox-wrapper input { width: 17px; height: 17px; accent-color: var(--accent); cursor: pointer; }
        .checkbox-wrapper span { color: var(--text-2); }
        .forgot-link { color: var(--accent); text-decoration: none; font-weight: 500; }
        .forgot-link:hover { text-decoration: underline; }
        .btn-login { width: 100%; padding: 16px; background: var(--accent); color: #fff; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; font-family: var(--font); cursor: pointer; transition: background .15s, transform .05s, box-shadow .15s; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 4px 14px rgba(37,99,235,0.30); }
        .btn-login:hover { background: var(--accent-hover); box-shadow: 0 6px 18px rgba(37,99,235,0.38); }
        .btn-login:active { transform: scale(0.99); }
        .btn-login:disabled { background: #93c5fd; cursor: not-allowed; box-shadow: none; }
        .btn-login .spinner { width: 18px; height: 18px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin .6s linear infinite; display: none; }
        .btn-login.loading .btn-text { display: none; }
        .btn-login.loading .spinner { display: block; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .login-footer { text-align: center; margin-top: 26px; font-size: 13px; color: var(--text-3); }
        .login-footer a { color: var(--accent); text-decoration: none; font-weight: 500; }
        .login-footer a:hover { text-decoration: underline; }
        .alert { padding: 14px 16px; border-radius: 12px; font-size: 14px; display: none; align-items: center; gap: 8px; margin-bottom: 20px; }
        .alert-error { background: #2a1a1a; color: var(--error); border: 1px solid #5a2a2a; }
        .alert-success { background: #1a2e1f; color: var(--success); border: 1px solid #2d6340; }
        .alert i { font-size: 17px; flex-shrink: 0; }
        .input-wrapper.error input { border-color: var(--error); }
        .input-wrapper.error input:focus { box-shadow: 0 0 0 4px rgba(234,88,73,.3); }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <div class="logo">
                <div class="logo-icon"><i class="bi bi-diagram-3"></i></div>
                <div class="logo-text">D-Map</div>
            </div>
            <h1 class="login-title">Welcome Back</h1>
            <p class="login-subtitle">Sign in to access your admin dashboard</p>

            <div id="alertBox" class="alert" role="alert"></div>

            <form id="loginForm" novalidate>
                <div class="form-group">
                    <label for="identifier">Email</label>
                    <div class="input-wrapper">
                        <i class="bi bi-envelope"></i>
                        <input type="email" id="identifier" name="identifier" placeholder="Enter your email" autocomplete="email" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <i class="bi bi-lock"></i>
                        <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required>
                    </div>
                </div>

                <div class="form-options">
                    <label class="checkbox-wrapper">
                        <input type="checkbox" name="remember" id="remember">
                        <span>Remember me</span>
                    </label>
                    <a href="#" class="forgot-link">Forgot password?</a>
                </div>

                <button type="submit" class="btn-login" id="btnLogin">
                    <span class="btn-text"><i class="bi bi-box-arrow-in-right"></i> Sign In</span>
                    <span class="spinner"></span>
                </button>
            </form>

            <div class="login-footer">Need help? <a href="#">Contact support</a></div>
        </div>
    </div>

    <script>
        (function() {
            const apiBase = getApiBase();
            const form = document.getElementById('loginForm');
            const btn = document.getElementById('btnLogin');
            const alertBox = document.getElementById('alertBox');
            const identifierInput = document.getElementById('identifier');
            const passwordInput = document.getElementById('password');

            function getApiBase() {
                var p = window.location.pathname;
                if (p.indexOf('/digilabs/uat/') !== -1) return '/digilabs/uat/dmap/api/';
                return '/digilabs/dmap/api/';
            }

            function showAlert(message, type = 'error') {
                alertBox.className = 'alert alert-' + type;
                alertBox.innerHTML = '<i class="bi bi-' + (type === 'error' ? 'exclamation-triangle' : 'check-circle') + '"></i>' + message;
                alertBox.style.display = 'flex';
            }

            function hideAlert() {
                alertBox.style.display = 'none';
            }

            function setInputError(input, hasError) {
                input.parentElement.classList.toggle('error', hasError);
            }

            function setLoading(loading) {
                btn.classList.toggle('loading', loading);
                btn.disabled = loading;
            }

            form.addEventListener('submit', async function(e) {
                e.preventDefault();
                hideAlert();
                setInputError(identifierInput, false);
                setInputError(passwordInput, false);

                const identifier = identifierInput.value.trim();
                const password = passwordInput.value;

                if (!identifier || !password) {
                    showAlert('Please enter both email and password');
                    return;
                }

                setLoading(true);

                try {
                    const res = await fetch(apiBase + 'auth/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            identifier: identifier,
                            password: password,
                            loginType: 'email'
                        })
                    });

                    const data = await res.json();

                    if (!res.ok || !data.success) {
                        showAlert(data.error || 'Login failed');
                        setInputError(passwordInput, true);
                        return;
                    }

                    // Store tokens
                    localStorage.setItem('accessToken', data.accessToken);
                    localStorage.setItem('refreshToken', data.refreshToken);
                    localStorage.setItem('userData', JSON.stringify(data.user));

                    showAlert('Login successful! Redirecting...', 'success');

                    setTimeout(() => {
                        window.location.href = getApiBase() + 'datatable/admin/projectsdetails';
                    }, 800);

                } catch (err) {
                    console.error('Login error:', err);
                    showAlert('Network error. Please try again.');
                } finally {
                    setLoading(false);
                }
            });

            // Clear error on input
            [identifierInput, passwordInput].forEach(input => {
                input.addEventListener('input', () => {
                    setInputError(input, false);
                    if (alertBox.style.display === 'flex') hideAlert();
                });
            });

            // Check if already logged in
            if (localStorage.getItem('accessToken')) {
                window.location.href = getApiBase() + 'datatable/admin/projectsdetails';
            }
        })();
    </script>
</body>
</html>
