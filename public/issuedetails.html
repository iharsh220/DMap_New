<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D-Map | Issues</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdn.datatables.net/1.13.4/css/jquery.dataTables.min.css" rel="stylesheet">
    <link href="https://cdn.datatables.net/buttons/2.3.6/css/buttons.dataTables.min.css" rel="stylesheet">
    <link href="https://cdn.datatables.net/fixedcolumns/4.3.0/css/fixedColumns.dataTables.min.css" rel="stylesheet">
    <link href="../admin/dmap-theme.css" rel="stylesheet">
</head>
<body>
<div class="app-layout">

    <aside class="sidebar">
        <div class="sidebar-brand">
            <div class="brand-icon">D</div>
            <div><div class="brand-name">D-Map</div><div class="brand-sub">Analytics Dashboard</div></div>
        </div>
        <div class="sidebar-section">Reports</div>
        <nav class="sidebar-nav">
            <a href="./projectsdetails"  class="nav-item"><i class="bi bi-folder2-open nav-icon"></i>Projects</a>
            <a href="./taskdetails"      class="nav-item"><i class="bi bi-check2-square nav-icon"></i>Tasks</a>
            <a href="./issuedetails"     class="nav-item active"><i class="bi bi-exclamation-circle nav-icon"></i>Issues</a>
            <a href="./workrequesttasks" class="nav-item"><i class="bi bi-table nav-icon"></i>Raw Data</a>
        </nav>
        <div class="sidebar-footer"><i class="bi bi-circle-fill" style="color:#22c55e;font-size:8px;"></i> System Online</div>
    </aside>

    <div class="main-area">
        <div class="topbar">
            <div>
                <div class="topbar-title"><i class="bi bi-exclamation-circle" style="color:var(--accent)"></i> Issues</div>
                <div class="topbar-subtitle">Issue level breakdown per task</div>
            </div>
            <div class="topbar-right"><span class="topbar-badge" id="recordCount">Loading...</span></div>
        </div>

        <div class="content-area">
            <div class="stats-row">
                <div class="stat-card"><div class="stat-icon blue"><i class="bi bi-exclamation-circle"></i></div><div><div class="stat-value" id="s1">—</div><div class="stat-label">Total Issues</div></div></div>
                <div class="stat-card"><div class="stat-icon green"><i class="bi bi-check-circle"></i></div><div><div class="stat-value" id="s2">—</div><div class="stat-label">Completed</div></div></div>
                <div class="stat-card"><div class="stat-icon orange"><i class="bi bi-arrow-repeat"></i></div><div><div class="stat-value" id="s3">—</div><div class="stat-label">In Progress</div></div></div>
                <div class="stat-card"><div class="stat-icon purple"><i class="bi bi-clock-history"></i></div><div><div class="stat-value" id="s4">—</div><div class="stat-label">Pending</div></div></div>
            </div>

            <div class="table-card">
                <div class="loading-overlay" id="loader"><div class="spinner"></div><div class="loading-text">Loading issues...</div></div>
                <div class="table-card-header">
                    <div class="table-card-title"><span class="dot"></span>Issue Records</div>
                    <div class="header-actions">
                        <button class="btn-action excel" id="btnExcel"><i class="bi bi-file-earmark-excel"></i> Excel</button>
                        <button class="btn-action csv"   id="btnCsv"><i class="bi bi-filetype-csv"></i> CSV</button>
                    </div>
                </div>
                <div class="table-card-body">
                    <div class="dt-container">
                        <table id="mainTable" class="display" style="width:100%"><thead></thead><tbody></tbody></table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Edit Modal -->
<div id="editModal" style="display:none;position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,0.55);align-items:center;justify-content:center;">
  <div style="background:#1e2433;border:1px solid #2d3548;border-radius:12px;width:560px;max-width:95vw;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 8px 40px rgba(0,0,0,0.5);">
    <div style="padding:20px 24px 16px;border-bottom:1px solid #2d3548;display:flex;align-items:center;gap:10px;">
      <span style="background:#6366f122;border-radius:8px;padding:6px 10px;"><i class="bi bi-pencil-square" style="color:#818cf8;font-size:18px;"></i></span>
      <div>
        <div style="color:#f1f5f9;font-weight:600;font-size:15px;">Edit Issue</div>
        <div style="color:#94a3b8;font-size:12px;">Update issue details</div>
      </div>
      <button onclick="closeEditModal()" style="margin-left:auto;background:none;border:none;color:#64748b;font-size:20px;cursor:pointer;line-height:1;">&times;</button>
    </div>
    <div style="padding:16px 24px;overflow-y:auto;flex:1;">
      <div id="editModalBody" style="color:#cbd5e1;font-size:13px;"></div>
    </div>
    <div style="padding:16px 24px;border-top:1px solid #2d3548;display:flex;gap:10px;justify-content:flex-end;">
      <button onclick="closeEditModal()" style="padding:8px 20px;border-radius:7px;border:1px solid #2d3548;background:#2d3548;color:#94a3b8;font-size:13px;cursor:pointer;">Cancel</button>
      <button id="confirmEditBtn" style="padding:8px 20px;border-radius:7px;border:none;background:#6366f1;color:#fff;font-size:13px;font-weight:600;cursor:pointer;"><i class="bi bi-check-lg"></i> Save Changes</button>
    </div>
  </div>
</div>

<!-- Delete Confirm Modal -->
<div id="deleteModal" style="display:none;position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,0.55);align-items:center;justify-content:center;">
  <div style="background:#1e2433;border:1px solid #2d3548;border-radius:12px;width:520px;max-width:95vw;max-height:85vh;display:flex;flex-direction:column;box-shadow:0 8px 40px rgba(0,0,0,0.5);">
    <div style="padding:20px 24px 16px;border-bottom:1px solid #2d3548;display:flex;align-items:center;gap:10px;">
      <span style="background:#be123c22;border-radius:8px;padding:6px 10px;"><i class="bi bi-exclamation-triangle-fill" style="color:#f43f5e;font-size:18px;"></i></span>
      <div>
        <div style="color:#f1f5f9;font-weight:600;font-size:15px;">Confirm Delete</div>
        <div style="color:#94a3b8;font-size:12px;">This action cannot be undone</div>
      </div>
      <button onclick="closeDeleteModal()" style="margin-left:auto;background:none;border:none;color:#64748b;font-size:20px;cursor:pointer;line-height:1;">&times;</button>
    </div>
    <div style="padding:16px 24px;overflow-y:auto;flex:1;">
      <div id="deleteModalBody" style="color:#cbd5e1;font-size:13px;"></div>
    </div>
    <div style="padding:16px 24px;border-top:1px solid #2d3548;display:flex;gap:10px;justify-content:flex-end;">
      <button onclick="closeDeleteModal()" style="padding:8px 20px;border-radius:7px;border:1px solid #2d3548;background:#2d3548;color:#94a3b8;font-size:13px;cursor:pointer;">Cancel</button>
      <button id="confirmDeleteBtn" style="padding:8px 20px;border-radius:7px;border:none;background:#be123c;color:#fff;font-size:13px;font-weight:600;cursor:pointer;"><i class="bi bi-trash3"></i> Yes, Delete</button>
    </div>
  </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.3.6/js/dataTables.buttons.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.3.6/js/buttons.html5.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdn.datatables.net/fixedcolumns/4.3.0/js/dataTables.fixedColumns.min.js"></script>
<script>
const TRUNCATE=['issue_types_with_description','issue_digi_comments','issue_requester_description','about_issue'];
const HEADERS={
    work_request_id:'work_request_id',task_id:'task_id',issue_id:'issue_id',task_name:'task_name',brand:'brand',
    issue_request_type_name:'issue_request_type_name',vertical_manger_name:'vertical_manager_name',
    task_type_name:'task_type_name',issue_requester_name:'issue_requester_name',
    issue_assignment_type:'issue_assignment_type',assigned_user_name:'assigned_user_name',
    issue_version:'issue_version',project_count:'project_count',task_count:'task_count',
    issue_task_count:'issue_task_count',task_no_of_work_pages:'task_no_of_work_pages',
    issue_no_of_work_pages:'issue_no_of_work_pages',issue_no_of_options_provided:'issue_no_of_options_provided',
    issue_concept_work:'issue_concept_work',issue_no_of_concepts:'issue_no_of_concepts',
    issue_resize_work:'issue_resize_work',issue_no_of_resize:'issue_no_of_resize',issue_ai:'issue_ai',
    issue_no_of_ai_page:'issue_no_of_ai_page',issue_duration_minutes:'issue_duration_minutes',
    issue_duration_seconds:'issue_duration_seconds',issue_no_of_products_shot:'issue_no_of_products_shot',
    issue_shoot_setup:'issue_shoot_setup',issue_no_of_words_written:'issue_no_of_words_written',
    issue_responsive_screen:'issue_responsive_screen',issue_requested_at_client:'issue_requested_at_client',
    issue_requested_accept_at_cm:'issue_requested_accept_at_cm',
    issue_requested_atassign_intimate_cu:'issue_requested_atassign_intimate_cu',
    issue_requested_accept_at_cu:'issue_requested_accept_at_cu',issue_shared_with_cm_at:'issue_shared_with_cm_at',
    issue_respond_on_output_cm:'issue_respond_on_output_cm',
    issue_output_shared_with_client_at:'issue_output_shared_with_client_at',
    issue_output_client_responded_approve:'issue_output_client_responded_approve',
    issue_start_date:'issue_start_date',issue_end_date:'issue_end_date',issue_deadline:'issue_deadline',
    issue_review:'issue_review',issue_review_stage:'issue_review_stage',issue_status:'issue_status',
    issue_created_at:'issue_created_at',issue_updated_at:'issue_updated_at',
    issue_types:'issue_types',issue_types_with_description:'issue_types_with_description',
    issue_digi_comments:'issue_digi_comments',issue_requester_description:'issue_requester_description',
    about_issue:'about_issue',issue_requester_department:'issue_requester_department',month:'month',fy:'fy'
};
const BADGES={
    issue_status:{m_pending:'status-m_pending',u_pending:'status-u_pending',m_accepted:'status-m_accepted',u_accepted:'status-u_accepted',in_progress:'status-in_progress',completed:'status-completed',rejected:'status-rejected',on_hold:'status-on_hold',cancelled:'status-cancelled'},
    issue_review:{approved:'review-approved',pending:'review-pending',change_request:'review-change_request'},
    issue_review_stage:{not_started:'stage-not_started',manager_review:'stage-manager_review',pm_review:'stage-pm_review',change_requested:'stage-change_requested',final_approved:'stage-final_approved'},
    issue_assignment_type:{new:'status-accepted',mod:'status-assigned'}
};
const BOOLS=['issue_concept_work','issue_resize_work','issue_shoot_setup','issue_responsive_screen'];

$(function(){
    $.getJSON('./issuedetails/data',function(res){
        $('#loader').hide();
        var data=res.data||[];
        $('#recordCount').text(data.length+' Records');
        $('#s1').text(data.length);
        $('#s2').text(data.filter(r=>r.issue_status==='completed').length);
        $('#s3').text(data.filter(r=>r.issue_status==='in_progress').length);
        $('#s4').text(data.filter(r=>r.issue_status==='m_pending'||r.issue_status==='u_pending').length);

        var cols=[];
        if(data.length){
            cols.push({
                data:null, title:'Action', orderable:false, searchable:false, width:'80px',
                render:function(v,type,row){
                    if(type!=='display') return '';
                    return '<button class="edit-btn" data-type="issue" data-id="'+row.issue_id+'" title="Edit Issue" style="background:#6366f122;border:1px solid #6366f144;color:#818cf8;border-radius:6px;padding:3px 7px;cursor:pointer;font-size:13px;margin-right:4px;"><i class="bi bi-pencil"></i></button>'
                          +'<button class="del-btn" data-type="issue" data-id="'+row.issue_id+'" title="Delete Issue" style="background:#be123c22;border:1px solid #be123c44;color:#f43f5e;border-radius:6px;padding:3px 7px;cursor:pointer;font-size:13px;"><i class="bi bi-trash3"></i></button>';
                }
            });
            Object.keys(data[0]).forEach(function(k){
                cols.push({
                    data:k,title:HEADERS[k]||k,defaultContent:'N/A',
                    render:function(v,type){
                        if(type!=='display')return v;
                        var val=v!=null?v:'N/A';
                        if(BADGES[k]&&val&&val!=='N/A'){var c=BADGES[k][val]||'';return '<span class="status-badge '+c+'">'+val+'</span>';}
                        if(BOOLS.indexOf(k)!==-1){var y=val==1||val===true||val==='true';return '<span class="status-badge '+(y?'bool-yes':'bool-no')+'">'+(y?'Yes':'No')+'</span>';}
                        if(TRUNCATE.indexOf(k)!==-1)return '<span class="truncate-cell" title="'+String(val).replace(/"/g,'&quot;')+'">'+val+'</span>';
                        return val;
                    }
                });
            });
        }

        var dt=$('#mainTable').DataTable({
            data:data,columns:cols,
            pageLength:25,lengthMenu:[[25,50,100,200,-1],[25,50,100,200,'All']],
            dom:'<"dt-top-row"lf>rt<"dt-bottom-row"ip>',
            scrollX:true,scrollY:'calc(100vh - 360px)',scrollCollapse:false,autoWidth:false,fixedColumns:{left:4},
            language:{search:'',searchPlaceholder:'Search all columns...',lengthMenu:'Show _MENU_ rows'},
            initComplete:function(){
                var api=this.api();
                api.columns().every(function(){
                    var col=this,idx=col.index();
                    var th=$(col.header());
                    var labelText=idx===0?'Action':(HEADERS[Object.keys(data[0])[idx-1]]||Object.keys(data[0])[idx-1]);
                    th.empty();
                    var wrap=$('<div class="th-wrap"></div>');
                    wrap.append('<div class="th-label"><span>'+labelText+'</span><span class="th-sort"></span></div>');
                    if(idx===0){ th.append(wrap); return; }
                    var key=Object.keys(data[0])[idx-1];
                    if(BADGES[key]){
                        var sel=$('<select class="col-filter"><option value="">All</option></select>');
                        Object.keys(BADGES[key]).forEach(function(o){sel.append('<option value="'+o+'">'+o+'</option>');});
                        sel.on('change click mousedown',function(e){e.stopPropagation();});
                        sel.on('change',function(){col.search(this.value).draw();});
                        wrap.append(sel);
                    } else if(BOOLS.indexOf(key)!==-1){
                        var sel=$('<select class="col-filter"><option value="">All</option><option value="1">Yes</option><option value="0">No</option></select>');
                        sel.on('change click mousedown',function(e){e.stopPropagation();});
                        sel.on('change',function(){col.search(this.value).draw();});
                        wrap.append(sel);
                    } else {
                        var inp=$('<input class="col-filter" type="text" placeholder="Filter...">');
                        inp.on('click mousedown focus',function(e){e.stopPropagation();});
                        inp.on('keyup change clear',function(){if(col.search()!==this.value)col.search(this.value).draw();});
                        wrap.append(inp);
                    }
                    th.append(wrap);
                    th.off('click').on('click',function(e){if($(e.target).closest('.col-filter').length===0)api.order([idx,'asc']).draw();});
                });
            }
        });
        $('#mainTable').on('click','.del-btn',function(e){e.stopPropagation();openDeleteModal($(this).data('type'),$(this).data('id'));});
        $('#mainTable').on('click','.edit-btn',function(e){e.stopPropagation();openEditModal($(this).data('type'),$(this).data('id'));});
        var colTitles=cols.map(function(c){return c.title;});
        new $.fn.dataTable.Buttons(dt,[
            {extend:'excel',className:'buttons-excel',filename:'issues_'+new Date().toISOString().slice(0,10),exportOptions:{columns:':visible',format:{header:function(data,col){return colTitles[col]||data;}}}},
            {extend:'csv',className:'buttons-csv',filename:'issues_'+new Date().toISOString().slice(0,10),exportOptions:{columns:':visible',format:{header:function(data,col){return colTitles[col]||data;}}}}
        ]);
        $('#btnExcel').on('click',function(){dt.button('.buttons-excel').trigger();});
        $('#btnCsv').on('click',function(){dt.button('.buttons-csv').trigger();});
    }).fail(function(){$('#loader').html('<div style="color:#be123c;font-size:13px"><i class="bi bi-exclamation-triangle"></i> Failed to load data</div>');});
});

function inp(label,name,val,type){
    type=type||'text';
    return '<div style="margin-bottom:12px;"><label style="display:block;color:#94a3b8;font-size:11px;margin-bottom:4px;">'+label+'</label>'
        +'<input name="'+name+'" value="'+(val!=null?String(val).replace(/"/g,'&quot;'):'')+'" type="'+type+'" style="width:100%;background:#131929;border:1px solid #2d3548;border-radius:6px;padding:7px 10px;color:#e2e8f0;font-size:13px;box-sizing:border-box;"></div>';
}
function sel(label,name,val,opts){
    var s='<div style="margin-bottom:12px;"><label style="display:block;color:#94a3b8;font-size:11px;margin-bottom:4px;">'+label+'</label>'
        +'<select name="'+name+'" style="width:100%;background:#131929;border:1px solid #2d3548;border-radius:6px;padding:7px 10px;color:#e2e8f0;font-size:13px;">';
    opts.forEach(function(o){s+='<option value="'+o+'"'+(String(val)===String(o)?' selected':'')+'>'+o+'</option>';});
    return s+'</select></div>';
}
function ta(label,name,val){
    return '<div style="margin-bottom:12px;"><label style="display:block;color:#94a3b8;font-size:11px;margin-bottom:4px;">'+label+'</label>'
        +'<textarea name="'+name+'" rows="2" style="width:100%;background:#131929;border:1px solid #2d3548;border-radius:6px;padding:7px 10px;color:#e2e8f0;font-size:13px;box-sizing:border-box;resize:vertical;">'+(val||'')+'</textarea></div>';
}

function openEditModal(type, id){
    $('#editModalBody').html('<div style="color:#94a3b8;padding:20px;text-align:center;"><i class="bi bi-arrow-repeat"></i> Loading...</div>');
    $('#editModal').css('display','flex');
    $.getJSON('/digilabs/dmap/api/datatable/admin/edit/'+type+'/'+id, function(res){
        var r=res.record, html='';
        html+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:0 16px;">';
        html+=inp('Version','version',r.version);
        html+=sel('Status','status',r.status,['m_pending','u_pending','m_accepted','u_accepted','in_progress','completed','rejected','on_hold','cancelled']);
        html+=sel('Review','review',r.review,['pending','approved','change_request']);
        html+=sel('Review Stage','review_stage',r.review_stage,['not_started','manager_review','pm_review','change_requested','final_approved']);
        html+=sel('Assignment Type','assignment_type',r.assignment_type,['new','mod']);
        html+=inp('Start Date','start_date',r.start_date?String(r.start_date).slice(0,16):'','datetime-local');
        html+=inp('End Date','end_date',r.end_date?String(r.end_date).slice(0,16):'','datetime-local');
        html+=inp('Deadline','deadline',r.deadline?String(r.deadline).slice(0,16):'','datetime-local');
        html+=inp('Work Pages (task_count)','task_count',r.task_count,'number');
        html+=inp('No. of Options Provided','no_of_options_provided',r.no_of_options_provided,'number');
        html+=inp('No. of Concepts','no_of_concepts',r.no_of_concepts,'number');
        html+=inp('No. of Resize','no_of_resize',r.no_of_resize,'number');
        html+=inp('AI/Images/Videos/Audio','no_of_images_videos_audio',r.no_of_images_videos_audio,'number');
        html+=inp('Duration Minutes','duration_minutes',r.duration_minutes,'number');
        html+=inp('Duration Seconds','duration_seconds',r.duration_seconds,'number');
        html+=inp('No. of Products Shot','no_of_products_shot',r.no_of_products_shot,'number');
        html+=inp('No. of Words Written','no_of_words_written',r.no_of_words_written,'number');
        html+=inp('No. of Responsive Screen','no_of_responsive_screen',r.no_of_responsive_screen,'number');
        html+=sel('Concept Work','concept_work',r.concept_work,[0,1]);
        html+=sel('Resize Work','resize_work',r.resize_work,[0,1]);
        html+=sel('Shoot Setup','shoot_setup',r.shoot_setup,[0,1]);
        html+=sel('Responsive Screen','responsive_screen',r.responsive_screen,[0,1]);
        html+=sel('Intimate Team','intimate_team',r.intimate_team,[0,1]);
        html+=sel('Intimate Client','intimate_client',r.intimate_client,[0,1]);
        html+=inp('Link','link',r.link);
        html+='</div>';
        html+=ta('Comments','comments',r.comments);
        html+=ta('Description','description',r.description);
        $('#editModalBody').html(html);
        $('#confirmEditBtn').off('click').on('click',function(){ submitEdit(type,id); });
    }).fail(function(){ $('#editModalBody').html('<div style="color:#f43f5e;">Failed to load data.</div>'); });
}
function closeEditModal(){ $('#editModal').hide(); }
function submitEdit(type,id){
    var payload={};
    $('#editModalBody input,#editModalBody select,#editModalBody textarea').each(function(){ payload[this.name]=this.value; });
    $('#confirmEditBtn').prop('disabled',true).html('<i class="bi bi-arrow-repeat"></i> Saving...');
    $.ajax({
        url:'/digilabs/dmap/api/datatable/admin/edit/'+type+'/'+id,
        method:'PUT', contentType:'application/json',
        data:JSON.stringify(payload),
        success:function(){ closeEditModal(); location.reload(); },
        error:function(){ $('#confirmEditBtn').prop('disabled',false).html('<i class="bi bi-check-lg"></i> Save Changes'); alert('Update failed. Please try again.'); }
    });
}

function openDeleteModal(type, id){
    $('#deleteModalBody').html('<div style="color:#94a3b8;padding:20px;text-align:center;"><i class="bi bi-arrow-repeat"></i> Loading preview...</div>');
    $('#deleteModal').css('display','flex');
    $.getJSON('/digilabs/dmap/api/datatable/admin/delete/preview/'+type+'/'+id, function(res){
        var p=res.preview, r=p.record, html='';
        html='<div style="background:#be123c11;border:1px solid #be123c33;border-radius:8px;padding:12px 16px;margin-bottom:14px;">';
        html+='<div style="color:#f43f5e;font-weight:600;margin-bottom:6px;"><i class="bi bi-exclamation-circle"></i> Issue to be deleted</div>';
        html+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;">';
        html+='<div><span style="color:#64748b;">Issue ID:</span> <span style="color:#e2e8f0;">'+r.id+'</span></div>';
        html+='<div><span style="color:#64748b;">Task:</span> <span style="color:#e2e8f0;">'+(r.task_name||'N/A')+'</span></div>';
        html+='<div><span style="color:#64748b;">Project:</span> <span style="color:#e2e8f0;">'+(r.project_name||'N/A')+'</span></div>';
        html+='<div><span style="color:#64748b;">Type:</span> <span style="color:#e2e8f0;">'+(r.assignment_type||'N/A')+'</span></div>';
        html+='<div><span style="color:#64748b;">Version:</span> <span style="color:#e2e8f0;">v'+(r.version||'1')+'</span></div>';
        html+='<div><span style="color:#64748b;">Status:</span> <span style="color:#e2e8f0;">'+(r.status||'N/A')+'</span></div>';
        html+='</div></div>';
        html+='<div style="color:#22c55e;font-size:12px;"><i class="bi bi-check-circle"></i> Only this issue record will be deleted.</div>';
        $('#deleteModalBody').html(html);
        $('#confirmDeleteBtn').off('click').on('click',function(){ confirmDelete(type,id); });
    }).fail(function(){ $('#deleteModalBody').html('<div style="color:#f43f5e;">Failed to load preview.</div>'); });
}
function closeDeleteModal(){ $('#deleteModal').hide(); }
function confirmDelete(type,id){
    $('#confirmDeleteBtn').prop('disabled',true).html('<i class="bi bi-arrow-repeat"></i> Deleting...');
    $.ajax({ url:'/digilabs/dmap/api/datatable/admin/delete/'+type+'/'+id, method:'DELETE',
        success:function(){ closeDeleteModal(); location.reload(); },
        error:function(){ $('#confirmDeleteBtn').prop('disabled',false).html('<i class="bi bi-trash3"></i> Yes, Delete'); alert('Delete failed. Please try again.'); }
    });
}
</script>
</body>
