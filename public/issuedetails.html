<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Issues</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdn.datatables.net/1.13.4/css/dataTables.bootstrap5.min.css" rel="stylesheet">
    <link href="https://cdn.datatables.net/buttons/2.3.6/css/buttons.bootstrap5.min.css" rel="stylesheet">
    <style>
        html, body { height: 100%; overflow: hidden; background: #f8f9fa; }
        #mainContent { height: 100vh; overflow: hidden; }
        .datatable-wrapper { background: #fff; padding: 15px; border-radius: 6px; height: calc(100vh - 110px); display: flex; flex-direction: column; }
        .dataTables_scrollBody { overflow-y: auto !important; overflow-x: auto !important; }
        table.dataTable thead th, table.dataTable tbody td { white-space: nowrap; font-size: 11px; padding: 4px 7px; }
        .truncate-cell { max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
        .dt-buttons { float: right; }
        .status-badge { padding: 3px 6px; border-radius: 4px; font-size: 10px; font-weight: 500; }
        .status-m_pending   { background-color: #fff3cd; color: #856404; }
        .status-u_pending   { background-color: #ffe5d0; color: #7d3c00; }
        .status-m_accepted  { background-color: #cce5ff; color: #004085; }
        .status-u_accepted  { background-color: #d1ecf1; color: #0c5460; }
        .status-in_progress { background-color: #d4edda; color: #155724; }
        .status-completed   { background-color: #155724; color: #fff; }
        .status-rejected    { background-color: #f8d7da; color: #721c24; }
        .status-on_hold     { background-color: #e2e3e5; color: #383d41; }
        .status-cancelled   { background-color: #f8d7da; color: #721c24; }
        .review-approved        { background-color: #d4edda; color: #155724; }
        .review-pending         { background-color: #fff3cd; color: #856404; }
        .review-change_request  { background-color: #f8d7da; color: #721c24; }
        .stage-not_started      { background-color: #e2e3e5; color: #383d41; }
        .stage-manager_review   { background-color: #cce5ff; color: #004085; }
        .stage-pm_review        { background-color: #d1ecf1; color: #0c5460; }
        .stage-change_requested { background-color: #f8d7da; color: #721c24; }
        .stage-final_approved   { background-color: #155724; color: #fff; }
        .bool-yes { background-color: #d4edda; color: #155724; }
        .bool-no  { background-color: #e2e3e5; color: #383d41; }
        .nav-tabs .nav-link.active { font-weight: 600; }
    </style>
</head>

<body>
    <div class="flex-grow-1" id="mainContent">
        <div class="container-fluid pt-3">
            <ul class="nav nav-tabs mb-3">
                <li class="nav-item">
                    <a class="nav-link" href="./projectsdetails">Projects</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="./taskdetails">Tasks</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" href="./issuedetails">Issues</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="./workrequesttasks">Raw Data</a>
                </li>
            </ul>

            <div class="datatable-wrapper">
                <table id="issueDetailsTable" class="table table-bordered table-striped w-100">
                    <thead id="tableHead"></thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.4/js/dataTables.bootstrap5.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.3.6/js/dataTables.buttons.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.3.6/js/buttons.bootstrap5.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.3.6/js/buttons.html5.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script>
        const TRUNCATE_FIELDS = ['issue_types_with_description', 'issue_digi_comments', 'issue_Requester_description', 'about_issue'];

        const COLUMN_HEADERS = {
            work_request_id:                        'Work Request ID',
            task_id:                                'Task ID',
            issue_id:                               'Issue ID',
            task_name:                              'Task Name',
            brand:                                  'Brand',
            Issue_request_type_name:                'Issue Request Type',
            Vertical_Manager_name:                  'Vertical Manager Name',
            task_type_name:                         'Task Type',
            issue_requester_name:                   'Issue Requester Name',
            issue_assignment_type:                  'Assignment Type',
            assigned_user_name:                     'Assigned User',
            issue_version:                          'Version',
            project_count:                          'Project Count',
            task_no_of_work_pages:                  'Task Work Pages',
            issue_task_count:                       'Issue Task Count',
            issue_no_of_work_pages:                 'Issue Work Pages',
            issue_no_of_options_provided:           'No. of Options Provided',
            issue_concept_work:                     'Concept Work',
            issue_no_of_concepts:                   'No. of Concepts',
            issue_resize_work:                      'Resize Work',
            issue_no_of_resize:                     'No. of Resize',
            issue_AI:                               'Issue AI',
            issue_no_of_AI_Page:                    'No. of AI Pages',
            issue_duration_minutes:                 'Duration (Min)',
            issue_duration_seconds:                 'Duration (Sec)',
            issue_no_of_products_shot:              'No. of Products Shot',
            issue_shoot_setup:                      'Shoot Setup',
            issue_no_of_words_written:              'No. of Words Written',
            issue_responsive_screen:                'Responsive Screen',
            issue_requested_at_Client:              'Issue Requested At Client',
            issue_requested_accept_at_CM:           'Issue Accepted At CM',
            Issue_requested_atassign_intimate_CU:   'Issue Assigned & Intimate CU',
            Issue_requested_accept_at_CU:           'Issue Accepted At CU',
            Issue_shared_with_CM_at:                'Issue Shared With CM At',
            Issue_respond_on_output_CM:             'CM Responded On Output',
            Issue_Output_shared_with_Client_at:     'Output Shared With Client At',
            Issue_Output_Client_Responded_Approve:  'Client Responded / Approved',
            issue_start_date:                       'Issue Start Date',
            issue_end_date:                         'Issue End Date',
            issue_deadline:                         'Issue Deadline',
            issue_review:                           'Issue Review',
            issue_review_stage:                     'Issue Review Stage',
            issue_status:                           'Issue Status',
            issue_created_at:                       'Issue Created At',
            issue_updated_at:                       'Issue Updated At',
            issue_types:                            'Issue Types',
            issue_types_with_description:           'Issue Types With Description',
            issue_digi_comments:                    'Digi Comments',
            issue_Requester_description:            'Issue Description',
            about_issue:                            'About Issue',
            issue_requester_department:             'Requester Department',
            month:                                  'Month',
            fy:                                     'Financial Year'
        };

        const BADGE_FIELDS = {
            issue_status: {
                m_pending:   'status-m_pending',
                u_pending:   'status-u_pending',
                m_accepted:  'status-m_accepted',
                u_accepted:  'status-u_accepted',
                in_progress: 'status-in_progress',
                completed:   'status-completed',
                rejected:    'status-rejected',
                on_hold:     'status-on_hold',
                cancelled:   'status-cancelled'
            },
            issue_review: {
                approved:       'review-approved',
                pending:        'review-pending',
                change_request: 'review-change_request'
            },
            issue_review_stage: {
                not_started:      'stage-not_started',
                manager_review:   'stage-manager_review',
                pm_review:        'stage-pm_review',
                change_requested: 'stage-change_requested',
                final_approved:   'stage-final_approved'
            }
        };

        const BOOL_FIELDS = ['issue_concept_work', 'issue_resize_work', 'issue_shoot_setup', 'issue_responsive_screen'];

        $(document).ready(function() {
            $.getJSON('./issuedetails/data', function(response) {
                var columns = [];
                if (response.data && response.data.length > 0) {
                    Object.keys(response.data[0]).forEach(function(key) {
                        columns.push({
                            data: key,
                            title: COLUMN_HEADERS[key] || key,
                            defaultContent: 'N/A',
                            render: function(data, type, row) {
                                if (type !== 'display') return data;
                                var val = data !== null && data !== undefined ? data : 'N/A';

                                if (BADGE_FIELDS[key] && val && val !== 'N/A') {
                                    var cls = BADGE_FIELDS[key][val] || '';
                                    return '<span class="status-badge ' + cls + '">' + val + '</span>';
                                }

                                if (BOOL_FIELDS.indexOf(key) !== -1) {
                                    var isYes = val == 1 || val === true || val === 'true';
                                    return '<span class="status-badge ' + (isYes ? 'bool-yes' : 'bool-no') + '">' + (isYes ? 'Yes' : 'No') + '</span>';
                                }

                                if (TRUNCATE_FIELDS.indexOf(key) !== -1) {
                                    return '<div class="truncate-cell" title="' + String(val).replace(/"/g, '&quot;') + '">' + val + '</div>';
                                }

                                return val;
                            }
                        });
                    });
                }

                $('#issueDetailsTable').DataTable({
                    data: response.data,
                    columns: columns,
                    pageLength: 25,
                    lengthMenu: [[25, 50, 100, 200, -1], [25, 50, 100, 200, 'All']],
                    dom: 'lBfrtip',
                    scrollX: true,
                    scrollY: '60vh',
                    scrollCollapse: true,
                    buttons: [
                        {
                            extend: 'excel',
                            text: '<i class="bi bi-file-earmark-excel"></i> Excel',
                            className: 'btn btn-success btn-sm',
                            titleAttr: 'Export to Excel',
                            filename: function() { return 'issue_details_' + new Date().toISOString().slice(0, 10); },
                            exportOptions: { columns: ':visible' }
                        },
                        {
                            extend: 'csv',
                            text: '<i class="bi bi-filetype-csv"></i> CSV',
                            className: 'btn btn-secondary btn-sm',
                            titleAttr: 'Export to CSV',
                            filename: function() { return 'issue_details_' + new Date().toISOString().slice(0, 10); },
                            exportOptions: { columns: ':visible' }
                        }
                    ],
                    initComplete: function() {
                        this.api().columns().every(function() {
                            var column = this;
                            $('<input type="text" class="form-control form-control-sm" placeholder="Filter" style="width:100%;font-size:10px;padding:2px 4px;margin-top:2px;" />')
                                .appendTo($(column.header()))
                                .on('keyup change clear', function() {
                                    if (column.search() !== this.value) {
                                        column.search(this.value).draw();
                                    }
                                });
                        });
                    }
                });
            }).fail(function() {
                console.error('Failed to load issue data from API');
            });
        });
    </script>
</body>

</html>
