<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Changes · D-Map Admin</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235b2be0'/%3E%3Ctext x='16' y='22' font-family='Arial' font-size='16' font-weight='700' fill='white' text-anchor='middle'%3ED%3C/text%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="../admin/dmap-theme.css" rel="stylesheet">
    <script>try{document.documentElement.setAttribute('data-theme',localStorage.getItem('themePreference')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'))}catch(e){}</script>
    <script src="../admin/admin-app.js" defer></script>
</head>
<body>
<noscript>The D-Map admin panel needs JavaScript.</noscript>
<script>
document.addEventListener('DOMContentLoaded', function () {
    const D = window.DMap;
    const OPEN = ['m_pending', 'm_accepted', 'u_pending', 'u_accepted', 'in_progress', 'on_hold'];
    const yesterday = () => { const d = new Date(); d.setDate(d.getDate() - 1); return D.isoDay(d); };
    const C = (key, title, type, extra) => Object.assign({ key, title, type }, extra || {});

    const body = D.shell({ page: 'issuedetails', title: 'Changes', icon: 'arrow-repeat', subtitle: 'Change requests (V2, V3 …) raised on tasks: who handles them, effort, cost and turnaround' });

    const grid = D.grid(body, {
        id: 'changes', version: 4, title: 'Changes', icon: 'arrow-repeat',
        endpoint: 'issuedetails/data', exportName: 'changes', pinned: 4,
        searchPlaceholder: 'Search task, type, client, status or request ID…',
        quick: ['issue_status', 'task_type_name', 'assigned_creative_user', 'issue_deadline'],
        kpis: [
            { label: 'Total changes', icon: 'arrow-repeat', tone: 'brand', value: s => s.total, hint: s => `on ${D.fmt.num(s.tasks)} tasks` },
            { label: 'Completed', icon: 'check-circle', tone: 'success', value: s => s.completed, share: true, filter: { key: 'issue_status', values: ['completed'] } },
            { label: 'In progress', icon: 'arrow-repeat', tone: 'info', value: s => s.in_progress, share: true, filter: { key: 'issue_status', values: ['in_progress'] } },
            { label: 'Pending', icon: 'hourglass-split', tone: 'warning', value: s => s.pending, share: true, hint: () => 'Waiting for manager or user', filter: { key: 'issue_status', values: ['m_pending', 'u_pending'] } },
            { label: 'Overdue', icon: 'alarm', tone: 'danger', value: s => s.overdue, hint: () => 'Open past the deadline',
              filter: { key: 'issue_deadline', type: 'range', from: '', to: yesterday(), also: { issue_status: { type: 'exact', values: OPEN } } } }
        ],
        statusBar: { column: 'issue_status', title: 'Change status breakdown' },
        columns: [
            C('issue_status', 'Change Status', 'status', { options: 'issue_statuses' }),
            C('work_request_id', 'Project Request ID', 'id'),
            C('task_id', 'Task ID', 'id'),
            C('issue_id', 'Change ID', 'id'),
            C('task_name', 'Task Name', 'name'),
            C('task_type_name', 'Task Type', 'text', { filter: 'select', options: 'task_types' }),
            C('issue_requester_name', 'Client Name', 'text', { filter: 'select', options: 'clients' }),
            C('client_division', 'Client Division', 'text', { filter: 'select', options: 'divisions', match: 'contains' }),
            C('project_manager', 'Project Manager', 'text', { filter: 'select', options: 'managers', match: 'contains' }),
            C('project_manager_vertical', 'Project Manager Vertical', 'text', { filter: 'select', options: 'divisions', match: 'contains' }),
            C('task_manager', 'Task Manager', 'text', { filter: 'select', options: 'managers', match: 'contains' }),
            C('task_manager_vertical', 'Task Manager Vertical', 'text', { filter: 'select', options: 'divisions', match: 'contains' }),
            C('assigned_creative_user', 'Assigned Creative User', 'text', { filter: 'select', options: 'creative_team', match: 'contains' }),
            C('cu_vertical', 'CU Vertical', 'text', { filter: 'select', options: 'divisions', match: 'contains' }),
            C('issue_start_date', 'Change Start Date', 'date'),
            C('issue_end_date', 'Change End Date', 'date'),
            C('issue_deadline', 'Change Deadline', 'date'),
            C('task_no_of_work_pages', 'No. of Work Pages', 'number'),
            C('issue_no_of_work_pages', 'No. of Change Pages', 'number'),
            C('issue_cost', 'Issue Cost', 'money', { adminOnly: true }),
            C('issue_no_of_options_provided', 'No. of Options', 'number'),
            C('issue_concept_work', 'No. of Concept Created', 'bool'),
            C('issue_no_of_concepts', 'No. of Concepts', 'number'),
            C('concept_work_cost', 'Concept Work Cost', 'money', { adminOnly: true }),
            C('issue_no_of_resize', 'No. of Resize Pages', 'number'),
            C('resize_work_cost', 'Resize Work Cost', 'money', { adminOnly: true }),
            C('issue_no_of_ai_page', 'No. of AI Pages', 'number'),
            C('ai_charges_cost', 'AI Charges Cost', 'money', { adminOnly: true }),
            C('issue_video_duration', 'Video Duration', 'number'),
            C('issue_no_of_products_shot', 'No. of Products Used', 'number'),
            C('issue_no_of_words_written', 'No. of Words Written', 'number'),
            C('issue_no_of_responsive_screen', 'No. of Responsive UI Created', 'number'),
            C('issue_resize_work', 'Includes Resize Work', 'bool'),
            C('issue_ai', 'Includes AI Work', 'number'),
            C('issue_shoot_setup', 'Includes Shoot Setup', 'bool'),
            C('issue_request_timestamp', 'Change Request Timestamp', 'datetime'),
            C('issue_request_response_timestamp', 'Change Request Response Timestamp', 'datetime'),
            C('issue_request_to_response_tat', 'Change Request to Response TAT', 'tat'),
            C('issue_output_shared_with_cm_timestamp', 'Change Output Shared with CM Timestamp', 'datetime'),
            C('issue_acceptance_to_completion_tat_by_cu', 'Change Acceptance to Completion TAT by CU', 'tat'),
            C('issue_output_response_by_cm_timestamp', 'Change Output Response by CM Timestamp', 'datetime'),
            C('issue_output_shared_to_response_by_cm_tat', 'Change Output Shared to Response by CM TAT', 'tat'),
            C('issue_output_shared_with_client_timestamp', 'Change Output Shared with Client Timestamp', 'datetime'),
            C('issue_internal_tat', 'Change Internal TAT', 'tat'),
            C('issue_output_response_by_client_timestamp', 'Change Output Response by Client Timestamp', 'datetime'),
            C('issue_whole_tat', 'Change Whole TAT', 'tat'),
            C('issue_request_response_reminder_counter_to_cu', 'Change Request Response Reminder Counter To CU', 'number'),
            C('issue_output_response_reminder_counter_to_cm', 'Change Output Response Reminder Counter To CM', 'number'),
            C('issue_output_response_reminder_counter_to_client', 'Change Output Response Reminder Counter To Client', 'number'),
            C('client_change_requested_counter', 'Client Change Requested Counter', 'number'),
            C('cm_change_requested_counter', 'CM Change Requested Counter', 'number'),
            C('change_version', 'Change Version', 'text'),
            C('month', 'Month', 'text'),
            C('fy', 'Financial Year', 'text'),
            C('issue_created_at', 'Created', 'date', { filterOnly: true })
        ],
        detailTitle: row => `${row.task_name || 'Change'} · ${row.change_version || ''}`.replace(/ · $/, ''),
        detailSubtitle: row => `Change #${row.issue_id} · Task #${row.task_id} · Request #${row.work_request_id}`,
        detailGroups: [
            { title: 'Change', keys: ['issue_status', 'issue_id', 'change_version', 'task_name', 'task_id', 'task_type_name', 'work_request_id', 'month', 'fy'] },
            { title: 'People', keys: ['issue_requester_name', 'client_division', 'project_manager', 'project_manager_vertical', 'task_manager', 'task_manager_vertical', 'assigned_creative_user', 'cu_vertical'] },
            { title: 'Schedule', keys: ['issue_start_date', 'issue_end_date', 'issue_deadline', 'issue_request_timestamp', 'issue_request_response_timestamp', 'issue_output_shared_with_cm_timestamp', 'issue_output_response_by_cm_timestamp', 'issue_output_shared_with_client_timestamp', 'issue_output_response_by_client_timestamp'] },
            { title: 'Turnaround', keys: ['issue_request_to_response_tat', 'issue_acceptance_to_completion_tat_by_cu', 'issue_output_shared_to_response_by_cm_tat', 'issue_internal_tat', 'issue_whole_tat'] }
        ],
        rowActions: [
            { icon: 'pencil', label: 'Edit change', onClick: row => editIssue(row) },
            { icon: 'trash3', label: 'Delete change', tone: 'danger', onClick: row => deleteIssue(row) }
        ]
    });

    function editIssue(row) {
        const yesNo = [{ value: '0', label: 'No' }, { value: '1', label: 'Yes' }];
        D.editRecord({
            type: 'issue', id: row.issue_id, title: 'Edit change', subtitle: `Change #${row.issue_id} · ${row.task_name || ''}`,
            onDone: () => grid.reload(),
            fields: ({ record: r }) => [
                { name: 'version', label: 'Version', value: r.version },
                { name: 'status', label: 'Status', type: 'select', value: r.status, options: ['m_pending', 'u_pending', 'm_accepted', 'u_accepted', 'in_progress', 'completed', 'rejected', 'on_hold', 'cancelled'], labeler: D.statusLabel },
                { name: 'review', label: 'Review', type: 'select', value: r.review, options: ['pending', 'approved', 'change_request'], labeler: D.statusLabel },
                { name: 'review_stage', label: 'Review stage', type: 'select', value: r.review_stage, options: ['not_started', 'manager_review', 'pm_review', 'change_requested', 'final_approved'], labeler: D.statusLabel },
                { name: 'assignment_type', label: 'Assignment type', type: 'select', value: r.assignment_type, options: [{ value: 'new', label: 'New' }, { value: 'mod', label: 'Modification' }] },
                { name: 'start_date', label: 'Start', type: 'datetime-local', value: D.toDateTimeLocal(r.start_date) },
                { name: 'end_date', label: 'End', type: 'datetime-local', value: D.toDateTimeLocal(r.end_date) },
                { name: 'deadline', label: 'Deadline', type: 'datetime-local', value: D.toDateTimeLocal(r.deadline) },
                { name: 'task_count', label: 'Change pages', type: 'number', value: r.task_count, min: 0 },
                { name: 'no_of_options_provided', label: 'Options provided', type: 'number', value: r.no_of_options_provided, min: 0 },
                { name: 'no_of_concepts', label: 'Concepts', type: 'number', value: r.no_of_concepts, min: 0 },
                { name: 'no_of_resize', label: 'Resize pages', type: 'number', value: r.no_of_resize, min: 0 },
                { name: 'no_of_images_videos_audio', label: 'AI / images / videos / audio', type: 'number', value: r.no_of_images_videos_audio, min: 0 },
                { name: 'duration_minutes', label: 'Duration (minutes)', type: 'number', value: r.duration_minutes, min: 0 },
                { name: 'duration_seconds', label: 'Duration (seconds)', type: 'number', value: r.duration_seconds, min: 0 },
                { name: 'no_of_products_shot', label: 'Products shot', type: 'number', value: r.no_of_products_shot, min: 0 },
                { name: 'no_of_words_written', label: 'Words written', type: 'number', value: r.no_of_words_written, min: 0 },
                { name: 'no_of_responsive_screen', label: 'Responsive screens', type: 'number', value: r.no_of_responsive_screen, min: 0 },
                { name: 'concept_work', label: 'Concept work', type: 'select', value: String(r.concept_work ?? 0), options: yesNo },
                { name: 'resize_work', label: 'Resize work', type: 'select', value: String(r.resize_work ?? 0), options: yesNo },
                { name: 'shoot_setup', label: 'Shoot setup', type: 'select', value: String(r.shoot_setup ?? 0), options: yesNo },
                { name: 'responsive_screen', label: 'Responsive screen', type: 'select', value: String(r.responsive_screen ?? 0), options: yesNo },
                { name: 'intimate_team', label: 'Intimate team', type: 'select', value: String(r.intimate_team ?? 0), options: yesNo },
                { name: 'intimate_client', label: 'Intimate client', type: 'select', value: String(r.intimate_client ?? 0), options: yesNo },
                { name: 'link', label: 'Link', value: r.link, span: 2 },
                { name: 'comments', label: 'Comments', type: 'textarea', value: r.comments },
                { name: 'description', label: 'Description', type: 'textarea', value: r.description }
            ]
        });
    }

    function deleteIssue(row) {
        D.confirmDelete({
            type: 'issue', id: row.issue_id, title: `Delete change #${row.issue_id}?`, confirmLabel: 'Delete change', doneMessage: 'Change deleted',
            onDone: () => grid.reload(),
            renderPreview: p => {
                const r = p.record || {};
                return D.previewBlock('Only this change record will be deleted', [['Change ID', r.id], ['Task', r.task_name], ['Project', r.project_name], ['Type', r.assignment_type], ['Version', 'v' + (r.version || 1)], ['Status', r.status && D.statusLabel(r.status)]]);
            }
        });
    }
});
</script>
</body>
</html>
