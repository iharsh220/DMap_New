<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client requests · D-Map Admin</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235b2be0'/%3E%3Ctext x='16' y='22' font-family='Arial' font-size='16' font-weight='700' fill='white' text-anchor='middle'%3ED%3C/text%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="../admin/dmap-theme.css" rel="stylesheet">
    <script>try{document.documentElement.setAttribute('data-theme',localStorage.getItem('themePreference')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'))}catch(e){}</script>
    <script src="../admin/admin-app.js" defer></script>
</head>
<body>
<noscript>The D-Map admin panel needs JavaScript.</noscript>
<script>
document.addEventListener('DOMContentLoaded', function () {
    const D = window.DMap;
    const C = (key, title, type, extra) => Object.assign({ key, title, type }, extra || {});
    // Client-facing names for the request stages
    const STAGE = { pending: 'Pending response', accepted: 'Awaiting assignment', assigned: 'Upcoming', in_progress: 'Ongoing', completed: 'Completed', deferred: 'Deferred', cancelled: 'Cancelled', rejected: 'Rejected', draft: 'Draft' };

    const body = D.shell({ page: 'clients', title: 'Client requests', icon: 'people', subtitle: 'Requests as the client sees them: who asked, which vertical, how fast Digilabs responded' });

    const grid = D.grid(body, {
        id: 'clients', version: 4, title: 'Client requests', icon: 'people',
        endpoint: 'clients/data', exportName: 'client_requests', pinned: 2,
        searchPlaceholder: 'Search project, vertical, client, status or ID…',
        quick: ['project_status', 'request_type_name', 'client_division', 'project_requested_at_client'],
        kpis: [
            { label: 'Clients', icon: 'people', tone: 'brand', value: s => s.clients, hint: () => 'Distinct requesters' },
            { label: 'Requests', icon: 'folder2-open', tone: 'info', value: s => s.total },
            { label: 'Pending response', icon: 'hourglass-split', tone: 'warning', value: s => s.pending, share: true, filter: { key: 'project_status', values: ['pending'] } },
            { label: 'Ongoing', icon: 'arrow-repeat', tone: 'accent', value: s => (s.status_counts || {}).in_progress, share: true, filter: { key: 'project_status', values: ['in_progress'] } },
            { label: 'Avg response time', icon: 'speedometer2', tone: 'success', value: s => s.avg_response_tat_hours, format: v => D.fmt.hours(v), hint: () => 'Request → first response' }
        ],
        statusBar: { column: 'project_status', title: 'Request stage breakdown' },
        columns: [
            C('project_status', 'Project Status', 'status', { options: 'work_request_statuses', labels: STAGE }),
            C('work_request_id', 'Project Request ID', 'id'),
            C('project_name', 'Project Name', 'name'),
            C('request_type_name', 'Requested Vertical', 'text', { filter: 'select', options: 'request_types' }),
            C('project_type_name', 'Project Type', 'text', { filter: 'select', options: 'project_types' }),
            C('project_priority', 'Project Priority', 'enum', { options: 'priorities' }),
            C('project_requester_name', 'Client Name', 'text', { filter: 'select', options: 'clients' }),
            C('client_division', 'Client Division', 'text', { filter: 'select', options: 'divisions', match: 'contains' }),
            C('digi_vertical_manager_name', 'Request Accepted By / Project Manager', 'text', { filter: 'select', options: 'managers', match: 'contains' }),
            C('project_count', 'No. of Project', 'number'),
            C('description', 'Status Description', 'longtext'),
            C('project_requested_at_client', 'Request Timestamp', 'datetime'),
            C('response_timestamp', 'Response Timestamp', 'datetime'),
            C('request_to_response_tat', 'Request to Response TAT', 'tat'),
            C('deferral_count', 'Deferral Count', 'number'),
            C('month', 'Month', 'text'),
            C('financial_year', 'Financial Year', 'text'),
            C('work_request_created_at', 'Created', 'date', { filterOnly: true })
        ],
        detailTitle: row => row.project_name || `Request #${row.work_request_id}`,
        detailSubtitle: row => `Request #${row.work_request_id} · ${row.project_requester_name || ''}`,
        rowActions: [
            { icon: 'pencil', label: 'Edit request', onClick: row => editClient(row) },
            { icon: 'trash3', label: 'Delete request', tone: 'danger', onClick: row => deleteClient(row) }
        ]
    });

    function editClient(row) {
        D.editRecord({
            type: 'client', id: row.work_request_id, title: 'Edit client request', subtitle: `Request #${row.work_request_id}`,
            onDone: () => grid.reload(),
            fields: ({ record: r, clientUsers }) => {
                const users = (clientUsers || []).map(u => ({ value: u.id, label: `${u.name} – ${u.email}` }));
                return [
                    { name: 'work_request_id', label: 'Request ID', type: 'readonly', value: r.id },
                    { name: 'requested_at', label: 'Requested at', type: 'datetime-local', value: r.requested_at ? D.toDateTimeLocal(r.requested_at) : '' },
                    { name: 'project_name', label: 'Project name', value: r.project_name, span: 2 },
                    { name: 'brand', label: 'Brand', value: r.brand },
                    { name: 'priority', label: 'Priority', type: 'select', value: r.priority, options: ['low', 'medium', 'high', 'critical'], labeler: D.statusLabel },
                    { name: 'status', label: 'Status', type: 'select', value: r.status, options: ['draft', 'pending', 'accepted', 'assigned', 'in_progress', 'completed', 'rejected', 'deferred'], labeler: s => STAGE[s] || D.statusLabel(s) },
                    { name: 'client_name', label: 'Client', type: 'readonly', value: r.client_name },
                    { name: 'client_email', label: 'Client email', type: 'readonly', value: r.client_email },
                    { name: 'client_division', label: 'Client division', type: 'readonly', value: r.client_division },
                    users.length
                        ? { name: 'user_id', label: 'Reassign to client user', type: 'select', value: r.user_id, options: users, span: 2, help: 'Users in the same client division' }
                        : { name: 'user_id', label: 'Reassign to client user', type: 'select', value: '', options: [{ value: '', label: 'No users in this client division' }], span: 2 },
                    { name: 'remarks', label: 'Remarks', type: 'textarea', value: r.remarks },
                    { name: 'description', label: 'Description', type: 'textarea', value: r.description },
                    { name: 'about_project', label: 'About the project', type: 'textarea', value: r.about_project }
                ];
            }
        });
    }

    function deleteClient(row) {
        D.confirmDelete({
            type: 'client', id: row.work_request_id, title: `Delete request #${row.work_request_id}?`, confirmLabel: 'Delete request', doneMessage: 'Request deleted',
            onDone: () => grid.reload(),
            renderPreview: p => {
                const r = p.record || {};
                return D.previewBlock('This client request will be deleted', [['Request ID', r.id], ['Project', r.project_name], ['Client', r.client_name], ['Division', r.client_division]], {
                    title: `${(p.tasks || []).length} linked task(s) will also be deleted`,
                    items: (p.tasks || []).map(t => [t.task_name || 'Unnamed task', `${t.issue_count} change(s)`]),
                    empty: 'No tasks are linked to this request.'
                });
            }
        });
    }
});
</script>
</body>
</html>
