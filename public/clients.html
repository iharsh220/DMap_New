<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D-Map | Clients</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdn.datatables.net/1.13.4/css/jquery.dataTables.min.css" rel="stylesheet">
    <link href="https://cdn.datatables.net/buttons/2.3.6/css/buttons.dataTables.min.css" rel="stylesheet">
    <link href="https://cdn.datatables.net/fixedcolumns/4.3.0/css/fixedColumns.dataTables.min.css" rel="stylesheet">
    <link href="../admin/dmap-theme.css" rel="stylesheet">
</head>
<body>
<div class="app-layout">
    <aside class="sidebar">
        <div class="sidebar-brand">
            <div class="brand-icon">D</div>
            <div><div class="brand-name">D-Map</div><div class="brand-sub">Analytics Dashboard</div></div>
        </div>
        <div class="sidebar-section">Reports</div>
        <nav class="sidebar-nav">
            <a href="./clients" class="nav-item active"><i class="bi bi-people nav-icon"></i>Clients</a>
            <a href="./projectsdetails" class="nav-item"><i class="bi bi-folder2-open nav-icon"></i>Projects</a>
            <a href="./taskdetails" class="nav-item"><i class="bi bi-check2-square nav-icon"></i>Tasks</a>
            <a href="./issuedetails" class="nav-item"><i class="bi bi-exclamation-circle nav-icon"></i>Issues</a>
            <a href="./workrequesttasks" class="nav-item"><i class="bi bi-table nav-icon"></i>Raw Data</a>
        </nav>
        <div class="sidebar-footer"><i class="bi bi-circle-fill" style="color:#22c55e;font-size:8px;"></i> System Online</div>
    </aside>

    <div class="main-area">
        <div class="topbar">
            <div>
                <div class="topbar-title"><i class="bi bi-people" style="color:var(--accent)"></i> Clients</div>
                <div class="topbar-subtitle">Client-wise project request summary</div>
            </div>
            <div class="topbar-right"><span class="topbar-badge" id="recordCount">Loading...</span></div>
        </div>

        <div class="content-area">
            <div class="stats-row">
                <div class="stat-card"><div class="stat-icon blue"><i class="bi bi-people"></i></div><div><div class="stat-value" id="s1">—</div><div class="stat-label">Total Clients</div></div></div>
                <div class="stat-card"><div class="stat-icon green"><i class="bi bi-folder2-open"></i></div><div><div class="stat-value" id="s2">—</div><div class="stat-label">Projects</div></div></div>
                <div class="stat-card"><div class="stat-icon orange"><i class="bi bi-clock-history"></i></div><div><div class="stat-value" id="s3">—</div><div class="stat-label">Pending Response</div></div></div>
                <div class="stat-card"><div class="stat-icon purple"><i class="bi bi-speedometer2"></i></div><div><div class="stat-value" id="s4">—</div><div class="stat-label">Avg TAT</div></div></div>
            </div>

            <div class="table-card">
                <div class="loading-overlay" id="loader"><div class="spinner"></div><div class="loading-text">Loading clients...</div></div>
                <div class="table-card-header">
                    <div class="table-card-title"><span class="dot"></span>Client Records</div>
                    <div class="header-actions">
                        <button class="btn-action excel" id="btnExcel"><i class="bi bi-file-earmark-excel"></i> Excel</button>
                        <button class="btn-action csv" id="btnCsv"><i class="bi bi-filetype-csv"></i> CSV</button>
                    </div>
                </div>
                <div class="table-card-body">
                    <div class="dt-container">
                        <table id="mainTable" class="display" style="width:100%"><thead></thead><tbody></tbody></table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.3.6/js/dataTables.buttons.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.3.6/js/buttons.html5.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdn.datatables.net/fixedcolumns/4.3.0/js/dataTables.fixedColumns.min.js"></script>
<script>
const TRUNCATE=['description'];
const COL_ORDER=[
    'work_request_id','project_name','request_type_name','project_type_name',
    'project_priority','project_requester_name','client_division','digi_vertical_manager_name',
    'project_count','project_status','description','project_requested_at_client',
    'response_timestamp','request_to_response_tat'
];
const HEADERS={
    work_request_id:'Project Request ID',
    project_name:'Project Name',
    request_type_name:'Project Requested To',
    project_type_name:'Project Type',
    project_priority:'Project Priority',
    project_requester_name:'Client Name',
    client_division:'Client Division',
    digi_vertical_manager_name:'Request Accepted By',
    project_count:'No. of Project',
    project_status:'Project Status',
    description:'Description',
    project_requested_at_client:'Request Timestamp',
    response_timestamp:'Response Timestamp',
    request_to_response_tat:'Request to Response TAT'
};
const BADGES={
    project_status:{draft:'status-draft',pending:'status-pending',accepted:'status-accepted',assigned:'status-assigned',in_progress:'status-in_progress',completed:'status-completed',rejected:'status-rejected',deferred:'status-deferred'},
    project_priority:{low:'priority-low',medium:'priority-medium',high:'priority-high',critical:'priority-critical'}
};

function parseTatMinutes(value){
    if(!value || value==='N/A') return null;
    var match=String(value).match(/(\d+)\s*h\s*(\d+)\s*m/);
    if(!match) return null;
    return (Number(match[1])*60)+Number(match[2]);
}

$(function(){
    $.getJSON('./clients/data',function(res){
        $('#loader').hide();
        var data=res.data||[];
        $('#recordCount').text(data.length+' Records');
        $('#s1').text(new Set(data.map(r=>r.project_requester_name).filter(Boolean)).size);
        $('#s2').text(data.length);
        $('#s3').text(data.filter(r=>r.project_status==='pending').length);
        var tatValues=data.map(r=>parseTatMinutes(r.request_to_response_tat)).filter(v=>v!==null);
        $('#s4').text(tatValues.length ? Math.round(tatValues.reduce((a,b)=>a+b,0)/tatValues.length)+'m' : 'N/A');

        var cols=[];
        var orderedKeys=COL_ORDER.filter(function(k){return data.length && Object.prototype.hasOwnProperty.call(data[0],k);});
        orderedKeys.forEach(function(k){
            cols.push({
                data:k,title:HEADERS[k]||k,defaultContent:'N/A',
                render:function(v,type){
                    if(type!=='display') return v;
                    var val=v!=null?v:'N/A';
                    if(BADGES[k] && val && val!=='N/A'){
                        var c=BADGES[k][val]||'';
                        return '<span class="status-badge '+c+'">'+val+'</span>';
                    }
                    if(TRUNCATE.indexOf(k)!==-1){
                        return '<span class="truncate-cell" title="'+String(val).replace(/"/g,'"')+'">'+val+'</span>';
                    }
                    return val;
                }
            });
        });

        var dt=$('#mainTable').DataTable({
            data:data,columns:cols,
            pageLength:25,lengthMenu:[[25,50,100,200,-1],[25,50,100,200,'All']],
            dom:'<"dt-top-row"lf>rt<"dt-bottom-row"ip>',
            scrollX:true,scrollY:'calc(100vh - 360px)',scrollCollapse:false,autoWidth:false,fixedColumns:{left:2},
            language:{search:'',searchPlaceholder:'Search all columns...',lengthMenu:'Show _MENU_ rows'},
            initComplete:function(){
                var api=this.api();
                api.columns().every(function(){
                    var col=this,idx=col.index();
                    var th=$(col.header());
                    var key=orderedKeys[idx]||Object.keys(data[0])[idx];
                    var labelText=HEADERS[key]||key;
                    th.empty();
                    var wrap=$('<div class="th-wrap"></div>');
                    wrap.append('<div class="th-label"><span>'+labelText+'</span><span class="th-sort"></span></div>');
                    if(BADGES[key]){
                        var sel=$('<select class="col-filter"><option value="">All</option></select>');
                        Object.keys(BADGES[key]).forEach(function(opt){sel.append('<option value="'+opt+'">'+opt+'</option>');});
                        sel.on('change click mousedown',function(e){e.stopPropagation();});
                        sel.on('change',function(){col.search(this.value).draw();});
                        wrap.append(sel);
                    } else {
                        var inp=$('<input class="col-filter" type="text" placeholder="Filter...">');
                        inp.on('click mousedown focus',function(e){e.stopPropagation();});
                        inp.on('keyup change clear',function(){if(col.search()!==this.value)col.search(this.value).draw();});
                        wrap.append(inp);
                    }
                    th.append(wrap);
                    th.off('click').on('click',function(e){
                        if($(e.target).closest('.col-filter').length===0){
                            var currentOrder=api.order();
                            if(currentOrder.length && currentOrder[0][0]===idx){
                                api.order([idx,currentOrder[0][1]==='asc'?'desc':'asc']).draw();
                            } else {
                                api.order([idx,'asc']).draw();
                            }
                        }
                    });
                });
            }
        });
        var colTitles=cols.map(function(c){return c.title;});
        new $.fn.dataTable.Buttons(dt,[
            {extend:'excel',className:'buttons-excel',filename:'clients_'+new Date().toISOString().slice(0,10),exportOptions:{columns:':visible',format:{header:function(data,col){return colTitles[col]||data;}}}},
            {extend:'csv',className:'buttons-csv',filename:'clients_'+new Date().toISOString().slice(0,10),exportOptions:{columns:':visible',format:{header:function(data,col){return colTitles[col]||data;}}}}
        ]);
        $('#btnExcel').on('click',function(){dt.button('.buttons-excel').trigger();});
        $('#btnCsv').on('click',function(){dt.button('.buttons-csv').trigger();});
    }).fail(function(){$('#loader').html('<div style="color:#be123c;font-size:13px"><i class="bi bi-exclamation-triangle"></i> Failed to load data</div>');});
});
</script>
</body>
</html>
