<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D-Map | Projects</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdn.datatables.net/1.13.4/css/jquery.dataTables.min.css" rel="stylesheet">
    <link href="https://cdn.datatables.net/buttons/2.3.6/css/buttons.dataTables.min.css" rel="stylesheet">
    <link href="../admin/dmap-theme.css" rel="stylesheet">
</head>
<body>
<div class="app-layout">

    <aside class="sidebar">
        <div class="sidebar-brand">
            <div class="brand-icon">D</div>
            <div><div class="brand-name">D-Map</div><div class="brand-sub">Analytics Dashboard</div></div>
        </div>
        <div class="sidebar-section">Reports</div>
        <nav class="sidebar-nav">
            <a href="./projectsdetails" class="nav-item active"><i class="bi bi-folder2-open nav-icon"></i>Projects</a>
            <a href="./taskdetails"     class="nav-item"><i class="bi bi-check2-square nav-icon"></i>Tasks</a>
            <a href="./issuedetails"    class="nav-item"><i class="bi bi-exclamation-circle nav-icon"></i>Issues</a>
            <a href="./workrequesttasks" class="nav-item"><i class="bi bi-table nav-icon"></i>Raw Data</a>
        </nav>
        <div class="sidebar-footer"><i class="bi bi-circle-fill" style="color:#22c55e;font-size:8px;"></i> System Online</div>
    </aside>

    <div class="main-area">
        <div class="topbar">
            <div>
                <div class="topbar-title"><i class="bi bi-folder2-open" style="color:var(--accent)"></i> Projects</div>
                <div class="topbar-subtitle">Work request level overview</div>
            </div>
            <div class="topbar-right">
                <span class="topbar-badge" id="recordCount">Loading...</span>
            </div>
        </div>

        <div class="content-area">
            <div class="stats-row">
                <div class="stat-card"><div class="stat-icon blue"><i class="bi bi-folder2-open"></i></div><div><div class="stat-value" id="s1">—</div><div class="stat-label">Total Projects</div></div></div>
                <div class="stat-card"><div class="stat-icon green"><i class="bi bi-check-circle"></i></div><div><div class="stat-value" id="s2">—</div><div class="stat-label">Completed</div></div></div>
                <div class="stat-card"><div class="stat-icon orange"><i class="bi bi-arrow-repeat"></i></div><div><div class="stat-value" id="s3">—</div><div class="stat-label">In Progress</div></div></div>
                <div class="stat-card"><div class="stat-icon purple"><i class="bi bi-clock-history"></i></div><div><div class="stat-value" id="s4">—</div><div class="stat-label">Pending</div></div></div>
            </div>

            <div class="table-card">
                <div class="loading-overlay" id="loader"><div class="spinner"></div><div class="loading-text">Loading projects...</div></div>
                <div class="table-card-header">
                    <div class="table-card-title"><span class="dot"></span>Project Records</div>
                    <div class="header-actions">
                        <button class="btn-action excel" id="btnExcel"><i class="bi bi-file-earmark-excel"></i> Excel</button>
                        <button class="btn-action csv"   id="btnCsv"><i class="bi bi-filetype-csv"></i> CSV</button>
                    </div>
                </div>
                <div class="table-card-body">
                    <div class="dt-container">
                        <table id="mainTable" class="display" style="width:100%"><thead></thead><tbody></tbody></table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Edit Modal -->
<div id="editModal" style="display:none;position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,0.55);align-items:center;justify-content:center;">
  <div style="background:#1e2433;border:1px solid #2d3548;border-radius:12px;width:560px;max-width:95vw;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 8px 40px rgba(0,0,0,0.5);">
    <div style="padding:20px 24px 16px;border-bottom:1px solid #2d3548;display:flex;align-items:center;gap:10px;">
      <span style="background:#6366f122;border-radius:8px;padding:6px 10px;"><i class="bi bi-pencil-square" style="color:#818cf8;font-size:18px;"></i></span>
      <div>
        <div style="color:#f1f5f9;font-weight:600;font-size:15px;">Edit Project</div>
        <div style="color:#94a3b8;font-size:12px;">Update project details</div>
      </div>
      <button onclick="closeEditModal()" style="margin-left:auto;background:none;border:none;color:#64748b;font-size:20px;cursor:pointer;line-height:1;">&times;</button>
    </div>
    <div style="padding:16px 24px;overflow-y:auto;flex:1;">
      <div id="editModalBody" style="color:#cbd5e1;font-size:13px;"></div>
    </div>
    <div style="padding:16px 24px;border-top:1px solid #2d3548;display:flex;gap:10px;justify-content:flex-end;">
      <button onclick="closeEditModal()" style="padding:8px 20px;border-radius:7px;border:1px solid #2d3548;background:#2d3548;color:#94a3b8;font-size:13px;cursor:pointer;">Cancel</button>
      <button id="confirmEditBtn" style="padding:8px 20px;border-radius:7px;border:none;background:#6366f1;color:#fff;font-size:13px;font-weight:600;cursor:pointer;"><i class="bi bi-check-lg"></i> Save Changes</button>
    </div>
  </div>
</div>

<!-- Delete Confirm Modal -->
<div id="deleteModal" style="display:none;position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,0.55);align-items:center;justify-content:center;">
  <div style="background:#1e2433;border:1px solid #2d3548;border-radius:12px;width:520px;max-width:95vw;max-height:85vh;display:flex;flex-direction:column;box-shadow:0 8px 40px rgba(0,0,0,0.5);">
    <div style="padding:20px 24px 16px;border-bottom:1px solid #2d3548;display:flex;align-items:center;gap:10px;">
      <span style="background:#be123c22;border-radius:8px;padding:6px 10px;"><i class="bi bi-exclamation-triangle-fill" style="color:#f43f5e;font-size:18px;"></i></span>
      <div>
        <div style="color:#f1f5f9;font-weight:600;font-size:15px;">Confirm Delete</div>
        <div style="color:#94a3b8;font-size:12px;">This action cannot be undone</div>
      </div>
      <button onclick="closeDeleteModal()" style="margin-left:auto;background:none;border:none;color:#64748b;font-size:20px;cursor:pointer;line-height:1;">&times;</button>
    </div>
    <div style="padding:16px 24px;overflow-y:auto;flex:1;">
      <div id="deleteModalBody" style="color:#cbd5e1;font-size:13px;"></div>
    </div>
    <div style="padding:16px 24px;border-top:1px solid #2d3548;display:flex;gap:10px;justify-content:flex-end;">
      <button onclick="closeDeleteModal()" style="padding:8px 20px;border-radius:7px;border:1px solid #2d3548;background:#2d3548;color:#94a3b8;font-size:13px;cursor:pointer;">Cancel</button>
      <button id="confirmDeleteBtn" style="padding:8px 20px;border-radius:7px;border:none;background:#be123c;color:#fff;font-size:13px;font-weight:600;cursor:pointer;"><i class="bi bi-trash3"></i> Yes, Delete</button>
    </div>
  </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.3.6/js/dataTables.buttons.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.3.6/js/buttons.html5.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
const TRUNCATE = ['work_request_description','about_project','request_type_description','project_type_description','project_digi_comments'];
const HEADERS  = {
    work_request_id:'work_request_id',project_name:'project_name',brand:'brand',
    request_type_name:'request_type_name',request_type_description:'request_type_description',
    digi_vertical_manager_name:'digi_vertical_manager_name',project_requester_name:'project_requester_name',
    project_request_creator_email:'project_request_creator_email',project_request_creator_phone:'project_request_creator_phone',
    project_request_creator_department:'project_request_creator_department',project_request_creator_designation:'project_request_creator_designation',
    project_request_creator_location:'project_request_creator_location',project_type_name:'project_type_name',
    project_type_description:'project_type_description',project_priority:'project_priority',
    project_count:'project_count',task_count:'task_count',issue_task_count:'issue_task_count',
    task_no_of_work_pages:'task_no_of_work_pages',issue_no_of_work_pages:'issue_no_of_work_pages',
    project_requested_at_client:'project_requested_at_client',project_request_accept_at_cm:'project_request_accept_at_cm',
    project_start_date:'project_start_date',project_end_date:'project_end_date',project_deadline:'project_deadline',
    project_review:'project_review',project_stage:'project_stage',project_request_status:'project_request_status',
    project_request_created_at:'project_request_created_at',project_updated_at:'project_updated_at',
    project_digi_comments:'project_digi_comments',work_request_description:'work_request_description',
    about_project:'about_project',month:'month',fy:'fy'
};
const BADGES = {
    project_request_status:{draft:'status-draft',pending:'status-pending',accepted:'status-accepted',assigned:'status-assigned',in_progress:'status-in_progress',completed:'status-completed',rejected:'status-rejected'},
    project_review:{approved:'review-approved',pending:'review-pending',change_request:'review-change_request'},
    project_priority:{low:'priority-low',medium:'priority-medium',high:'priority-high',critical:'priority-critical'},
    project_stage:{not_started:'stage-not_started',manager_review:'stage-manager_review',pm_review:'stage-pm_review',change_requested:'stage-change_requested',final_approved:'stage-final_approved'}
};

$(function(){
    $.getJSON('./projectsdetails/data', function(res){
        $('#loader').hide();
        var data = res.data||[];
        $('#recordCount').text(data.length+' Records');
        $('#s1').text(data.length);
        $('#s2').text(data.filter(r=>r.project_request_status==='completed').length);
        $('#s3').text(data.filter(r=>r.project_request_status==='in_progress').length);
        $('#s4').text(data.filter(r=>r.project_request_status==='pending').length);

        var cols = [];
        if(data.length){
            cols.push({
                data:null, title:'Action', orderable:false, searchable:false, width:'80px',
                render:function(v,type,row){
                    if(type!=='display') return '';
                    return '<button class="edit-btn" data-type="project" data-id="'+row.work_request_id+'" title="Edit Project" style="background:#6366f122;border:1px solid #6366f144;color:#818cf8;border-radius:6px;padding:3px 7px;cursor:pointer;font-size:13px;margin-right:4px;"><i class="bi bi-pencil"></i></button>'
                          +'<button class="del-btn" data-type="project" data-id="'+row.work_request_id+'" title="Delete Project" style="background:#be123c22;border:1px solid #be123c44;color:#f43f5e;border-radius:6px;padding:3px 7px;cursor:pointer;font-size:13px;"><i class="bi bi-trash3"></i></button>';
                }
            });
            Object.keys(data[0]).forEach(function(k){
                cols.push({
                    data:k, title: HEADERS[k]||k, defaultContent:'N/A',
                    render:function(v,type){
                        if(type!=='display') return v;
                        var val = v!=null ? v : 'N/A';
                        if(BADGES[k] && val && val!=='N/A'){var c=BADGES[k][val]||'';return '<span class="status-badge '+c+'">'+val+'</span>';}
                        if(TRUNCATE.indexOf(k)!==-1)return '<span class="truncate-cell" title="'+String(val).replace(/"/g,'&quot;')+'">'+val+'</span>';
                        return val;
                    }
                });
            });
        }

        var dt = $('#mainTable').DataTable({
            data:data, columns:cols,
            pageLength:25, lengthMenu:[[25,50,100,200,-1],[25,50,100,200,'All']],
            dom:'<"dt-top-row"lf>rt<"dt-bottom-row"ip>',
            scrollX:true, scrollY:'calc(100vh - 360px)', scrollCollapse:false, autoWidth:false,
            language:{ search:'', searchPlaceholder:'Search all columns...', lengthMenu:'Show _MENU_ rows' },
            initComplete:function(){
                var api = this.api();
                api.columns().every(function(){
                    var col = this, idx = col.index();
                    var th  = $(col.header());
                    var labelText = idx===0 ? 'Action' : (HEADERS[Object.keys(data[0])[idx-1]]||Object.keys(data[0])[idx-1]);
                    th.empty();
                    var wrap = $('<div class="th-wrap"></div>');
                    var label = $('<div class="th-label"><span>'+labelText+'</span><span class="th-sort"></span></div>');
                    wrap.append(label);
                    if(idx===0){ th.append(wrap); return; }
                    var key = Object.keys(data[0])[idx-1];
                    if(BADGES[key]){
                        var sel = $('<select class="col-filter"><option value="">All</option></select>');
                        Object.keys(BADGES[key]).forEach(function(opt){sel.append('<option value="'+opt+'">'+opt+'</option>');});
                        sel.on('change',function(e){e.stopPropagation();col.search(this.value).draw();});
                        wrap.append(sel);
                    } else {
                        var inp = $('<input class="col-filter" type="text" placeholder="Filter...">');
                        inp.on('keyup change clear',function(e){e.stopPropagation();if(col.search()!==this.value)col.search(this.value).draw();});
                        wrap.append(inp);
                    }
                    th.append(wrap);
                });
            }
        });

        $('#mainTable').on('click','.col-filter',function(e){ e.stopPropagation(); });
        $('#mainTable').on('click','.del-btn',function(e){ e.stopPropagation(); openDeleteModal($(this).data('type'),$(this).data('id')); });
        $('#mainTable').on('click','.edit-btn',function(e){ e.stopPropagation(); openEditModal($(this).data('type'),$(this).data('id')); });

        var colTitles = cols.map(function(c){ return c.title; });
        new $.fn.dataTable.Buttons(dt,[
            {extend:'excel',className:'buttons-excel',filename:'projects_'+new Date().toISOString().slice(0,10),exportOptions:{columns:':visible',format:{header:function(data,col){return colTitles[col]||data;}}}},
            {extend:'csv',className:'buttons-csv',filename:'projects_'+new Date().toISOString().slice(0,10),exportOptions:{columns:':visible',format:{header:function(data,col){return colTitles[col]||data;}}}}
        ]);
        $('#btnExcel').on('click',function(){ dt.button('.buttons-excel').trigger(); });
        $('#btnCsv').on('click',function(){ dt.button('.buttons-csv').trigger(); });

    }).fail(function(){
        $('#loader').html('<div style="color:#be123c;font-size:13px;font-family:Inter,sans-serif"><i class="bi bi-exclamation-triangle"></i> Failed to load data</div>');
    });
});

function fi(label,name,val,t){
    t=t||'text';
    return '<div style="margin-bottom:12px;"><label style="display:block;color:#94a3b8;font-size:11px;margin-bottom:4px;">'+label+'</label>'
        +'<input name="'+name+'" value="'+(val!=null?String(val).replace(/"/g,'&quot;'):'')+'" type="'+t+'" style="width:100%;background:#131929;border:1px solid #2d3548;border-radius:6px;padding:7px 10px;color:#e2e8f0;font-size:13px;box-sizing:border-box;"></div>';
}
function fs(label,name,val,opts){
    var s='<div style="margin-bottom:12px;"><label style="display:block;color:#94a3b8;font-size:11px;margin-bottom:4px;">'+label+'</label>'
        +'<select name="'+name+'" style="width:100%;background:#131929;border:1px solid #2d3548;border-radius:6px;padding:7px 10px;color:#e2e8f0;font-size:13px;">';
    opts.forEach(function(o){s+='<option value="'+o+'"'+(String(val)===String(o)?' selected':'')+'>'+o+'</option>';});
    return s+'</select></div>';
}
function ft(label,name,val){
    return '<div style="margin-bottom:12px;"><label style="display:block;color:#94a3b8;font-size:11px;margin-bottom:4px;">'+label+'</label>'
        +'<textarea name="'+name+'" rows="2" style="width:100%;background:#131929;border:1px solid #2d3548;border-radius:6px;padding:7px 10px;color:#e2e8f0;font-size:13px;box-sizing:border-box;resize:vertical;">'+(val||'')+'</textarea></div>';
}

function openEditModal(type, id){
    $('#editModalBody').html('<div style="color:#94a3b8;padding:20px;text-align:center;"><i class="bi bi-arrow-repeat"></i> Loading...</div>');
    $('#editModal').css('display','flex');
    $.getJSON('/digilabs/dmap/api/datatable/admin/edit/'+type+'/'+id, function(res){
        var r=res.record, html='';
        html+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:0 16px;">';
        html+=fi('Project Name','project_name',r.project_name);
        html+=fi('Brand','brand',r.brand);
        html+=fs('Priority','priority',r.priority,['low','medium','high','critical']);
        html+=fs('Status','status',r.status,['draft','pending','accepted','assigned','in_progress','completed','rejected']);
        html+=fi('Requested At','requested_at',r.requested_at?String(r.requested_at).slice(0,16):'','datetime-local');
        html+='</div>';
        html+=ft('Remarks','remarks',r.remarks);
        html+=ft('Description','description',r.description);
        html+=ft('About Project','about_project',r.about_project);
        $('#editModalBody').html(html);
        $('#confirmEditBtn').off('click').on('click',function(){ submitEdit(type,id); });
    }).fail(function(){ $('#editModalBody').html('<div style="color:#f43f5e;">Failed to load data.</div>'); });
}
function closeEditModal(){ $('#editModal').hide(); }
function submitEdit(type,id){
    var payload={};
    $('#editModalBody input,#editModalBody select,#editModalBody textarea').each(function(){ payload[this.name]=this.value; });
    $('#confirmEditBtn').prop('disabled',true).html('<i class="bi bi-arrow-repeat"></i> Saving...');
    $.ajax({
        url:'/digilabs/dmap/api/datatable/admin/edit/'+type+'/'+id,
        method:'PUT', contentType:'application/json',
        data:JSON.stringify(payload),
        success:function(){ closeEditModal(); location.reload(); },
        error:function(){ $('#confirmEditBtn').prop('disabled',false).html('<i class="bi bi-check-lg"></i> Save Changes'); alert('Update failed. Please try again.'); }
    });
}

function openDeleteModal(type, id){
    $('#deleteModalBody').html('<div style="color:#94a3b8;padding:20px;text-align:center;"><i class="bi bi-arrow-repeat"></i> Loading preview...</div>');
    $('#deleteModal').css('display','flex');
    $.getJSON('/digilabs/dmap/api/datatable/admin/delete/preview/'+type+'/'+id, function(res){
        var p=res.preview, r=p.record, html='';
        html='<div style="background:#be123c11;border:1px solid #be123c33;border-radius:8px;padding:12px 16px;margin-bottom:14px;">';
        html+='<div style="color:#f43f5e;font-weight:600;margin-bottom:6px;"><i class="bi bi-folder2-open"></i> Project to be deleted</div>';
        html+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;">';
        html+='<div><span style="color:#64748b;">ID:</span> <span style="color:#e2e8f0;">'+r.id+'</span></div>';
        html+='<div><span style="color:#64748b;">Name:</span> <span style="color:#e2e8f0;">'+(r.project_name||'N/A')+'</span></div>';
        html+='<div><span style="color:#64748b;">Brand:</span> <span style="color:#e2e8f0;">'+(r.brand||'N/A')+'</span></div>';
        html+='<div><span style="color:#64748b;">Status:</span> <span style="color:#e2e8f0;">'+(r.status||'N/A')+'</span></div>';
        html+='</div></div>';
        if(p.tasks && p.tasks.length){
            html+='<div style="color:#f59e0b;font-size:12px;font-weight:600;margin-bottom:8px;"><i class="bi bi-exclamation-triangle"></i> '+p.tasks.length+' task(s) will also be deleted:</div>';
            html+='<div style="max-height:200px;overflow-y:auto;">';
            p.tasks.forEach(function(t){
                html+='<div style="background:#1a2035;border:1px solid #2d3548;border-radius:6px;padding:8px 12px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;">';
                html+='<span style="color:#cbd5e1;"><i class="bi bi-check2-square" style="color:#6366f1;"></i> '+(t.task_name||'Unnamed Task')+'</span>';
                html+='<span style="color:#64748b;font-size:11px;">'+t.issue_count+' issue(s)</span>';
                html+='</div>';
            });
            html+='</div>';
        } else {
            html+='<div style="color:#22c55e;font-size:12px;"><i class="bi bi-check-circle"></i> No tasks linked to this project.</div>';
        }
        $('#deleteModalBody').html(html);
        $('#confirmDeleteBtn').off('click').on('click',function(){ confirmDelete(type,id); });
    }).fail(function(){ $('#deleteModalBody').html('<div style="color:#f43f5e;">Failed to load preview.</div>'); });
}
function closeDeleteModal(){ $('#deleteModal').hide(); }
function confirmDelete(type,id){
    $('#confirmDeleteBtn').prop('disabled',true).html('<i class="bi bi-arrow-repeat"></i> Deleting...');
    $.ajax({ url:'/digilabs/dmap/api/datatable/admin/delete/'+type+'/'+id, method:'DELETE',
        success:function(){ closeDeleteModal(); location.reload(); },
        error:function(){ $('#confirmDeleteBtn').prop('disabled',false).html('<i class="bi bi-trash3"></i> Yes, Delete'); alert('Delete failed. Please try again.'); }
    });
}
</script>
</body>
</html>
