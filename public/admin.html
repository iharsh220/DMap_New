<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Projects</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdn.datatables.net/1.13.4/css/dataTables.bootstrap5.min.css" rel="stylesheet">
    <link href="https://cdn.datatables.net/buttons/2.3.6/css/buttons.bootstrap5.min.css" rel="stylesheet">
    <style>
        html, body { height: 100%; overflow: hidden; background: #f8f9fa; }
        #mainContent { height: 100vh; overflow: hidden; }
        .datatable-wrapper { background: #fff; padding: 15px; border-radius: 6px; height: calc(100vh - 110px); display: flex; flex-direction: column; }
        .dataTables_scrollBody { overflow-y: auto !important; overflow-x: auto !important; }
        table.dataTable thead th, table.dataTable tbody td { white-space: nowrap; font-size: 11px; padding: 4px 7px; }
        .dt-buttons { float: right; }
        .status-badge { padding: 3px 6px; border-radius: 4px; font-size: 10px; font-weight: 500; }
        .status-upcoming { background-color: #fff3cd; color: #856404; }
        .status-ongoing { background-color: #d1ecf1; color: #0c5460; }
        .status-completed { background-color: #d4edda; color: #155724; }
        .nav-tabs .nav-link.active { font-weight: 600; }
    </style>
</head>

<body>
    <div class="flex-grow-1" id="mainContent">
        <div class="container-fluid pt-3">
            <ul class="nav nav-tabs mb-3">
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" href="./projectsdetails">Projects</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="./taskdetails">Tasks</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="./issuedetails">Issues</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="./workrequesttasks">Raw Data</a>
                </li>
            </ul>

            <div class="datatable-wrapper">
                <table id="workRequestsTable" class="table table-bordered table-striped w-100">
                    <thead><tr><th>Work Request ID</th><th>Project Name</th><th>Request Type</th><th>Project Type</th><th>Requester Division</th><th>Requester Name</th><th>User Division</th><th>Manager Name</th><th>Project Count</th><th>Task Count</th><th>Project Request Date</th><th>Project Start Date</th><th>Project End Date</th><th>Project Status</th></tr></thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.4/js/dataTables.bootstrap5.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.3.6/js/dataTables.buttons.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.3.6/js/buttons.bootstrap5.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.3.6/js/buttons.html5.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script>
        $(document).ready(function() {
            $('#workRequestsTable').DataTable({
                ajax: { url: './projectsdetails/data', dataSrc: 'data' },
                columns: [
                    { data: 'work_request_id' },
                    { data: 'project_name' },
                    { data: 'request_type' },
                    { data: 'project_type' },
                    { data: 'requester_division' },
                    { data: 'requester_name' },
                    { data: 'user_division' },
                    { data: 'manager_name' },
                    { data: 'project_count' },
                    { data: 'task_count' },
                    { data: 'project_request_date' },
                    { data: 'project_start_date' },
                    { data: 'project_end_date' },
                    { data: 'project_status', render: function(data) {
                        var cls = '';
                        if (data == 'upcoming') cls = 'status-upcoming';
                        else if (data == 'ongoing') cls = 'status-ongoing';
                        else if (data == 'completed') cls = 'status-completed';
                        return '<span class="status-badge ' + cls + '">' + (data || '') + '</span>';
                    }}
                ],
                pageLength: 25,
                lengthMenu: [[25, 50, 100, 200, -1], [25, 50, 100, 200, 'All']],
                dom: 'lBfrtip',
                scrollX: true,
                scrollY: '60vh',
                scrollCollapse: true,
                buttons: [
                    { extend: 'excel', text: '<i class="bi bi-file-earmark-excel"></i>', className: 'btn btn-success btn-sm', titleAttr: 'Export to Excel', filename: function() { return 'work_requests_' + new Date().toISOString().slice(0, 10); } },
                    { extend: 'csv', text: '<i class="bi bi-filetype-csv"></i>', className: 'btn btn-secondary btn-sm', titleAttr: 'Export to CSV', filename: function() { return 'work_requests_' + new Date().toISOString().slice(0, 10); } }
                ],
                initComplete: function () {
                    this.api().columns().every( function () {
                        var column = this;
                        var input = $('<input type="text" class="form-control form-control-sm" placeholder="Filter" style="width:100%;font-size:10px;padding:2px 4px;margin-top:2px;" />')
                            .appendTo( $(column.header()) )
                            .on( 'keyup change clear', function () {
                                if ( column.search() !== this.value ) {
                                    column.search( this.value ).draw();
                                }
                            });
                    });
                }
            });
        });
    </script>
</body>

</html>
