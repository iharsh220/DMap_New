<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects · D-Map Admin</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235b2be0'/%3E%3Ctext x='16' y='22' font-family='Arial' font-size='16' font-weight='700' fill='white' text-anchor='middle'%3ED%3C/text%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="../admin/dmap-theme.css" rel="stylesheet">
    <script>try{document.documentElement.setAttribute('data-theme',localStorage.getItem('themePreference')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'))}catch(e){}</script>
    <script src="../admin/admin-app.js" defer></script>
</head>
<body>
<noscript>The D-Map admin panel needs JavaScript.</noscript>
<script>
document.addEventListener('DOMContentLoaded', function () {
    const D = window.DMap;
    const C = (key, title, type, extra) => Object.assign({ key, title, type }, extra || {});
    const sc = (s, k) => Number((s.status_counts || {})[k] || 0);
    // the old page's names for the request stages
    const STAGE = { pending: 'Pending Response', accepted: 'Awaiting Assignment', assigned: 'Upcoming', in_progress: 'Ongoing', completed: 'Completed', deferred: 'Deferred', cancelled: 'Cancelled' };

    const body = D.shell({ page: 'projectsdetails', title: 'Projects', icon: 'folder2-open', subtitle: 'One row per work request: status, owners, volume of work, turnaround and reminders' });

    D.grid(body, {
        id: 'projects', version: 4, title: 'Projects', icon: 'folder2-open',
        endpoint: 'projectsdetails/data', exportName: 'projects', pinned: 2, scopeable: true,
        searchPlaceholder: 'Search project, vertical, type, client, brand or ID…',
        quick: ['project_request_status', 'request_type_name', 'project_priority', 'project_request_timestamp'],
        kpis: [
            { label: 'Total projects', icon: 'folder2-open', tone: 'brand', value: s => s.total },
            { label: 'Completed', icon: 'check-circle', tone: 'success', value: s => Number(s.completed), share: true, filter: { key: 'project_request_status', values: ['completed'] } },
            { label: 'In progress', icon: 'arrow-repeat', tone: 'info', value: s => Number(s.in_progress), share: true, filter: { key: 'project_request_status', values: ['in_progress'] } },
            { label: 'Accepted / assigned', icon: 'person-check', tone: 'accent', value: s => sc(s, 'accepted') + sc(s, 'assigned'), share: true, hint: () => 'Accepted, waiting for work to start', filter: { key: 'project_request_status', values: ['accepted', 'assigned'] } },
            { label: 'Pending response', icon: 'hourglass-split', tone: 'warning', value: s => Number(s.pending), share: true, filter: { key: 'project_request_status', values: ['pending'] } }
        ],
        statusBar: { column: 'project_request_status', title: 'Project status breakdown' },
        columns: [
            C('project_request_status', 'Project Status', 'status', { options: 'work_request_statuses', labels: STAGE }),
            C('work_request_id', 'Project Request ID', 'id'),
            C('project_name', 'Project Name', 'name'),
            C('request_type_name', 'Requested Vertical', 'text', { filter: 'select', options: 'request_types' }),
            C('project_type_name', 'Project Type', 'text', { filter: 'select', options: 'project_types' }),
            C('project_priority', 'Project Priority', 'enum', { options: 'priorities' }),
            C('project_requester_name', 'Client Name', 'text', { filter: 'select', options: 'clients' }),
            C('client_division', 'Client Division', 'text', { filter: 'select', options: 'divisions', match: 'contains' }),
            C('request_accepted_by', 'Request Accepted By / Project Manager', 'text', { filter: 'select', options: 'managers', match: 'contains' }),
            C('project_count', 'No. of Project', 'number'),
            C('task_count', 'Task Count', 'number'),
            C('change_count', 'Change Count', 'number'),
            C('project_start_date', 'Project Start Date', 'date'),
            C('project_end_date', 'Project End Date', 'date'),
            C('client_change_requested_counter', 'Client Change Requested Counter', 'number'),
            C('cm_change_requested_counter', 'CM Change Requested Counter', 'number'),
            C('task_no_of_work_pages', 'No. of Work Pages', 'number'),
            C('issue_no_of_work_pages', 'No. of Change Pages', 'number'),
            C('task_no_of_options_provided', 'No. of Options', 'number'),
            C('task_concept_work', 'No. of Concept Created', 'number'),
            C('task_no_of_resize', 'No. of Resize Pages', 'number'),
            C('task_no_of_ai_page', 'No. of AI Pages', 'number'),
            C('video_duration', 'Video Duration', 'number'),
            C('task_no_of_products_shot', 'No. of Products Used', 'number'),
            C('task_no_of_words_written', 'No. of Words Written', 'number'),
            C('task_no_of_responsive_screen', 'No. of Responsive UI Created', 'number'),
            C('task_resize_work', 'Includes Resize Work', 'number'),
            C('task_ai', 'Includes AI Work', 'number'),
            C('task_shoot_setup', 'Includes Shoot Setup', 'number'),
            C('project_request_timestamp', 'Project Request Timestamp', 'datetime'),
            C('project_acceptance_timestamp', 'Project Acceptance Timestamp', 'datetime'),
            C('project_completion_timestamp', 'Project Completion Timestamp', 'datetime'),
            C('project_marked_completed_timestamp', 'Project Marked Completed Timestamp', 'datetime'),
            C('project_marked_completed_by', 'Project Marked Completed by', 'text'),
            C('internal_project_tat', 'Internal Project TAT', 'tat'),
            C('project_tat', 'Project TAT', 'tat'),
            C('project_request_to_response_tat', 'Project Request to Response TAT', 'tat'),
            C('task_request_to_response_tat_avg', 'Task Request to Response TAT AVG', 'tat'),
            C('task_acceptance_to_completion_tat_by_cu_avg', 'Task Acceptance to Completion TAT by CU AVG', 'tat'),
            C('task_output_shared_to_response_by_cm_tat_avg', 'Task Output Shared to Response by CM TAT AVG', 'tat'),
            C('task_internal_tat_avg', 'Task Internal TAT AVG', 'tat'),
            C('task_whole_tat_avg', 'Task Whole TAT AVG', 'tat'),
            C('change_request_to_response_tat_avg', 'Change Request to Response TAT AVG', 'tat'),
            C('change_acceptance_to_completion_tat_by_cu_avg', 'Change Acceptance to Completion TAT by CU AVG', 'tat'),
            C('change_output_shared_to_response_by_cm_tat_avg', 'Change Output Shared to Response by CM TAT AVG', 'tat'),
            C('change_internal_tat_avg', 'Change Internal TAT AVG', 'tat'),
            C('change_whole_tat_avg', 'Change Whole TAT AVG', 'tat'),
            C('project_request_response_reminder_counter_to_cm', 'Project Request Response Reminder Counter To CM', 'number'),
            C('task_request_response_reminder_counter_to_cu', 'Task Request Response Reminder Counter To CU', 'number'),
            C('task_output_response_reminder_counter_to_cm', 'Task Output Response Reminder Counter To CM', 'number'),
            C('task_output_response_reminder_counter_to_client', 'Task Output Response Reminder Counter To Client', 'number'),
            C('change_request_response_reminder_counter_to_cu', 'Change Request Response Reminder Counter To CU', 'number'),
            C('chnage_output_response_reminder_counter_to_cm', 'Chnage Output Response Reminder Counter To CM', 'number'),
            C('change_output_response_reminder_counter_to_client', 'Change Output Response Reminder Counter To Client', 'number'),
            C('project_closure_reminder_counter_to_client', 'Project Closure Reminder Counter To Client', 'number'),
            C('month', 'Month', 'text'),
            C('fy', 'Financial Year', 'text'),
            C('work_request_created_at', 'Created', 'date', { filterOnly: true })
        ],
        detailTitle: row => row.project_name || `Request #${row.work_request_id}`,
        detailSubtitle: row => `Request #${row.work_request_id} · ${row.request_type_name || ''}`,
        detailGroups: [
            { title: 'Project', keys: ['project_request_status', 'work_request_id', 'project_name', 'request_type_name', 'project_type_name', 'project_priority', 'month', 'fy'] },
            { title: 'People', keys: ['project_requester_name', 'client_division', 'request_accepted_by', 'project_marked_completed_by'] },
            { title: 'Volume', keys: ['project_count', 'task_count', 'change_count', 'client_change_requested_counter', 'cm_change_requested_counter', 'task_no_of_work_pages', 'issue_no_of_work_pages', 'task_no_of_options_provided', 'task_concept_work', 'task_no_of_resize', 'task_no_of_ai_page', 'video_duration', 'task_no_of_products_shot', 'task_no_of_words_written', 'task_no_of_responsive_screen', 'task_resize_work', 'task_ai', 'task_shoot_setup'] },
            { title: 'Timeline', keys: ['project_start_date', 'project_end_date', 'project_request_timestamp', 'project_acceptance_timestamp', 'project_completion_timestamp', 'project_marked_completed_timestamp'] },
            { title: 'Turnaround', keys: ['internal_project_tat', 'project_tat', 'project_request_to_response_tat', 'task_request_to_response_tat_avg', 'task_acceptance_to_completion_tat_by_cu_avg', 'task_output_shared_to_response_by_cm_tat_avg', 'task_internal_tat_avg', 'task_whole_tat_avg', 'change_request_to_response_tat_avg', 'change_acceptance_to_completion_tat_by_cu_avg', 'change_output_shared_to_response_by_cm_tat_avg', 'change_internal_tat_avg', 'change_whole_tat_avg'] }
        ]
    });
});
</script>
</body>
</html>
