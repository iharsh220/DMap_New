<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D-Map | Raw Data</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdn.datatables.net/1.13.4/css/jquery.dataTables.min.css" rel="stylesheet">
    <link href="https://cdn.datatables.net/buttons/2.3.6/css/buttons.dataTables.min.css" rel="stylesheet">
    <link href="../admin/dmap-theme.css" rel="stylesheet">
</head>
<body>
<div class="app-layout">

    <aside class="sidebar">
        <div class="sidebar-brand">
            <div class="brand-icon">D</div>
            <div><div class="brand-name">D-Map</div><div class="brand-sub">Analytics Dashboard</div></div>
        </div>
        <div class="sidebar-section">Reports</div>
        <nav class="sidebar-nav">
            <a href="./projectsdetails"  class="nav-item"><i class="bi bi-folder2-open nav-icon"></i>Projects</a>
            <a href="./taskdetails"      class="nav-item"><i class="bi bi-check2-square nav-icon"></i>Tasks</a>
            <a href="./issuedetails"     class="nav-item"><i class="bi bi-exclamation-circle nav-icon"></i>Issues</a>
            <a href="./workrequesttasks" class="nav-item active"><i class="bi bi-table nav-icon"></i>Raw Data</a>
        </nav>
        <div class="sidebar-footer"><i class="bi bi-circle-fill" style="color:#22c55e;font-size:8px;"></i> System Online</div>
    </aside>

    <div class="main-area">
        <div class="topbar">
            <div>
                <div class="topbar-title"><i class="bi bi-table" style="color:var(--accent)"></i> Raw Data</div>
                <div class="topbar-subtitle">Complete work request + task + issue flat table</div>
            </div>
            <div class="topbar-right"><span class="topbar-badge" id="recordCount">Loading...</span></div>
        </div>

        <div class="content-area">
            <div class="stats-row">
                <div class="stat-card"><div class="stat-icon blue"><i class="bi bi-database"></i></div><div><div class="stat-value" id="s1">—</div><div class="stat-label">Total Records</div></div></div>
                <div class="stat-card"><div class="stat-icon green"><i class="bi bi-folder2-open"></i></div><div><div class="stat-value" id="s2">—</div><div class="stat-label">Work Requests</div></div></div>
                <div class="stat-card"><div class="stat-icon orange"><i class="bi bi-check2-square"></i></div><div><div class="stat-value" id="s3">—</div><div class="stat-label">Tasks</div></div></div>
                <div class="stat-card"><div class="stat-icon purple"><i class="bi bi-exclamation-circle"></i></div><div><div class="stat-value" id="s4">—</div><div class="stat-label">Issues</div></div></div>
            </div>

            <div class="table-card">
                <div class="loading-overlay" id="loader"><div class="spinner"></div><div class="loading-text">Loading raw data...</div></div>
                <div class="table-card-header">
                    <div class="table-card-title"><span class="dot"></span>Raw Records</div>
                    <div class="header-actions">
                        <button class="btn-action excel" id="btnExcel"><i class="bi bi-file-earmark-excel"></i> Excel</button>
                        <button class="btn-action csv"   id="btnCsv"><i class="bi bi-filetype-csv"></i> CSV</button>
                    </div>
                </div>
                <div class="table-card-body">
                    <div class="dt-container">
                        <table id="mainTable" class="display" style="width:100%"><thead></thead><tbody></tbody></table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.3.6/js/dataTables.buttons.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.3.6/js/buttons.html5.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
const HEADERS={
    work_request_id:'work_request_id',
    work_request_user_id:'work_request_user_id',
    project_name:'project_name',
    brand:'brand',
    work_request_type_id:'work_request_type_id',
    work_request_project_id:'work_request_project_id',
    work_request_description:'work_request_description',
    about_project:'about_project',
    priority:'priority',
    work_request_status:'work_request_status',
    requested_at:'requested_at',
    remarks:'remarks',
    work_request_created_at:'work_request_created_at',
    work_request_updated_at:'work_request_updated_at',
    request_type_id:'request_type_id',
    request_type_name:'request_type_name',
    request_type_description:'request_type_description',
    project_type_id:'project_type_id',
    project_type_name:'project_type_name',
    project_type_description:'project_type_description',
    request_creator_id:'request_creator_id',
    request_creator_name:'request_creator_name',
    request_creator_email:'request_creator_email',
    request_creator_phone:'request_creator_phone',
    request_creator_department:'request_creator_department',
    request_creator_designation:'request_creator_designation',
    request_creator_job_role:'request_creator_job_role',
    request_creator_location:'request_creator_location',
    manager_names:'manager_names',
    manager_ids:'manager_ids',
    task_id:'task_id',
    task_name:'task_name',
    task_description:'task_description',
    task_request_type_id:'task_request_type_id',
    task_type_id:'task_type_id',
    task_work_request_id:'task_work_request_id',
    task_deadline:'task_deadline',
    task_status:'task_status',
    task_version:'task_version',
    task_review:'task_review',
    task_review_stage:'task_review_stage',
    task_assignment_type:'task_assignment_type',
    task_intimate_team:'task_intimate_team',
    task_intimate_client:'task_intimate_client',
    task_shared_with_client_at:'task_shared_with_client_at',
    task_count:'task_count',
    issue_task_count:'issue_task_count',
    task_link:'task_link',
    task_start_date:'task_start_date',
    task_end_date:'task_end_date',
    task_no_of_options_provided:'task_no_of_options_provided',
    task_no_of_words_written:'task_no_of_words_written',
    task_options_submitted:'task_options_submitted',
    task_concept_work:'task_concept_work',
    task_resize_work:'task_resize_work',
    task_no_of_concepts:'task_no_of_concepts',
    task_duration_minutes:'task_duration_minutes',
    task_duration_seconds:'task_duration_seconds',
    task_product_shoot:'task_product_shoot',
    task_no_of_products_shot:'task_no_of_products_shot',
    task_shoot_setup:'task_shoot_setup',
    task_no_of_resize:'task_no_of_resize',
    task_responsive_screen:'task_responsive_screen',
    task_no_of_responsive_screen:'task_no_of_responsive_screen',
    task_created_at:'task_created_at',
    task_updated_at:'task_updated_at',
    task_comments:'task_comments',
    task_type_name:'task_type_name',
    task_type_description:'task_type_description',
    task_request_type_name:'task_request_type_name',
    task_assignment_id:'task_assignment_id',
    assigned_user_id:'assigned_user_id',
    assigned_user_name:'assigned_user_name',
    assigned_user_email:'assigned_user_email',
    assigned_user_phone:'assigned_user_phone',
    assigned_user_department:'assigned_user_department',
    assigned_user_designation:'assigned_user_designation',
    assigned_user_job_role:'assigned_user_job_role',
    assigned_user_location:'assigned_user_location',
    issue_id:'issue_id',
    issue_parent_id:'issue_parent_id',
    issue_task_id:'issue_task_id',
    issue_requested_by_user_id:'issue_requested_by_user_id',
    issue_assignment_type:'issue_assignment_type',
    issue_version:'issue_version',
    issue_description:'issue_description',
    issue_deadline:'issue_deadline',
    issue_intimate_team:'issue_intimate_team',
    issue_intimate_client:'issue_intimate_client',
    issue_shared_with_client_at:'issue_shared_with_client_at',
    issue_work_pages:'issue_work_pages',
    issue_start_date:'issue_start_date',
    issue_end_date:'issue_end_date',
    issue_link:'issue_link',
    issue_status:'issue_status',
    issue_review:'issue_review',
    issue_review_stage:'issue_review_stage',
    issue_no_of_options_provided:'issue_no_of_options_provided',
    issue_no_of_words_written:'issue_no_of_words_written',
    issue_options_submitted:'issue_options_submitted',
    issue_concept_work:'issue_concept_work',
    issue_resize_work:'issue_resize_work',
    issue_no_of_concepts:'issue_no_of_concepts',
    issue_duration_minutes:'issue_duration_minutes',
    issue_duration_seconds:'issue_duration_seconds',
    issue_product_shoot:'issue_product_shoot',
    issue_no_of_products_shot:'issue_no_of_products_shot',
    issue_shoot_setup:'issue_shoot_setup',
    issue_no_of_resize:'issue_no_of_resize',
    issue_responsive_screen:'issue_responsive_screen',
    issue_no_of_responsive_screen:'issue_no_of_responsive_screen',
    issue_created_at:'issue_created_at',
    issue_updated_at:'issue_updated_at',
    issue_comments:'issue_comments',
    issue_requester_id:'issue_requester_id',
    issue_requester_name:'issue_requester_name',
    issue_requester_email:'issue_requester_email',
    issue_requester_phone:'issue_requester_phone',
    issue_requester_department:'issue_requester_department',
    issue_requester_designation:'issue_requester_designation',
    issue_requester_job_role:'issue_requester_job_role',
    issue_requester_location:'issue_requester_location',
    issue_types:'issue_types',
    issue_register_ids:'issue_register_ids',
    issue_types_with_description:'issue_types_with_description'
};
const STATUS_KEYS=['work_request_status','task_status','issue_status'];
const STATUS_MAP={
    draft:'status-draft',pending:'status-pending',accepted:'status-accepted',
    assigned:'status-assigned',in_progress:'status-in_progress',completed:'status-completed',
    rejected:'status-rejected',deferred:'status-deferred',
    m_pending:'status-m_pending',u_pending:'status-u_pending',
    m_accepted:'status-m_accepted',u_accepted:'status-u_accepted',
    on_hold:'status-on_hold',cancelled:'status-cancelled'
};

$(function(){
    $.getJSON('./workrequesttasks/data',function(res){
        $('#loader').hide();
        var data=res.data||[];
        $('#recordCount').text(data.length+' Records');
        $('#s1').text(data.length);
        var wrIds=new Set(),tIds=new Set(),iIds=new Set();
        data.forEach(function(r){
            if(r.work_request_id)wrIds.add(r.work_request_id);
            if(r.task_id)tIds.add(r.task_id);
            if(r.issue_id)iIds.add(r.issue_id);
        });
        $('#s2').text(wrIds.size);
        $('#s3').text(tIds.size);
        $('#s4').text(iIds.size);

        var cols=[];
        if(data.length){
            Object.keys(data[0]).forEach(function(k){
                cols.push({
                    data:k,title:HEADERS[k]||k,defaultContent:'N/A',
                    render:function(v,type){
                        if(type!=='display')return v;
                        var val=v!=null?v:'N/A';
                        if(STATUS_KEYS.indexOf(k)!==-1&&val&&val!=='N/A'){
                            var c=STATUS_MAP[val]||'';
                            return '<span class="status-badge '+c+'">'+val+'</span>';
                        }
                        return val;
                    }
                });
            });
        }

        var dt=$('#mainTable').DataTable({
            data:data,columns:cols,
            pageLength:25,lengthMenu:[[25,50,100,200,-1],[25,50,100,200,'All']],
            dom:'<"dt-top-row"lf>rt<"dt-bottom-row"ip>',
            scrollX:true,scrollY:'calc(100vh - 360px)',scrollCollapse:false,autoWidth:false,
            language:{search:'',searchPlaceholder:'Search all columns...',lengthMenu:'Show _MENU_ rows'},
            initComplete:function(){
                var api=this.api();
                api.columns().every(function(){
                    var col=this,idx=col.index(),key=Object.keys(data[0])[idx];
                    var th=$(col.header());
                    var labelText=HEADERS[key]||key;
                    th.empty();
                    var wrap=$('<div class="th-wrap"></div>');
                    wrap.append('<div class="th-label"><span>'+labelText+'</span><span class="th-sort"></span></div>');
                    if(STATUS_KEYS.indexOf(key)!==-1){
                        var sel=$('<select class="col-filter"><option value="">All</option></select>');
                        Object.keys(STATUS_MAP).forEach(function(o){sel.append('<option value="'+o+'">'+o+'</option>');});
                        sel.on('change',function(e){e.stopPropagation();col.search(this.value).draw();});
                        wrap.append(sel);
                    } else {
                        var inp=$('<input class="col-filter" type="text" placeholder="Filter...">');
                        inp.on('keyup change clear',function(e){e.stopPropagation();if(col.search()!==this.value)col.search(this.value).draw();});
                        wrap.append(inp);
                    }
                    th.append(wrap);
                });
            }
        });
        $('#mainTable').on('click','.col-filter',function(e){e.stopPropagation();});
        var colTitles=cols.map(function(c){return c.title;});
        new $.fn.dataTable.Buttons(dt,[
            {extend:'excel',className:'buttons-excel',filename:'rawdata_'+new Date().toISOString().slice(0,10),exportOptions:{columns:':visible',format:{header:function(data,col){return colTitles[col]||data;}}}},
            {extend:'csv',className:'buttons-csv',filename:'rawdata_'+new Date().toISOString().slice(0,10),exportOptions:{columns:':visible',format:{header:function(data,col){return colTitles[col]||data;}}}}
        ]);
        $('#btnExcel').on('click',function(){dt.button('.buttons-excel').trigger();});
        $('#btnCsv').on('click',function(){dt.button('.buttons-csv').trigger();});
    }).fail(function(){$('#loader').html('<div style="color:#be123c;font-size:13px"><i class="bi bi-exclamation-triangle"></i> Failed to load data</div>');});
});
</script>
</body>
</html>
