<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D-Map | Raw Data</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdn.datatables.net/1.13.4/css/jquery.dataTables.min.css" rel="stylesheet">
    <link href="https://cdn.datatables.net/buttons/2.3.6/css/buttons.dataTables.min.css" rel="stylesheet">
    <link href="../admin/dmap-theme.css" rel="stylesheet">
</head>
<body>
<div class="app-layout">

    <aside class="sidebar">
        <div class="sidebar-brand">
            <div class="brand-icon">D</div>
            <div><div class="brand-name">D-Map</div><div class="brand-sub">Analytics Dashboard</div></div>
        </div>
        <div class="sidebar-section">Reports</div>
        <nav class="sidebar-nav">
            <a href="./projectsdetails"  class="nav-item"><i class="bi bi-folder2-open nav-icon"></i>Projects</a>
            <a href="./taskdetails"      class="nav-item"><i class="bi bi-check2-square nav-icon"></i>Tasks</a>
            <a href="./issuedetails"     class="nav-item"><i class="bi bi-exclamation-circle nav-icon"></i>Issues</a>
            <a href="./workrequesttasks" class="nav-item active"><i class="bi bi-table nav-icon"></i>Raw Data</a>
        </nav>
        <div class="sidebar-footer"><i class="bi bi-circle-fill" style="color:#22c55e;font-size:8px;"></i> System Online</div>
    </aside>

    <div class="main-area">
        <div class="topbar">
            <div>
                <div class="topbar-title"><i class="bi bi-table" style="color:var(--accent)"></i> Raw Data</div>
                <div class="topbar-subtitle">Complete work request + task + issue flat table</div>
            </div>
            <div class="topbar-right"><span class="topbar-badge" id="recordCount">Loading...</span></div>
        </div>

        <div class="content-area">
            <div class="stats-row">
                <div class="stat-card"><div class="stat-icon blue"><i class="bi bi-database"></i></div><div><div class="stat-value" id="s1">—</div><div class="stat-label">Total Records</div></div></div>
                <div class="stat-card"><div class="stat-icon green"><i class="bi bi-folder2-open"></i></div><div><div class="stat-value" id="s2">—</div><div class="stat-label">Work Requests</div></div></div>
                <div class="stat-card"><div class="stat-icon orange"><i class="bi bi-check2-square"></i></div><div><div class="stat-value" id="s3">—</div><div class="stat-label">Tasks</div></div></div>
                <div class="stat-card"><div class="stat-icon purple"><i class="bi bi-exclamation-circle"></i></div><div><div class="stat-value" id="s4">—</div><div class="stat-label">Issues</div></div></div>
            </div>

            <div class="table-card">
                <div class="loading-overlay" id="loader"><div class="spinner"></div><div class="loading-text">Loading raw data...</div></div>
                <div class="table-card-header">
                    <div class="table-card-title"><span class="dot"></span>Raw Records</div>
                    <div class="header-actions">
                        <button class="btn-action excel" id="btnExcel"><i class="bi bi-file-earmark-excel"></i> Excel</button>
                        <button class="btn-action csv"   id="btnCsv"><i class="bi bi-filetype-csv"></i> CSV</button>
                    </div>
                </div>
                <div class="table-card-body">
                    <div class="dt-container">
                        <table id="mainTable" class="display" style="width:100%"><thead></thead><tbody></tbody></table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.3.6/js/dataTables.buttons.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.3.6/js/buttons.html5.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
const STATUS_KEYS=['work_request_status','task_status','issue_status'];
const STATUS_MAP={
    draft:'status-draft',pending:'status-pending',accepted:'status-accepted',
    assigned:'status-assigned',in_progress:'status-in_progress',completed:'status-completed',
    rejected:'status-rejected',deferred:'status-deferred',
    m_pending:'status-m_pending',u_pending:'status-u_pending',
    m_accepted:'status-m_accepted',u_accepted:'status-u_accepted',
    on_hold:'status-on_hold',cancelled:'status-cancelled'
};

$(function(){
    $.getJSON('./workrequesttasks/data',function(res){
        $('#loader').hide();
        var data=res.data||[];
        $('#recordCount').text(data.length+' Records');
        $('#s1').text(data.length);
        var wrIds=new Set(),tIds=new Set(),iIds=new Set();
        data.forEach(function(r){
            if(r.work_request_id)wrIds.add(r.work_request_id);
            if(r.task_id)tIds.add(r.task_id);
            if(r.issue_id)iIds.add(r.issue_id);
        });
        $('#s2').text(wrIds.size);
        $('#s3').text(tIds.size);
        $('#s4').text(iIds.size);

        var cols=[];
        if(data.length){
            Object.keys(data[0]).forEach(function(k){
                cols.push({
                    data:k,title:k,defaultContent:'N/A',
                    render:function(v,type){
                        if(type!=='display')return v;
                        var val=v!=null?v:'N/A';
                        if(STATUS_KEYS.indexOf(k)!==-1&&val&&val!=='N/A'){
                            var c=STATUS_MAP[val]||'';
                            return '<span class="status-badge '+c+'">'+val+'</span>';
                        }
                        return val;
                    }
                });
            });
        }

        var dt=$('#mainTable').DataTable({
            data:data,columns:cols,
            pageLength:25,lengthMenu:[[25,50,100,200,-1],[25,50,100,200,'All']],
            dom:'<"dt-top-row"lf>rt<"dt-bottom-row"ip>',
            scrollX:true,scrollY:'calc(100vh - 360px)',scrollCollapse:false,autoWidth:false,
            language:{search:'',searchPlaceholder:'Search all columns...',lengthMenu:'Show _MENU_ rows'},
            initComplete:function(){
                var api=this.api();
                api.columns().every(function(){
                    var col=this,idx=col.index(),key=Object.keys(data[0])[idx];
                    var th=$(col.header());
                    var labelText=th.text().trim();
                    th.empty();
                    var wrap=$('<div class="th-wrap"></div>');
                    wrap.append('<div class="th-label"><span>'+labelText+'</span><span class="th-sort"></span></div>');
                    if(STATUS_KEYS.indexOf(key)!==-1){
                        var sel=$('<select class="col-filter"><option value="">All</option></select>');
                        Object.keys(STATUS_MAP).forEach(function(o){sel.append('<option value="'+o+'">'+o+'</option>');});
                        sel.on('change',function(e){e.stopPropagation();col.search(this.value).draw();});
                        wrap.append(sel);
                    } else {
                        var inp=$('<input class="col-filter" type="text" placeholder="Filter...">');
                        inp.on('keyup change clear',function(e){e.stopPropagation();if(col.search()!==this.value)col.search(this.value).draw();});
                        wrap.append(inp);
                    }
                    th.append(wrap);
                });
            }
        });
        $('#mainTable').on('click','.col-filter',function(e){e.stopPropagation();});
        new $.fn.dataTable.Buttons(dt,[
            {extend:'excel',className:'buttons-excel',filename:'rawdata_'+new Date().toISOString().slice(0,10),exportOptions:{columns:':visible'}},
            {extend:'csv',  className:'buttons-csv',  filename:'rawdata_'+new Date().toISOString().slice(0,10),exportOptions:{columns:':visible'}}
        ]);
        $('#btnExcel').on('click',function(){dt.button('.buttons-excel').trigger();});
        $('#btnCsv').on('click',function(){dt.button('.buttons-csv').trigger();});
    }).fail(function(){$('#loader').html('<div style="color:#be123c;font-size:13px"><i class="bi bi-exclamation-triangle"></i> Failed to load data</div>');});
});
</script>
</body>
</html>
