<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raw data · D-Map Admin</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235b2be0'/%3E%3Ctext x='16' y='22' font-family='Arial' font-size='16' font-weight='700' fill='white' text-anchor='middle'%3ED%3C/text%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="../admin/dmap-theme.css" rel="stylesheet">
    <script>try{document.documentElement.setAttribute('data-theme',localStorage.getItem('themePreference')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'))}catch(e){}</script>
    <script src="../admin/admin-app.js" defer></script>
</head>
<body>
<noscript>The D-Map admin panel needs JavaScript.</noscript>
<script>
document.addEventListener('DOMContentLoaded', function () {
    const D = window.DMap;

    // [key, title] in the old page's order and naming; types are derived from the key below
    const FIELDS = [
        ['work_request_id', 'Project Request ID'], ['work_request_user_id', 'Project Request User ID'], ['project_name', 'Project Name'], ['brand', 'Brand'],
        ['request_type_name', 'Project Requested To'], ['request_type_description', 'Project Requested To Description'], ['manager_names', 'Request Accepted By'], ['request_creator_id', 'Client ID'],
        ['request_creator_name', 'Client Name'], ['request_creator_division', 'Client Division'], ['request_creator_email', 'Client Email'], ['request_creator_phone', 'Client Phone'],
        ['request_creator_department', 'Client Department'], ['request_creator_designation', 'Client Designation'], ['request_creator_job_role', 'Client Job Role'], ['request_creator_location', 'Client Location'],
        ['project_type_name', 'Project Type'], ['project_type_description', 'Project Type Description'], ['priority', 'Project Priority'], ['task_count', 'No. of Project'],
        ['issue_task_count', 'Project Issue Count'], ['requested_at', 'Project Request Timestamp'], ['project_requested_accept_at_cm', 'Project Acceptance Timestamp'],
        ['project_start_date', 'Project Start Date'], ['project_end_date', 'Project End Date'], ['project_deadline', 'Project Deadline'], ['project_review', 'Project Review'],
        ['project_stage', 'Project Stage'], ['work_request_status', 'Project Request Status'], ['work_request_created_at', 'Project Request Created At'], ['work_request_updated_at', 'Project Updated At'],
        ['work_request_digi_comments', 'Project Digi Comments'], ['work_request_description', 'Work Request Description'], ['about_project', 'About Project'], ['remarks', 'Remarks'],
        ['project_type_id', 'Project Type ID'], ['work_request_type_id', 'Work Request Type ID'], ['work_request_project_id', 'Work Request Project ID'],
        ['manager_ids', 'Manager IDs'], ['task_id', 'Task ID'], ['task_name', 'Task Name'], ['task_request_type_name', 'Task Requested To'],
        ['task_type_name', 'Task Type'], ['task_assignment_type', 'Task Assignment Type'], ['assigned_user_name', 'Assigned Creative User'], ['task_version', 'Task Version'],
        ['task_no_of_work_pages', 'No. of Work Pages'], ['task_no_of_options_provided', 'No. of Options'], ['task_no_of_words_written', 'No. of Words Written'], ['task_options_submitted', 'Task Options Submitted'],
        ['task_concept_work', 'No. of Concept Created'], ['task_no_of_concepts', 'No. of Concepts'], ['task_resize_work', 'Includes Resize Work'], ['task_no_of_resize', 'No. of Resize Pages'],
        ['task_ai', 'Includes AI Work'], ['task_no_of_ai_page', 'No. of AI Pages'], ['task_responsive_screen', 'Task Responsive Screen'], ['task_no_of_responsive_screen', 'No. of Responsive UI Created'],
        ['task_duration_minutes', 'Task Duration Minutes'], ['task_duration_seconds', 'Task Duration Seconds'], ['task_video_duration', 'Video Duration'], ['task_product_shoot', 'Task Product Shoot'],
        ['task_no_of_products_shot', 'No. of Products Used'], ['task_shoot_setup', 'Includes Shoot Setup'], ['task_created_at', 'Task Created At'], ['task_updated_at', 'Task Updated At'],
        ['task_digi_comments', 'Task Digi Comments'], ['task_requester_description', 'Task Requester Description'], ['task_link', 'Task Link'], ['task_start_date', 'Task Start Date'],
        ['task_end_date', 'Task End Date'], ['task_deadline', 'Task Deadline'], ['task_review', 'Task Review'], ['task_review_stage', 'Task Review Stage'],
        ['task_status', 'Task Status'], ['task_assignment_id', 'Task Assignment ID'], ['task_request_type_id', 'Task Request Type ID'], ['task_type_id', 'Task Type ID'],
        ['task_work_request_id', 'Task Work Request ID'], ['task_intimate_team', 'Task Intimate Team'], ['task_intimate_client', 'Task Intimate Client'], ['task_shared_with_client_at', 'Task Shared With Client At'],
        ['task_requested_at_assign_intimate_cu', 'Task Request Timestamp'], ['task_requested_accept_at_cu', 'Task Request Response Timestamp'], ['task_shared_with_cm_at', 'Task Output Shared with CM Timestamp'], ['task_respond_on_output_cm', 'Task Output Response by CM Timestamp'],
        ['task_output_client_responded_approved', 'Task Output Client Responded Approved'], ['assigned_user_id', 'Assigned User ID'], ['assigned_user_email', 'Assigned User Email'], ['assigned_user_phone', 'Assigned User Phone'],
        ['assigned_user_department', 'Assigned User Department'], ['assigned_user_designation', 'Assigned User Designation'], ['assigned_user_job_role', 'Assigned User Job Role'], ['assigned_user_location', 'Assigned User Location'],
        ['issue_id', 'Change ID'], ['issue_parent_id', 'Change Parent ID'], ['issue_task_id', 'Change Task ID'], ['issue_requested_by_user_id', 'Change Requested By User ID'],
        ['issue_request_type_name', 'Change Requested To'], ['issue_requester_name', 'Client Name'], ['issue_requester_department', 'Change Requester Department'], ['issue_requester_designation', 'Change Requester Designation'],
        ['issue_requester_job_role', 'Change Requester Job Role'], ['issue_requester_location', 'Change Requester Location'], ['issue_assignment_type', 'Change Assignment Type'], ['issue_version', 'Change Version'],
        ['issue_task_count_pages', 'Change Task Count Pages'], ['issue_no_of_work_pages', 'No. of Change Pages'], ['issue_no_of_options_provided', 'No. of Options'], ['issue_no_of_words_written', 'No. of Words Written'],
        ['issue_options_submitted', 'Change Options Submitted'], ['issue_concept_work', 'No. of Concept Created'], ['issue_no_of_concepts', 'No. of Concepts'], ['issue_resize_work', 'Includes Resize Work'],
        ['issue_no_of_resize', 'No. of Resize Pages'], ['issue_ai', 'Includes AI Work'], ['issue_no_of_ai_page', 'No. of AI Pages'], ['issue_duration_minutes', 'Change Duration Minutes'],
        ['issue_duration_seconds', 'Change Duration Seconds'], ['issue_video_duration', 'Video Duration'], ['issue_product_shoot', 'Change Product Shoot'], ['issue_no_of_products_shot', 'No. of Products Used'],
        ['issue_shoot_setup', 'Includes Shoot Setup'], ['issue_no_of_responsive_screen', 'No. of Responsive UI Created'], ['issue_responsive_screen', 'Change Responsive Screen'], ['issue_requested_at_client', 'Project Request Timestamp'],
        ['issue_requested_accept_at_cm', 'Project Acceptance Timestamp'], ['issue_requested_at_assign_intimate_cu', 'Change Request Timestamp'], ['issue_requested_accept_at_cu', 'Change Request Response Timestamp'], ['issue_shared_with_cm_at', 'Change Output Shared with CM Timestamp'],
        ['issue_respond_on_output_cm', 'Change Output Response by CM Timestamp'], ['issue_shared_with_client_at', 'Change Output Shared with Client Timestamp'], ['issue_output_client_responded_approve', 'Change Output Client Responded Approved'], ['issue_start_date', 'Change Start Date'],
        ['issue_end_date', 'Change End Date'], ['issue_deadline', 'Change Deadline'], ['issue_review', 'Change Review'], ['issue_review_stage', 'Change Review Stage'],
        ['issue_status', 'Change Status'], ['issue_created_at', 'Change Created At'], ['issue_updated_at', 'Change Updated At'], ['issue_types', 'Change Types'],
        ['issue_register_ids', 'Change Register IDs'], ['issue_types_with_description', 'Change Types With Description'], ['issue_comments', 'Change Comments'], ['issue_description', 'Change Description'],
        ['issue_link', 'Change Link'], ['month', 'Month'], ['fy', 'FY'], ['task_description', 'task_description'],
        ['task_type_description', 'task_type_description'], ['issue_intimate_team', 'issue_intimate_team'], ['issue_intimate_client', 'issue_intimate_client'], ['issue_requester_id', 'issue_requester_id'],
        ['issue_requester_email', 'issue_requester_email'], ['issue_requester_phone', 'issue_requester_phone']
    ];
    const FILTER_ONLY = ['work_request_created_at', 'work_request_updated_at'];
    const STATUS_OPTIONS = { work_request_status: 'work_request_statuses', task_status: 'task_statuses', issue_status: 'issue_statuses', project_review: 'review_statuses', task_review: 'review_statuses', issue_review: 'review_statuses', project_stage: 'review_stages', task_review_stage: 'review_stages', issue_review_stage: 'review_stages' };
    const SELECTS = { request_type_name: 'request_types', task_request_type_name: 'request_types', issue_request_type_name: 'request_types', project_type_name: 'project_types', task_type_name: 'task_types', request_creator_name: 'clients', assigned_user_name: 'creative_team', priority: 'priorities' };

    function typeOf(key) {
        if (STATUS_OPTIONS[key]) return 'status';
        if (key === 'priority') return 'enum';
        if (/_link$/.test(key)) return 'link';
        if (/(^|_)id$|_ids$/.test(key)) return 'text';
        if (/description|comments|remarks|about_project|issue_types/.test(key)) return 'longtext';
        if (/_at$|_at_|created_at|updated_at|_approved$|_approve$|_on_output_cm$/.test(key)) return 'datetime';
        if (/_date$|deadline$/.test(key)) return 'date';
        if (/count|no_of|duration|_pages$|version$|_ai$/.test(key)) return 'number';
        if (/(concept_work|resize_work|shoot_setup|product_shoot|responsive_screen|intimate_team|intimate_client)$/.test(key)) return 'bool';
        if (key === 'project_name' || key === 'task_name') return 'name';
        return 'text';
    }

    const columns = FIELDS.map(([key, title]) => {
        const type = typeOf(key);
        const col = { key, title, type };
        // filter only: the response has no such field (the filter reads the request dates)
        if (FILTER_ONLY.includes(key)) col.filterOnly = true;
        if (STATUS_OPTIONS[key]) col.options = STATUS_OPTIONS[key];
        if (SELECTS[key]) { col.filter = 'select'; col.options = SELECTS[key]; }
        if (key === 'request_creator_division') { col.filter = 'select'; col.options = 'divisions'; col.match = 'contains'; }
        if (key === 'manager_names') { col.filter = 'select'; col.options = 'managers'; col.match = 'contains'; }
        if (/(^|_)id$/.test(key)) col.filter = 'text';
        return col;
    });

    const body = D.shell({ page: 'workrequesttasks', title: 'Raw data', icon: 'table', subtitle: 'One row per request × task × assignee × change, with every field. Pick the columns you need and export.' });

    D.grid(body, {
        id: 'raw', version: 4, title: 'Raw data', icon: 'table',
        endpoint: 'workrequesttasks/data', exportName: 'raw_data', pinned: 0,
        searchPlaceholder: 'Search project, client, task, assignee, status or ID…',
        quick: ['work_request_status', 'task_status', 'request_type_name', 'requested_at'],
        kpis: [
            { label: 'Rows', icon: 'database', tone: 'brand', value: s => s.total, hint: () => 'Request × task × assignee × change' },
            { label: 'Work requests', icon: 'folder2-open', tone: 'info', value: s => s.work_requests },
            { label: 'Tasks', icon: 'check2-square', tone: 'success', value: s => s.tasks },
            { label: 'Changes', icon: 'arrow-repeat', tone: 'warning', value: s => s.changes }
        ],
        columns,
        detailTitle: row => row.task_name || row.project_name || 'Record',
        detailSubtitle: row => [row.work_request_id && `Request #${row.work_request_id}`, row.task_id && `Task #${row.task_id}`, row.issue_id && `Change #${row.issue_id}`].filter(Boolean).join(' · '),
        detailGroups: [
            { title: 'Project', keys: FIELDS.filter(f => !/^task_|^assigned_user|^issue_/.test(f[0]) && !FILTER_ONLY.includes(f[0])).map(f => f[0]) },
            { title: 'Task', keys: FIELDS.filter(f => /^task_|^assigned_user/.test(f[0])).map(f => f[0]) },
            { title: 'Change', keys: FIELDS.filter(f => /^issue_/.test(f[0])).map(f => f[0]) }
        ]
    });
});
</script>
</body>
</html>
