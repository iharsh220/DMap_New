<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Raw Data</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdn.datatables.net/1.13.4/css/dataTables.bootstrap5.min.css" rel="stylesheet">
    <link href="https://cdn.datatables.net/buttons/2.3.6/css/buttons.bootstrap5.min.css" rel="stylesheet">
    <style>
        html, body { height: 100%; overflow: hidden; background: #f8f9fa; }
        #mainContent { height: 100vh; overflow: hidden; }
        .datatable-wrapper { background: #fff; padding: 15px; border-radius: 6px; height: calc(100vh - 110px); display: flex; flex-direction: column; }
        .dataTables_scrollBody { overflow-y: auto !important; overflow-x: auto !important; }
        table.dataTable thead th, table.dataTable tbody td { white-space: nowrap; font-size: 11px; padding: 4px 7px; }
        .dt-buttons { float: right; }
        .nav-tabs .nav-link.active { font-weight: 600; }
    </style>
</head>

<body>
    <div class="flex-grow-1" id="mainContent">
        <div class="container-fluid pt-3">
            <ul class="nav nav-tabs mb-3">
                <li class="nav-item">
                    <a class="nav-link" href="./projectsdetails">Projects</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="./taskdetails">Tasks</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="./issuedetails">Issues</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" href="./workrequesttasks">Raw Data</a>
                </li>
            </ul>

            <div class="datatable-wrapper">
                <table id="workRequestTasksTable" class="table table-bordered table-striped w-100">
                    <thead id="tableHead"></thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.4/js/dataTables.bootstrap5.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.3.6/js/dataTables.buttons.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.3.6/js/buttons.bootstrap5.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.3.6/js/buttons.html5.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script>
        $(document).ready(function() {
            $.getJSON('./workrequesttasks/data', function(response) {
                var columns = [];
                if(response.data && response.data.length > 0) {
                    Object.keys(response.data[0]).forEach(function(key) {
                        columns.push({ data: key, title: key, defaultContent: '-' });
                    });
                }
                
                $('#workRequestTasksTable').DataTable({
                    data: response.data,
                    columns: columns,
                    pageLength: 25,
                    lengthMenu: [[25, 50, 100, 200, -1], [25, 50, 100, 200, 'All']],
                    dom: 'lBfrtip',
                    scrollX: true,
                    scrollY: '60vh',
                    scrollCollapse: true,
                buttons: [
                    { extend: 'excel', text: '<i class="bi bi-file-earmark-excel"></i>', className: 'btn btn-success btn-sm', titleAttr: 'Export to Excel', filename: function() { return 'workrequest_raw_' + new Date().toISOString().slice(0, 10); } },
                    { extend: 'csv', text: '<i class="bi bi-filetype-csv"></i>', className: 'btn btn-secondary btn-sm', titleAttr: 'Export to CSV', filename: function() { return 'workrequest_raw_' + new Date().toISOString().slice(0, 10); } }
                ]
                });
            });
        });
    </script>
</body>

</html>
