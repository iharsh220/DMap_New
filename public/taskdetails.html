<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasks · D-Map Admin</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235b2be0'/%3E%3Ctext x='16' y='22' font-family='Arial' font-size='16' font-weight='700' fill='white' text-anchor='middle'%3ED%3C/text%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="../admin/dmap-theme.css" rel="stylesheet">
    <script>try{document.documentElement.setAttribute('data-theme',localStorage.getItem('themePreference')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'))}catch(e){}</script>
    <script src="../admin/admin-app.js" defer></script>
</head>
<body>
<noscript>The D-Map admin panel needs JavaScript.</noscript>
<script>
document.addEventListener('DOMContentLoaded', function () {
    const D = window.DMap;
    const OPEN = ['draft', 'pending', 'accepted', 'assigned', 'in_progress', 'deferred'];
    const yesterday = () => { const d = new Date(); d.setDate(d.getDate() - 1); return D.isoDay(d); };
    const C = (key, title, type, extra) => Object.assign({ key, title, type }, extra || {});

    const body = D.shell({ page: 'taskdetails', title: 'Tasks', icon: 'check2-square', subtitle: 'Every task across work requests: owners, schedule, effort, cost and turnaround' });

    const grid = D.grid(body, {
        id: 'tasks', version: 4, title: 'Tasks', icon: 'check2-square',
        endpoint: 'taskdetails/data', exportName: 'tasks', pinned: 3,
        searchPlaceholder: 'Search task, type, client, status or request ID…',
        quick: ['task_status', 'task_type_name', 'task_manager_vertical', 'assigned_creative_user', 'task_deadline'],
        kpis: [
            { label: 'Total tasks', icon: 'check2-square', tone: 'brand', value: s => s.total, hint: s => `${D.fmt.num(s.projects)} projects` },
            { label: 'Completed', icon: 'check-circle', tone: 'success', value: s => s.completed, share: true, filter: { key: 'task_status', values: ['completed'] } },
            { label: 'In progress', icon: 'arrow-repeat', tone: 'info', value: s => s.in_progress, share: true, filter: { key: 'task_status', values: ['in_progress'] } },
            { label: 'Pending', icon: 'hourglass-split', tone: 'warning', value: s => s.pending, share: true, filter: { key: 'task_status', values: ['pending'] } },
            { label: 'Overdue', icon: 'alarm', tone: 'danger', value: s => s.overdue, hint: () => 'Open past the deadline',
              filter: { key: 'task_deadline', type: 'range', from: '', to: yesterday(), also: { task_status: { type: 'exact', values: OPEN } } } }
        ],
        statusBar: { column: 'task_status', title: 'Task status breakdown' },
        columns: [
            C('task_status', 'Task Status', 'status', { options: 'task_statuses' }),
            C('work_request_id', 'Project Request ID', 'id'),
            C('task_id', 'Task ID', 'id'),
            C('change_id', 'Change ID', 'text'),
            C('task_name', 'Task Name', 'name'),
            C('task_type_name', 'Task Type', 'text', { filter: 'select', options: 'task_types' }),
            C('task_requester_name', 'Client Name', 'text', { filter: 'select', options: 'clients' }),
            C('client_division', 'Client Division', 'text', { filter: 'select', options: 'divisions', match: 'contains' }),
            C('project_manager', 'Project Manager', 'text', { filter: 'select', options: 'managers', match: 'contains' }),
            C('project_manager_vertical', 'Project Manager Vertical', 'text', { filter: 'select', options: 'divisions', match: 'contains' }),
            C('task_manager', 'Task Manager', 'text', { filter: 'select', options: 'managers', match: 'contains' }),
            C('task_manager_vertical', 'Task Manager Vertical', 'text', { filter: 'select', options: 'digilabs_verticals', match: 'contains' }),
            C('assigned_creative_user', 'Assigned Creative User', 'text', { filter: 'select', options: 'creative_team', match: 'contains' }),
            C('cu_vertical', 'CU Vertical', 'text', { filter: 'select', options: 'divisions', match: 'contains' }),
            C('task_start_date', 'Task Start Date', 'date'),
            C('task_end_date', 'Task End Date', 'date'),
            C('task_deadline', 'Task Deadline', 'date'),
            C('task_no_of_work_pages', 'No. of Work Pages', 'number'),
            C('issue_no_of_work_pages', 'No. of Change Pages', 'number'),
            C('task_no_of_options_provided', 'No. of Options', 'number'),
            C('task_concept_work', 'No. of Concept Created', 'bool'),
            C('task_no_of_concepts', 'No. of Concepts', 'number'),
            C('concept_work_cost', 'Concept Work Cost', 'money', { adminOnly: true }),
            C('task_no_of_resize', 'No. of Resize Pages', 'number'),
            C('task_no_of_ai_page', 'No. of AI Pages', 'number'),
            C('ai_charges_cost', 'AI Charges Cost', 'money', { adminOnly: true }),
            C('video_duration', 'Video Duration', 'number'),
            C('task_no_of_products_shot', 'No. of Products Used', 'number'),
            C('task_no_of_words_written', 'No. of Words Written', 'number'),
            C('task_no_of_responsive_screen', 'No. of Responsive UI Created', 'number'),
            C('task_resize_work', 'Includes Resize Work', 'bool'),
            C('resize_work_cost', 'Resize Work Cost', 'money', { adminOnly: true }),
            C('task_ai', 'Includes AI Work', 'number'),
            C('task_shoot_setup', 'Includes Shoot Setup', 'bool'),
            C('task_request_timestamp', 'Task Request Timestamp', 'datetime'),
            C('task_request_response_timestamp', 'Task Request Response Timestamp', 'datetime'),
            C('task_request_to_response_tat', 'Task Request to Response TAT', 'tat'),
            C('task_output_shared_with_cm_timestamp', 'Task Output Shared with CM Timestamp', 'datetime'),
            C('task_acceptance_to_completion_tat_by_cu', 'Task Acceptance to Completion TAT by CU', 'tat'),
            C('task_output_response_by_cm_timestamp', 'Task Output Response by CM Timestamp', 'datetime'),
            C('task_output_shared_to_response_by_cm_tat', 'Task Output Shared to Response by CM TAT', 'tat'),
            C('task_output_shared_with_client_timestamp', 'Task Output Shared with Client Timestamp', 'datetime'),
            C('task_internal_tat', 'Task Internal TAT', 'tat'),
            C('task_output_response_by_client_timestamp', 'Task Output Response by Client Timestamp', 'datetime'),
            C('task_whole_tat', 'Task Whole TAT', 'tat'),
            C('task_request_response_reminder_counter_to_cu', 'Task Request Response Reminder Counter To CU', 'number'),
            C('task_output_response_reminder_counter_to_cm', 'Task Output Response Reminder Counter To CM', 'number'),
            C('task_output_response_reminder_counter_to_client', 'Task Output Response Reminder Counter To Client', 'number'),
            C('client_change_requested_counter', 'Client Change Requested Counter', 'number'),
            C('cm_change_requested_counter', 'CM Change Requested Counter', 'number'),
            C('change_version', 'Change Version', 'text'),
            C('month', 'Month', 'text'),
            C('fy', 'Financial Year', 'text'),
            // costs last: task work, all its changes, and the two together
            C('task_cost', 'Task Cost', 'money', { adminOnly: true }),
            C('change_cost', 'Change Cost', 'money', { adminOnly: true }),
            C('total_cost', 'Total Cost', 'money', { adminOnly: true }),
            C('task_created_at', 'Created', 'date', { filterOnly: true })
        ],
        detailTitle: row => row.task_name || `Task #${row.task_id}`,
        detailSubtitle: row => `Task #${row.task_id} · Request #${row.work_request_id}`,
        detailGroups: [
            { title: 'Task', keys: ['task_status', 'task_id', 'task_name', 'task_type_name', 'work_request_id', 'change_id', 'change_version', 'month', 'fy'] },
            { title: 'People', keys: ['task_requester_name', 'client_division', 'project_manager', 'project_manager_vertical', 'task_manager', 'task_manager_vertical', 'assigned_creative_user', 'cu_vertical'] },
            { title: 'Schedule', keys: ['task_start_date', 'task_end_date', 'task_deadline', 'task_request_timestamp', 'task_request_response_timestamp', 'task_output_shared_with_cm_timestamp', 'task_output_response_by_cm_timestamp', 'task_output_shared_with_client_timestamp', 'task_output_response_by_client_timestamp'] },
            { title: 'Turnaround', keys: ['task_request_to_response_tat', 'task_acceptance_to_completion_tat_by_cu', 'task_output_shared_to_response_by_cm_tat', 'task_internal_tat', 'task_whole_tat'] },
            { title: 'Effort & cost', keys: ['task_cost', 'change_cost', 'total_cost', 'task_no_of_work_pages', 'issue_no_of_work_pages', 'task_no_of_options_provided', 'task_concept_work', 'task_no_of_concepts', 'concept_work_cost', 'task_no_of_resize', 'task_resize_work', 'resize_work_cost', 'task_no_of_ai_page', 'task_ai', 'ai_charges_cost', 'video_duration', 'task_no_of_products_shot', 'task_no_of_words_written', 'task_no_of_responsive_screen', 'task_shoot_setup'] }
        ],
        rowActions: [
            { icon: 'pencil', label: 'Edit task', onClick: row => editTask(row) },
            { icon: 'trash3', label: 'Delete task', tone: 'danger', onClick: row => deleteTask(row) }
        ]
    });

    function editTask(row) {
        const statuses = ['draft', 'pending', 'accepted', 'assigned', 'in_progress', 'completed', 'rejected', 'deferred'];
        const yesNo = [{ value: '0', label: 'No' }, { value: '1', label: 'Yes' }];
        D.editRecord({
            type: 'task', id: row.task_id, title: 'Edit task', subtitle: `Task #${row.task_id}`,
            onDone: () => grid.reload(),
            fields: ({ record: r }) => [
                { name: 'task_name', label: 'Task name', value: r.task_name, span: 2 },
                { name: 'version', label: 'Version', value: r.version },
                { name: 'status', label: 'Status', type: 'select', value: r.status, options: statuses, labeler: D.statusLabel },
                { name: 'review', label: 'Review', type: 'select', value: r.review, options: ['pending', 'approved', 'change_request'], labeler: D.statusLabel },
                { name: 'review_stage', label: 'Review stage', type: 'select', value: r.review_stage, options: ['not_started', 'manager_review', 'pm_review', 'change_requested', 'final_approved'], labeler: D.statusLabel },
                { name: 'assignment_type', label: 'Assignment type', type: 'select', value: r.assignment_type, options: [{ value: 'new', label: 'New' }, { value: 'mod', label: 'Modification' }] },
                { name: 'start_date', label: 'Start', type: 'datetime-local', value: D.toDateTimeLocal(r.start_date) },
                { name: 'end_date', label: 'End', type: 'datetime-local', value: D.toDateTimeLocal(r.end_date) },
                { name: 'deadline', label: 'Deadline', type: 'datetime-local', value: D.toDateTimeLocal(r.deadline) },
                { name: 'task_count', label: 'Work pages', type: 'number', value: r.task_count, min: 0 },
                { name: 'no_of_options_provided', label: 'Options provided', type: 'number', value: r.no_of_options_provided, min: 0 },
                { name: 'no_of_concepts', label: 'Concepts', type: 'number', value: r.no_of_concepts, min: 0 },
                { name: 'no_of_resize', label: 'Resize pages', type: 'number', value: r.no_of_resize, min: 0 },
                { name: 'no_of_images_videos_audio', label: 'AI / images / videos / audio', type: 'number', value: r.no_of_images_videos_audio, min: 0 },
                { name: 'duration_minutes', label: 'Duration (minutes)', type: 'number', value: r.duration_minutes, min: 0 },
                { name: 'duration_seconds', label: 'Duration (seconds)', type: 'number', value: r.duration_seconds, min: 0 },
                { name: 'no_of_products_shot', label: 'Products shot', type: 'number', value: r.no_of_products_shot, min: 0 },
                { name: 'no_of_words_written', label: 'Words written', type: 'number', value: r.no_of_words_written, min: 0 },
                { name: 'no_of_responsive_screen', label: 'Responsive screens', type: 'number', value: r.no_of_responsive_screen, min: 0 },
                { name: 'concept_work', label: 'Concept work', type: 'select', value: String(r.concept_work ?? 0), options: yesNo },
                { name: 'resize_work', label: 'Resize work', type: 'select', value: String(r.resize_work ?? 0), options: yesNo },
                { name: 'shoot_setup', label: 'Shoot setup', type: 'select', value: String(r.shoot_setup ?? 0), options: yesNo },
                { name: 'intimate_team', label: 'Intimate team', type: 'select', value: String(r.intimate_team ?? 0), options: yesNo },
                { name: 'intimate_client', label: 'Intimate client', type: 'select', value: String(r.intimate_client ?? 0), options: yesNo },
                { name: 'link', label: 'Link', value: r.link, span: 2 },
                { name: 'comments', label: 'Comments', type: 'textarea', value: r.comments },
                { name: 'description', label: 'Description', type: 'textarea', value: r.description }
            ]
        });
    }

    function deleteTask(row) {
        D.confirmDelete({
            type: 'task', id: row.task_id, title: `Delete task #${row.task_id}?`, confirmLabel: 'Delete task', doneMessage: 'Task deleted',
            onDone: () => grid.reload(),
            renderPreview: p => {
                const r = p.record || {};
                return D.previewBlock('This task will be deleted', [['Task ID', r.id], ['Name', r.task_name], ['Status', r.status && D.statusLabel(r.status)], ['Changes', r.issue_count]], {
                    title: `${(p.issues || []).length} linked change(s) will also be deleted`,
                    items: (p.issues || []).map(i => [`Change #${i.id} — ${i.assignment_type || 'N/A'}`, `v${i.version || 1}`]),
                    empty: 'No changes are linked to this task.'
                });
            }
        });
    }
});
</script>
</body>
</html>
