<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaves · D-Map Admin</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235b2be0'/%3E%3Ctext x='16' y='22' font-family='Arial' font-size='16' font-weight='700' fill='white' text-anchor='middle'%3ED%3C/text%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="../admin/dmap-theme.css" rel="stylesheet">
    <script>try{document.documentElement.setAttribute('data-theme',localStorage.getItem('themePreference')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'))}catch(e){}</script>
    <script src="../admin/admin-app.js" defer></script>
</head>
<body>
<noscript>The D-Map admin panel needs JavaScript.</noscript>
<script>
document.addEventListener('DOMContentLoaded', function () {
    const D = window.DMap;
    const C = (key, title, type, extra) => Object.assign({ key, title, type }, extra || {});
    const DAY_TYPES = ['Full day', 'Half day', 'Short Hours', 'WFH'];
    // Allowed leave reasons per day type
    const REASONS = {
        'Full day': ['Emergency', 'Medical', 'Optional', 'Personal', 'Sick Leave'],
        'Half day': ['Emergency', 'Medical', 'Personal', 'Sick Leave', 'Going Early'],
        'Short Hours': ['Personal', 'Reached late', 'Going Early'],
        'WFH': ['FWFH', 'Medical', 'RWFH']
    };
    const REASON_TEXTS = ['Due to heavy rain', 'Family Emergency', 'Feeling not well', 'Go Early', 'Goinng on vacation', 'Medical appointment', 'Medical Appointmet', 'Medical emergency', 'Not feeling well', 'Personal reason', 'Personal work', 'Reached late', 'Vacation', 'WFH'];

    const body = D.shell({
        page: 'leaves', title: 'Leaves', icon: 'calendar2-week', subtitle: 'Team leave register: planned vs unplanned, informed vs not, by day type',
        actions: [
            { label: 'Upload', icon: 'cloud-arrow-up', onClick: () => D.uploadWithProgress({ title: 'Importing leaves', endpoint: 'leaves/upload', progress: id => 'leaves/upload/progress/' + id, onDone: () => grid.reload() }) },
            { label: 'Add leave', icon: 'plus-lg', variant: 'primary', onClick: () => openLeave() }
        ]
    });

    const grid = D.grid(body, {
        id: 'leaves', version: 4, title: 'Leaves', icon: 'calendar2-week',
        endpoint: 'leaves/data', exportName: 'leaves', pinned: 3,
        searchPlaceholder: 'Search name, reason, vertical, remark…',
        quick: ['leave_day_type', 'leave_type', 'status', 'from_date'],
        kpis: [
            { label: 'Leaves', icon: 'calendar2-week', tone: 'brand', value: s => s.total, hint: s => `${D.fmt.num(s.days)} days in total` },
            { label: 'Full day', icon: 'sun', tone: 'info', value: s => s.full_day, share: true, filter: { key: 'leave_day_type', values: ['Full day'] } },
            { label: 'Half day', icon: 'brightness-alt-high', tone: 'accent', value: s => s.half_day, share: true, filter: { key: 'leave_day_type', values: ['Half day'] } },
            { label: 'Short hours', icon: 'clock', tone: 'neutral', value: s => s.short_hours, share: true, filter: { key: 'leave_day_type', values: ['Short Hours'] } },
            { label: 'Work from home', icon: 'house-door', tone: 'success', value: s => s.wfh, share: true, filter: { key: 'leave_day_type', values: ['WFH'] } },
            { label: 'Unplanned', icon: 'lightning', tone: 'warning', value: s => s.unplanned, share: true, filter: { key: 'leave_type', values: ['Unplanned'] } },
            { label: 'Not informed', icon: 'bell-slash', tone: 'danger', value: s => s.not_informed, share: true, filter: { key: 'status', values: ['Not Inform'] } }
        ],
        columns: [
            C('id', 'ID', 'id'),
            C('user_id', 'User ID', 'id', { filter: 'text' }),
            C('name', 'Username', 'name', { get: r => r.user && r.user.name }),
            C('from_date', 'From Date', 'date'),
            C('to_date', 'To Date', 'date'),
            C('day', 'Day', 'text'),
            C('leave_day_type', 'Leave Day Type', 'text', { filter: 'select', options: DAY_TYPES }),
            C('leave_type', 'Leave Type', 'enum', { options: ['Planned', 'Unplanned'] }),
            C('status', 'Status', 'enum', { options: ['Inform', 'Not Inform'] }),
            C('leave_reason', 'Leave Reason', 'text', { filter: 'select', options: [...new Set([].concat(...Object.values(REASONS)))].sort() }),
            C('vertical', 'Division', 'text', { filter: 'select', options: 'divisions' }),
            C('days_count', 'Days Count', 'number'),
            C('reason', 'Reason', 'longtext'),
            C('remark', 'Remark', 'longtext'),
            C('checker_remark', 'Checker Remark', 'longtext'),
            C('month', 'Month', 'text'),
            C('year', 'Year', 'text')
        ],
        detailTitle: row => `${(row.user && row.user.name) || 'Leave'} · ${row.leave_day_type || ''}`,
        detailSubtitle: row => `${D.fmt.date(row.from_date) || ''}${row.to_date && row.to_date !== row.from_date ? ' – ' + D.fmt.date(row.to_date) : ''}`,
        rowActions: [
            { icon: 'pencil', label: 'Edit leave', onClick: row => editLeave(row.id) },
            { icon: 'trash3', label: 'Delete leave', tone: 'danger', onClick: row => deleteLeave(row) }
        ]
    });

    // ---------------- add / edit ----------------
    let usersPromise = null;
    const loadUsers = () => usersPromise || (usersPromise = D.api('leaves/users?limit=-1').then(r => r.data || []).catch(() => { usersPromise = null; return []; }));
    const today = () => D.isoDay(new Date());

    async function editLeave(id) {
        try {
            const res = await D.api('leaves/' + encodeURIComponent(id));
            openLeave(res.data);
        } catch (err) {
            D.toast('Could not load the leave: ' + err.message, 'danger');
        }
    }

    async function openLeave(leave) {
        const users = await loadUsers();
        const me = D.user() || {};
        const isEdit = !!leave;
        const from0 = isEdit ? String(leave.from_date || '').split('T')[0] : today();
        const to0 = isEdit ? String(leave.to_date || '').split('T')[0] : from0;
        const dayType0 = isEdit ? leave.leave_day_type : 'Full day';
        const form = D.form([
            { name: 'user_id', label: 'Employee', type: 'select', required: true, span: 2, disabled: isEdit,
              value: isEdit ? leave.user_id : (users.some(u => String(u.id) === String(me.id)) ? me.id : ''),
              options: [{ value: '', label: 'Select employee' }].concat(users.map(u => ({ value: u.id, label: `${u.name} (${u.email})` }))) },
            { name: 'leave_day_type', label: 'Day type', type: 'select', required: true, value: dayType0, options: DAY_TYPES },
            { name: 'vertical', label: 'Vertical', type: 'readonly', value: isEdit ? leave.vertical || '' : '', help: 'Taken from the employee’s division' },
            { name: 'from_date', label: 'From', type: 'date', required: true, value: from0 },
            { name: 'to_date', label: 'To', type: 'date', required: true, value: to0 },
            { name: 'leave_type', label: 'Leave type', type: 'select', value: isEdit ? leave.leave_type : 'Planned', options: ['Planned', 'Unplanned'], disabled: true, help: 'Planned when booked 24 h ahead' },
            { name: 'status', label: 'Informed', type: 'select', value: isEdit ? leave.status : 'Inform', options: [{ value: 'Inform', label: 'Informed' }, { value: 'Not Inform', label: 'Not informed' }], disabled: true, help: 'Not informed when entered after the day' },
            { name: 'leave_reason', label: 'Leave reason', type: 'select', required: true, value: isEdit ? leave.leave_reason : '', options: REASONS[dayType0] || [] },
            { name: 'days_count', label: 'Days', type: 'number', readonly: true, value: isEdit ? leave.days_count : 1, step: 0.5 },
            { name: 'reason', label: 'Reason', type: 'select', span: 2, value: isEdit ? leave.reason || '' : '', options: [{ value: '', label: 'Select a reason (optional)' }].concat(REASON_TEXTS) },
            { name: 'remark', label: 'Remark', type: 'textarea', value: isEdit ? leave.remark || '' : '' },
            { name: 'checker_remark', label: 'Checker remark', type: 'textarea', value: isEdit ? leave.checker_remark || '' : '', hidden: !D.isAdmin() }
        ]);
        const f = form.inputs;

        const setReasons = (dayType, selected) => {
            f.leave_reason.innerHTML = '';
            (REASONS[dayType] || []).forEach(r => { const o = document.createElement('option'); o.value = r; o.textContent = r; f.leave_reason.appendChild(o); });
            if (selected && (REASONS[dayType] || []).includes(selected)) f.leave_reason.value = selected;
        };
        const setDerived = () => {
            const dayType = f.leave_day_type.value;
            const from = f.from_date.value;
            if (from) {
                // Planned when the leave starts at least 24 hours from now; "Not informed" when entered after the day
                f.leave_type.value = (new Date(from) - new Date()) / 36e5 >= 24 ? 'Planned' : 'Unplanned';
                f.status.value = from >= today() ? 'Inform' : 'Not Inform';
            }
            if (dayType === 'WFH') {
                const max = new Date(from); max.setDate(max.getDate() + 1);
                f.to_date.disabled = false; f.to_date.min = from; f.to_date.max = from ? D.isoDay(max) : '';
                if (!f.to_date.value || f.to_date.value < from || f.to_date.value > f.to_date.max) f.to_date.value = from;
            } else if (dayType === 'Full day') {
                f.to_date.disabled = false; f.to_date.min = from; f.to_date.removeAttribute('max');
                if (f.to_date.value < from) f.to_date.value = from;
            } else {
                f.to_date.value = from; f.to_date.disabled = true;
            }
            let days = 1;
            if (from && f.to_date.value) {
                const span = Math.max(1, Math.round((new Date(f.to_date.value) - new Date(from)) / 864e5) + 1);
                days = dayType === 'WFH' || dayType === 'Short Hours' ? 0 : dayType === 'Half day' ? span * 0.5 : span;
            }
            f.days_count.value = days;
        };
        const loadVertical = async () => {
            if (!f.user_id.value) { f.vertical.value = ''; return; }
            try {
                const res = await D.api(`leaves/users/${encodeURIComponent(f.user_id.value)}/division`);
                f.vertical.value = (res.data && res.data.division_name) || '';
            } catch (e) { f.vertical.value = ''; }
        };
        setReasons(dayType0, isEdit ? leave.leave_reason : null);
        setDerived();
        if (!isEdit) loadVertical();
        f.leave_day_type.addEventListener('change', () => { setReasons(f.leave_day_type.value); setDerived(); });
        f.from_date.addEventListener('change', setDerived);
        f.to_date.addEventListener('change', setDerived);
        f.user_id.addEventListener('change', loadVertical);

        D.modal({
            title: isEdit ? 'Edit leave' : 'Add leave', subtitle: isEdit ? `${(leave.user && leave.user.name) || ''}` : 'Leave type, informed status and days are filled in automatically',
            icon: 'calendar-plus', size: 'lg', body: form.el,
            actions: [{ label: 'Cancel' }, { label: isEdit ? 'Save changes' : 'Add leave', icon: 'check2', variant: 'primary', onClick: async (dlg, btn) => {
                const v = form.values();
                const data = {
                    from_date: v.from_date, to_date: f.to_date.value, user_id: parseInt(f.user_id.value, 10),
                    leave_day_type: v.leave_day_type.trim(), leave_type: f.leave_type.value.trim(), status: f.status.value.trim(),
                    leave_reason: v.leave_reason.trim(), vertical: v.vertical.trim() || null, days_count: parseFloat(v.days_count) || 1,
                    reason: v.reason.trim() || null, remark: v.remark.trim() || null, checker_remark: v.checker_remark.trim() || null
                };
                if (!data.from_date || !data.to_date || !data.user_id) { D.toast('Please choose the employee and the dates', 'warning'); return; }
                if (data.leave_day_type !== 'Full day' && data.leave_day_type !== 'WFH' && data.from_date !== data.to_date) { D.toast(`${data.leave_day_type} leave must be a single day`, 'warning'); return; }
                if (data.leave_day_type === 'WFH' && Math.round((new Date(data.to_date) - new Date(data.from_date)) / 864e5) + 1 > 2) { D.toast('WFH is allowed for at most 2 days', 'warning'); return; }
                D.setBusy(btn, true, 'Saving…');
                try {
                    await D.api(isEdit ? 'leaves/' + encodeURIComponent(leave.id) : 'leaves', { method: isEdit ? 'PUT' : 'POST', body: data });
                    dlg.close();
                    D.toast(isEdit ? 'Leave updated' : 'Leave added');
                    grid.reload();
                } catch (err) {
                    D.setBusy(btn, false);
                    D.toast(err.message || 'Failed to save leave', 'danger', 6000);
                }
            } }]
        });
    }

    async function deleteLeave(row) {
        const who = (row.user && row.user.name) || 'this employee';
        if (!(await D.confirm({ title: 'Delete this leave?', message: `${row.leave_day_type || 'Leave'} for ${who} on ${D.fmt.date(row.from_date) || row.from_date} will be removed.`, confirmLabel: 'Delete', tone: 'danger', icon: 'trash3' }))) return;
        try {
            await D.api('leaves/' + encodeURIComponent(row.id), { method: 'DELETE' });
            D.toast('Leave deleted');
            grid.reload();
        } catch (err) {
            D.toast(err.message || 'Failed to delete leave', 'danger', 6000);
        }
    }
});
</script>
</body>
</html>
