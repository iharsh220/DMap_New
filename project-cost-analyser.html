<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project Cost Analyser</title>
  <style>
    :root {
      --bg: #f5f6f8;
      --card: #fff;
      --ink: #1b1f29;
      --muted: #667085;
      --line: #e3e6ec;
      --accent: #3a5bd9;
      --accent-ink: #fff;
      --head: #f0f2f6;
      --hover: #f7f8fb;
      --danger: #c0392b;
      --ok: #1c7c54;
      --c-work: #3a5bd9;
      --c-change: #e08a1e;
      --c-concept: #8a4fd1;
      --c-ai: #0f9aa8;
      --c-rush: #d64545;
      --c-special: #6b7280;
    }

    @media (prefers-color-scheme:dark) {
      :root {
        --bg: #12141a;
        --card: #1b1e27;
        --ink: #e8eaf0;
        --muted: #98a0b3;
        --line: #2c303c;
        --accent: #7b95ff;
        --accent-ink: #0d1020;
        --head: #232734;
        --hover: #222633;
        --danger: #ff7b6b;
        --ok: #4cc38a;
        --c-work: #7b95ff;
        --c-change: #f0a548;
        --c-concept: #b58cf0;
        --c-ai: #3fc7d6;
        --c-rush: #ff7b7b;
        --c-special: #9aa3b2;
      }
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif
    }

    .app {
      display: flex;
      min-height: 100vh;
      background: var(--bg)
    }

    .sidebar {
      width: 240px;
      flex-shrink: 0;
      border-right: 1px solid var(--line);
      background: var(--card);
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto
    }

    .sidebar .brand {
      padding: 18px 22px;
      border-bottom: 1px solid var(--line)
    }

    .sidebar .brand h1 {
      font-size: 17px;
      margin: 0
    }

    .sidebar .brand .sub {
      font-size: 11px
    }

    .tabs {
      display: flex;
      flex-direction: column;
      padding: 8px
    }

    .tab {
      border: 0;
      background: none;
      color: var(--muted);
      padding: 10px 16px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      border-left: 3px solid transparent;
      border-radius: 0 8px 8px 0;
      display: flex;
      align-items: center;
      gap: 8px
    }

    .tab.on {
      color: var(--accent);
      border-color: var(--accent);
      background: var(--hover)
    }

    .tab-ic {
      font-size: 16px
    }

    .main-wrap {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column
    }

    header {
      padding: 18px 24px 0
    }

    h1 {
      font-size: 20px;
      margin: 0 0 2px
    }

    .sub {
      color: var(--muted);
      font-size: 13px
    }

    main {
      padding: 16px 24px 40px;
      flex: 1;
      min-width: 0
    }

    .bar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 14px
    }

    .chips {
      display: flex;
      gap: 6px;
      flex-wrap: wrap
    }

    .chip {
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--ink);
      border-radius: 999px;
      padding: 5px 13px;
      cursor: pointer;
      font: inherit;
      font-size: 13px
    }

    .chip.on {
      background: var(--accent);
      color: var(--accent-ink);
      border-color: var(--accent)
    }

    select,
    input[type=text],
    input[type=number],
    input[type=search] {
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--ink);
      border-radius: 8px;
      padding: 7px 10px;
      font: inherit;
      font-size: 13px;
      min-width: 0
    }

    input:focus,
    select:focus {
      outline: 2px solid var(--accent);
      outline-offset: -1px
    }

    .btn {
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--ink);
      border-radius: 8px;
      padding: 7px 13px;
      font: inherit;
      font-size: 13px;
      cursor: pointer
    }

    .btn:hover {
      background: var(--hover)
    }

    .btn.pri {
      background: var(--accent);
      color: var(--accent-ink);
      border-color: var(--accent);
      font-weight: 600
    }

    .btn.sm {
      padding: 3px 9px;
      font-size: 12px
    }

    .btn.dng {
      color: var(--danger)
    }

    .spacer {
      flex: 1
    }

    .kpis {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 12px;
      margin-bottom: 14px
    }

    .kpi {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 14px
    }

    .kpi .l {
      color: var(--muted);
      font-size: 12px
    }

    .kpi .v {
      font-size: 22px;
      font-weight: 700;
      margin-top: 2px;
      font-variant-numeric: tabular-nums
    }

    .split {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 14px
    }

    .split .stack {
      display: flex;
      height: 14px;
      border-radius: 7px;
      overflow: hidden;
      background: var(--head);
      margin: 8px 0 10px
    }

    .split .stack i {
      display: block;
      height: 100%
    }

    .legend {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      font-size: 12px
    }

    .legend span {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--muted)
    }

    .legend b {
      color: var(--ink);
      font-variant-numeric: tabular-nums
    }

    .legend em {
      width: 10px;
      height: 10px;
      border-radius: 3px;
      display: inline-block
    }

    .tw {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow: auto;
      max-height: 68vh
    }

    table {
      border-collapse: separate;
      border-spacing: 0;
      width: max-content;
      min-width: 100%
    }

    th,
    td {
      padding: 8px 12px;
      border-bottom: 1px solid var(--line);
      white-space: nowrap;
      text-align: left
    }

    th {
      position: sticky;
      top: 0;
      background: var(--head);
      font-size: 12px;
      color: var(--muted);
      font-weight: 600;
      cursor: pointer;
      user-select: none;
      z-index: 2
    }

    th.num,
    td.num {
      text-align: right;
      font-variant-numeric: tabular-nums
    }

    tbody tr:hover td {
      background: var(--hover)
    }

    td.s1,
    th.s1 {
      position: sticky;
      left: 0;
      z-index: 1;
      background: var(--card);
      min-width: 92px
    }

    td.s2,
    th.s2 {
      position: sticky;
      left: 92px;
      z-index: 1;
      background: var(--card);
      min-width: 230px;
      max-width: 280px;
      overflow: hidden;
      text-overflow: ellipsis
    }

    th.s1,
    th.s2 {
      background: var(--head);
      z-index: 3
    }

    tbody tr:hover td.s1,
    tbody tr:hover td.s2 {
      background: var(--hover)
    }

    tfoot td {
      position: sticky;
      bottom: 0;
      background: var(--head);
      font-weight: 700;
      z-index: 2;
      border-top: 2px solid var(--line)
    }

    tfoot td.s1,
    tfoot td.s2 {
      z-index: 3;
      background: var(--head)
    }

    td.tot {
      font-weight: 700
    }

    .badge {
      display: inline-block;
      border-radius: 6px;
      padding: 1px 8px;
      font-size: 11px;
      font-weight: 600;
      background: var(--head);
      color: var(--muted)
    }

    .badge.v-Artwork {
      background: #e4eaff;
      color: #2a45b5
    }

    .badge.v-Video {
      background: #fde9d0;
      color: #9a5a0a
    }

    .badge.v-Content\ Writing {
      background: #ece3fa;
      color: #5b2fa0
    }

    .badge.v-Shoot {
      background: #d8f1f4;
      color: #0b6c76
    }

    .badge.v-Web {
      background: #dcf2e6;
      color: #1c6b47
    }

    @media (prefers-color-scheme:dark) {
      .badge.v-Artwork {
        background: #27316b;
        color: #c6d1ff
      }

      .badge.v-Video {
        background: #5a3a0e;
        color: #ffd9a3
      }

      .badge.v-Content\ Writing {
        background: #40296b;
        color: #e0d0ff
      }

      .badge.v-Shoot {
        background: #0f4a52;
        color: #bdeff4
      }

      .badge.v-Web {
        background: #17503a;
        color: #bdeed6
      }
    }

    .flag {
      display: inline-block;
      border-radius: 6px;
      padding: 1px 7px;
      font-size: 11px;
      font-weight: 600;
      margin-right: 4px
    }

    .flag.r {
      background: #fde4e4;
      color: #a12b2b
    }

    .flag.s {
      background: #e8eaee;
      color: #444
    }

    .flag.w {
      background: #fff0c9;
      color: #8a5a00
    }

    @media (prefers-color-scheme:dark) {
      .flag.r {
        background: #5b2020;
        color: #ffc4c4
      }

      .flag.s {
        background: #33384a;
        color: #d0d5e2
      }

      .flag.w {
        background: #574314;
        color: #ffe2a0
      }
    }

    .muted {
      color: var(--muted)
    }

    .empty {
      padding: 40px;
      text-align: center;
      color: var(--muted)
    }

    .settings {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
      margin-bottom: 14px
    }

    .settings label {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 14px;
      display: block;
      font-size: 12px;
      color: var(--muted)
    }

    .settings input {
      display: block;
      width: 100%;
      margin-top: 4px;
      font-size: 16px;
      font-weight: 700
    }

    .note {
      font-size: 12px;
      color: var(--muted);
      margin: 0 0 12px
    }

    /* modal */
    .ov {
      position: fixed;
      inset: 0;
      background: rgba(10, 12, 20, .55);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 50
    }

    .modal {
      background: var(--card);
      color: var(--ink);
      border-radius: 14px;
      width: min(520px, 100%);
      max-height: 92vh;
      overflow: auto;
      padding: 20px;
      border: 1px solid var(--line)
    }

    .modal h2 {
      margin: 0 0 12px;
      font-size: 17px
    }

    .fld {
      margin-bottom: 11px
    }

    .fld label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 3px
    }

    .fld input[type=text],
    .fld input[type=number],
    .fld select {
      width: 100%
    }

    .fld.ck label {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--ink);
      font-size: 13px
    }

    .row2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px
    }

    .prev {
      background: var(--head);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 13px;
      margin: 6px 0 14px
    }

    .prev b {
      font-size: 16px
    }

    .acts {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      margin-top: 6px
    }

    .err {
      color: var(--danger);
      font-size: 12px;
      margin: 4px 0
    }

    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--ink);
      color: var(--bg);
      padding: 10px 16px;
      border-radius: 10px;
      z-index: 99;
      font-size: 13px;
      max-width: 90vw
    }

    @media (max-width:640px) {

      main,
      header {
        padding-left: 14px;
        padding-right: 14px
      }

      .sidebar {
        width: 64px
      }

      .sidebar .tab {
        padding: 10px 12px
      }

      .sidebar .brand {
        display: none
      }

      .row2 {
        grid-template-columns: 1fr
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <h1>Project Cost Analyser</h1>
        <div class="sub">Rate-card driven costing &middot; FY 26-27</div>
      </div>
      <nav class="tabs" id="tabs"></nav>
    </aside>
  <div class="main-wrap">
  <main>
        <div id="filters" class="bar"></div>
        <div id="kpis"></div>
        <div id="body"></div>
      </main>
      <div id="modalRoot"></div>
    </div>
  </div>

  <script>
    /* ============ Minimal XLSX reader / writer (no external library) ============ */
    const XL = (() => {
      const td = new TextDecoder();
      async function inflateRaw(u8) {
        const ds = new DecompressionStream('deflate-raw');
        const stream = new Blob([u8]).stream().pipeThrough(ds);
        return new Uint8Array(await new Response(stream).arrayBuffer());
      }
      async function unzip(buf) {
        const u8 = new Uint8Array(buf), dv = new DataView(buf);
        let e = u8.length - 22;
        while (e >= 0 && dv.getUint32(e, true) !== 0x06054b50) e--;
        if (e < 0) throw new Error('Not a valid .xlsx file');
        const n = dv.getUint16(e + 10, true); let p = dv.getUint32(e + 16, true); const files = {};
        for (let i = 0; i < n; i++) {
          const method = dv.getUint16(p + 10, true), csize = dv.getUint32(p + 20, true);
          const nl = dv.getUint16(p + 28, true), el = dv.getUint16(p + 30, true), cl = dv.getUint16(p + 32, true), lo = dv.getUint32(p + 42, true);
          const name = td.decode(u8.subarray(p + 46, p + 46 + nl));
          const lnl = dv.getUint16(lo + 26, true), lel = dv.getUint16(lo + 28, true);
          const start = lo + 30 + lnl + lel; const data = u8.subarray(start, start + csize);
          files[name] = { method, data };
          p += 46 + nl + el + cl;
        }
        return files;
      }
      async function text(files, name) {
        const f = files[name]; if (!f) return null;
        const d = f.method === 0 ? f.data : await inflateRaw(f.data); return td.decode(d);
      }
      const colIdx = ref => { let s = ref.match(/[A-Z]+/)[0], n = 0; for (const ch of s) n = n * 26 + ch.charCodeAt(0) - 64; return n - 1 };
      async function read(buf) {
        const files = await unzip(buf); const P = new DOMParser();
        const xml = async n => { const t = await text(files, n); return t ? P.parseFromString(t, 'application/xml') : null };
        const wb = await xml('xl/workbook.xml'); if (!wb) throw new Error('Workbook not found');
        const rels = await xml('xl/_rels/workbook.xml.rels'); const relMap = {};
        rels.querySelectorAll('Relationship').forEach(r => relMap[r.getAttribute('Id')] = r.getAttribute('Target'));
        const sst = []; const ss = await xml('xl/sharedStrings.xml');
        if (ss) ss.querySelectorAll('si').forEach(si => sst.push([...si.querySelectorAll('t')].map(t => t.textContent).join('')));
        const sheets = {};
        for (const s of wb.querySelectorAll('sheet')) {
          const rid = s.getAttribute('r:id') || s.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships', 'id');
          let t = relMap[rid]; t = t.startsWith('/') ? t.slice(1) : 'xl/' + t;
          const doc = await xml(t); const rows = [];
          doc.querySelectorAll('sheetData > row').forEach(r => {
            const arr = []; r.querySelectorAll(':scope > c').forEach(c => {
              const ty = c.getAttribute('t'); const v = c.querySelector(':scope > v'); let val = null;
              if (ty === 'inlineStr') val = [...c.querySelectorAll('t')].map(x => x.textContent).join('');
              else if (v) { val = v.textContent; if (ty === 's') val = sst[+val]; else if (ty === 'str' || ty === 'e' || ty === 'b') { } else { const nn = Number(val); val = isNaN(nn) ? val : nn; } }
              arr[colIdx(c.getAttribute('r'))] = val;
            });
            rows[(+r.getAttribute('r')) - 1] = arr;
          });
          for (let i = 0; i < rows.length; i++) if (!rows[i]) rows[i] = [];
          sheets[s.getAttribute('name')] = rows;
        }
        return sheets;
      }
      // ---- writer ----
      const crcT = (() => { const t = []; for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++)c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0 } return t })();
      const crc = u8 => { let c = 0xFFFFFFFF; for (let i = 0; i < u8.length; i++)c = crcT[(c ^ u8[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0 };
      const esc = s => String(s).replace(/[<>&"]/g, c => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;' }[c]));
      const colName = i => { let s = ''; i++; while (i > 0) { const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = Math.floor((i - 1) / 26) } return s };
      function sheetXml(rows) {
        let x = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>';
        rows.forEach((r, ri) => {
          x += `<row r="${ri + 1}">`; r.forEach((v, ci) => {
            if (v === null || v === undefined || v === '') return; const ref = colName(ci) + (ri + 1);
            x += typeof v === 'number' && isFinite(v) ? `<c r="${ref}"><v>${v}</v></c>` : `<c r="${ref}" t="inlineStr"><is><t xml:space="preserve">${esc(v)}</t></is></c>`;
          }); x += '</row>'
        });
        return x + '</sheetData></worksheet>';
      }
      function zip(entries) {
        const te = new TextEncoder(); const parts = [], cd = []; let off = 0;
        for (const [name, str] of entries) {
          const nb = te.encode(name), d = te.encode(str), c = crc(d);
          const lh = new DataView(new ArrayBuffer(30)); lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint32(14, c, true); lh.setUint32(18, d.length, true); lh.setUint32(22, d.length, true); lh.setUint16(26, nb.length, true);
          parts.push(new Uint8Array(lh.buffer), nb, d);
          const ch = new DataView(new ArrayBuffer(46)); ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint32(16, c, true); ch.setUint32(20, d.length, true); ch.setUint32(24, d.length, true); ch.setUint16(28, nb.length, true); ch.setUint32(42, off, true);
          cd.push(new Uint8Array(ch.buffer), nb); off += 30 + nb.length + d.length;
        }
        const cdLen = cd.reduce((a, b) => a + b.length, 0);
        const end = new DataView(new ArrayBuffer(22)); end.setUint32(0, 0x06054b50, true); end.setUint16(8, entries.length, true); end.setUint16(10, entries.length, true); end.setUint32(12, cdLen, true); end.setUint32(16, off, true);
        return new Blob([...parts, ...cd, new Uint8Array(end.buffer)], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
      }
      function write(sheets) { // sheets: {name: rows[][]}
        const names = Object.keys(sheets);
        const e = [['[Content_Types].xml', '<?xml version="1.0" encoding="UTF-8"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>' + names.map((n, i) => `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('') + '</Types>'],
        ['_rels/.rels', '<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'],
        ['xl/workbook.xml', '<?xml version="1.0" encoding="UTF-8"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>' + names.map((n, i) => `<sheet name="${esc(n.slice(0, 31))}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join('') + '</sheets></workbook>'],
        ['xl/_rels/workbook.xml.rels', '<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' + names.map((n, i) => `<Relationship Id="rId${i + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join('') + '</Relationships>']];
        names.forEach((n, i) => e.push([`xl/worksheets/sheet${i + 1}.xml`, sheetXml(sheets[n])]));
        return zip(e);
      }
      return { read, write };
    })();

    /* ============ Data ============ */

     <td>${ui.tab === 'projects' ? `<button class="btn sm" data-act="drill" data-id="${r.id}">Tasks →</button> ` : ''}<button class="btn sm" data-act="edit" data-id="${r.id}">Edit</button> <button class="btn sm dng" data-act="del" data-id="${r.id}">Delete</button></td></tr>`
      }).join('');
      const foot = `<tr><td class="s1">Total</td><td class="s2">${rows.length} ${label}</td><td></td><td></td><td></td>` + cc.map(c => `<td class="num">${c[2] === 'm' ? inr(tot[c[0]]) : fmtN.format(tot[c[0]])}</td>`).join('') + `<td></td><td></td>${ui.tab !== 'projects' ? '<td></td>' : ''}<td></td></tr>`;
      $('#body').innerHTML = rows.length ? `<div class="tw"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody><tfoot>${foot}</tfoot></table></div>` : `<div class="tw"><div class="empty">Nothing matches these filters.</div></div>`;
    }
    function renderRates() {
      $('#kpis').innerHTML = `<p class="note">Costs everywhere are recalculated from this rate card instantly. <b>Final cost = Base cost + Concept charge + AI image charge + Rush charge + Special / complex charge</b>, where Base cost = units × New-work rate (or × Changes rate for change work).</p>
   <div class="settings">
    <label>Concept charge (₹ per output)<input type="number" min="0" data-set="concept" value="${S.concept}"></label>
    <label>AI charge (₹ per AI image)<input type="number" min="0" data-set="ai" value="${S.ai}"></label>
    <label>Rush / last-moment (% of Base cost)<input type="number" min="0" data-set="rushPct" value="${S.rushPct}"></label>
    <label>Special / complex (% of Base cost)<input type="number" min="0" data-set="specialPct" value="${S.specialPct}"></label></div>`;
      const rows = rates.filter(r => (ui.rcVert === 'All' || r.vertical === ui.rcVert) && (!ui.rcq || (r.task + ' ' + r.unit).toLowerCase().includes(ui.rcq.toLowerCase())))
        .sort((a, b) => VERTS.indexOf(a.vertical) - VERTS.indexOf(b.vertical) || 0);
      $('#body').innerHTML = `<div class="tw"><table><thead><tr><th>Vertical</th><th>Task type</th><th>Unit basis</th><th class="num">FY 26-27 New work rate</th><th class="num">FY 26-27 Changes work rate</th><th class="num">Used in</th><th></th></tr></thead><tbody>` +
        rows.map(r => {
          const u = tasks.filter(t => t.rateId === r.id).length; return `<tr><td><span class="badge v-${H(r.vertical)}">${H(r.vertical)}</span></td><td>${H(r.task)}</td><td class="muted">${H(r.unit)}</td><td class="num">${inr(r.newRate)}</td><td class="num">${inr(r.chgRate)}</td><td class="num muted">${u} task${u === 1 ? '' : 's'}</td>
   <td><button class="btn sm" data-act="editRate" data-id="${r.id}">Edit</button> <button class="btn sm dng" data-act="delRate" data-id="${r.id}">Delete</button></td></tr>`
        }).join('') +
        `</tbody></table></div><p class="note" style="margin-top:8px">${rows.length} of ${rates.length} task types shown.</p>`;
    }
    function renderAll() { renderTabs(); renderFilters(); renderBody() }

    /* ============ Modal forms ============ */
    function modal(title, fields, vals, save, preview) {
      const root = $('#modalRoot');
      const f = fields.map(f => {
        const v = vals[f.k];
        if (f.t === 'check') return `<div class="fld ck"><label><input type="checkbox" data-k="${f.k}" ${v ? 'checked' : ''}> ${f.l}</label></div>`;
        if (f.t === 'select') return `<div class="fld"><label>${f.l}</label><select data-k="${f.k}">${f.opts(v)}</select></div>`;
        return `<div class="fld" ${f.half ? '' : ''}><label>${f.l}</label><input type="${f.t || 'text'}" data-k="${f.k}" value="${H(v ?? '')}" ${f.t === 'number' ? 'min="0" step="any"' : ''} ${f.list ? `list="${f.list}"` : ''}></div>`
      }).join('');
      root.innerHTML = `<div class="ov"><div class="modal"><h2>${title}</h2>${f}<div class="prev" id="prev" ${preview ? '' : 'hidden'}></div><div class="err" id="err"></div><div class="acts"><button class="btn" data-m="x">Cancel</button><button class="btn pri" data-m="ok">Save</button></div></div></div>`;
      const get = () => { const o = {}; root.querySelectorAll('[data-k]').forEach(i => { const k = i.dataset.k; o[k] = i.type === 'checkbox' ? i.checked : i.type === 'number' ? Number(i.value || 0) : i.value }); return o };
      const upd = () => { if (preview) $('#prev').innerHTML = preview(get()) };
      root.oninput = root.onchange = upd; upd();
      root.onclick = e => {
        const m = e.target.dataset.m; if (m === 'x' || e.target.classList.contains('ov')) root.innerHTML = '';
        if (m === 'ok') { const err = save(get()); if (err) $('#err').textContent = err; else { root.innerHTML = ''; renderAll() } }
      };
    }
    const closeModal = () => $('#modalRoot').innerHTML = '';
    function toast(m) { const d = document.createElement('div'); d.className = 'toast'; d.textContent = m; document.body.appendChild(d); setTimeout(() => d.remove(), 3500) }

    function previewHTML(o, rateId, isChange) {
      const c = calcRec(o, rateId, isChange), r = rateOf(rateId); if (!r) return 'Pick a task type.';
      const base = isChange ? c.cC : c.wC;
      return `Base ${inr(base)} <span class="muted">(${o.qty || 0} × ${inr(isChange ? r.chgRate : r.newRate)} per ${H(r.unit.replace(/^per /i, ''))})</span><br>
   + Concept ${inr(c.kC)} + AI ${inr(c.aC)} + Rush ${inr(c.rush)} + Special ${inr(c.sp)}<br>Final cost: <b>${inr(c.total)}</b>`;
    }
    const rateOpts = sel => VERTS.concat([...new Set(rates.map(r => r.vertical))].filter(v => !VERTS.includes(v))).map(v => `<optgroup label="${H(v)}">` + rates.filter(r => r.vertical === v).map(r => `<option value="${r.id}" ${+sel === r.id ? 'selected' : ''}>${H(r.task)} — ${H(r.unit)}</option>`).join('') + '</optgroup>').join('');

    function projectForm(p) {
      const isNew = !p; p = p || { name: '', type: '', client: '', division: '' };
      modal(isNew ? 'New project' : 'Edit project', [{ k: 'name', l: 'Project name' }, { k: 'type', l: 'Project type', list: 'ptypes' }, { k: 'client', l: 'Client name', list: 'clist' }, { k: 'division', l: 'Client division' }], p, o => {
        if (!o.name.trim() || !o.client.trim()) return 'Project name and client are required.';
        if (isNew) projects.push({ id: newId('PRJ'), name: o.name.trim(), type: o.type.trim(), client: o.client.trim(), division: o.division.trim() });
        else Object.assign(p, { name: o.name.trim(), type: o.type.trim(), client: o.client.trim(), division: o.division.trim() });
      });
      $('#modalRoot .modal').insertAdjacentHTML('beforeend', `<datalist id="ptypes">${[...new Set(projects.map(x => x.type))].map(x => `<option value="${H(x)}">`).join('')}</datalist><datalist id="clist">${clientsList().map(x => `<option value="${H(x)}">`).join('')}</datalist>`);
    }
    function taskForm(t) {
      const isNew = !t; t = t || { projectId: ui.project !== 'All' ? ui.project : projects[0]?.id, name: '', rateId: rates[0]?.id, qty: 1, concepts: 0, ai: 0, rush: false, special: false };
      if (!projects.length) return toast('Create a project first.');
      modal(isNew ? 'New task' : 'Edit task ' + t.id, [
        { k: 'projectId', l: 'Project', t: 'select', opts: v => projects.map(p => `<option value="${p.id}" ${p.id === v ? 'selected' : ''}>${H(p.id + ' · ' + p.name)}</option>`).join('') },
        { k: 'name', l: 'Task name' }, { k: 'rateId', l: 'Task type (from rate card)', t: 'select', opts: rateOpts },
        { k: 'qty', l: 'No. of work units (pages / artworks / seconds-blocks…)', t: 'number' }, { k: 'concepts', l: 'No. of concepts used (₹' + fmtN.format(S.concept) + ' each)', t: 'number' },
        { k: 'ai', l: 'No. of AI images (₹' + fmtN.format(S.ai) + ' each)', t: 'number' },
        { k: 'rush', l: 'Rush / last-moment (+' + S.rushPct + '% of base)', t: 'check' }, { k: 'special', l: 'Special / complex work (+' + S.specialPct + '% of base)', t: 'check' }], t, o => {
          if (!o.name.trim()) return 'Task name is required.'; o.rateId = +o.rateId;
          if (isNew) tasks.push({ id: newId('TSK'), ...o, name: o.name.trim() }); else Object.assign(t, o, { name: o.name.trim() });
        }, o => previewHTML(o, +o.rateId, false));
    }
    function changeForm(c) {
      const isNew = !c; if (!tasks.length) return toast('Create a task first.');
      c = c || { taskId: tasks.find(t => ui.project === 'All' || t.projectId === ui.project)?.id || tasks[0].id, name: '', qty: 1, concepts: 0, ai: 0, rush: false, special: false };
      modal(isNew ? 'New change' : 'Edit change ' + c.id, [
        { k: 'taskId', l: 'Linked task', t: 'select', opts: v => tasks.map(t => `<option value="${t.id}" ${t.id === v ? 'selected' : ''}>${H(t.id + ' · ' + t.name + ' (' + (rateOf(t.rateId)?.task || '?') + ')')}</option>`).join('') },
        { k: 'name', l: 'Change name' }, { k: 'qty', l: 'No. of change pages / units (charged at Changes rate)', t: 'number' },
        { k: 'concepts', l: 'No. of concepts used', t: 'number' }, { k: 'ai', l: 'No. of AI images', t: 'number' },
        { k: 'rush', l: 'Rush / last-moment (+' + S.rushPct + '% of base)', t: 'check' }, { k: 'special', l: 'Special / complex work (+' + S.specialPct + '% of base)', t: 'check' }], c, o => {
          if (!o.name.trim()) return 'Change name is required.';
          if (isNew) changes.push({ id: newId('CHG'), ...o, name: o.name.trim() }); else Object.assign(c, o, { name: o.name.trim() });
        }, o => { const t = taskById(o.taskId); return t ? previewHTML(o, t.rateId, true) : '' });
    }
    function rateForm(r) {
      const isNew = !r; const old = r; r = r || { vertical: ui.rcVert !== 'All' ? ui.rcVert : 'Artwork', task: '', unit: 'Per artwork', newRate: 0, chgRate: 0 };
      modal(isNew ? 'Add task type' : 'Edit ' + r.task, [
        { k: 'vertical', l: 'Vertical', t: 'text', list: 'vlist' }, { k: 'task', l: 'Task type' }, { k: 'unit', l: 'Unit basis (e.g. Per artwork, Per 30 sec)' },
        { k: 'newRate', l: 'FY 26-27 New work rate (₹)', t: 'number' }, { k: 'chgRate', l: 'FY 26-27 Changes work rate (₹)', t: 'number' }], r, o => {
          o.vertical = o.vertical.trim(); o.task = o.task.trim(); o.unit = o.unit.trim();
          if (!o.vertical || !o.task) return 'Vertical and task type are required.';
          if (rates.some(x => x !== old && x.vertical.toLowerCase() === o.vertical.toLowerCase() && x.task.toLowerCase() === o.task.toLowerCase())) return 'This task type already exists in that vertical.';
          if (isNew) rates.push({ id: nextRate++, ...o }); else Object.assign(old, o);
          toast(isNew ? 'Task type added' : 'Rate updated — all costs recalculated');
        }, o => `Change rate suggestion: half of new rate = <b>${inr((o.newRate || 0) / 2)}</b>`);
      $('#modalRoot .modal').insertAdjacentHTML('beforeend', `<datalist id="vlist">${VERTS.map(v => `<option value="${v}">`).join('')}</datalist>`);
    }

    /* ============ Excel upload / export ============ */
    function parseRateSheet(rows) {
      const out = []; let ix = null;
      for (const r of rows) {
        if (!r || !r.length) continue;
        const c0 = String(r[0] ?? '').trim().toLowerCase();
        if (c0 === 'vertical') {
          const h = r.map(x => String(x ?? '').replace(/\s+/g, ' ').toLowerCase());
          const find = re => h.findIndex(x => re.test(x));
          ix = { task: find(/task/), unit: find(/unit/), nw: find(/new work rate|^new rate|new work/), ch: find(/chang\w* work rate|mod work rate|^change rate|changes? rate/) };
          if (ix.nw < 0) ix = null; continue;
        }
        if (!ix || !r[0]) continue;
        const task = String(r[ix.task] ?? '').trim(); if (!task) continue;
        const num = v => { const n = Number(v); return isFinite(n) && v !== null && v !== '' ? n : 0 };
        const nw = num(r[ix.nw]); const ch = ix.ch >= 0 && r[ix.ch] != null && r[ix.ch] !== '' ? num(r[ix.ch]) : nw / 2;
        out.push({ vertical: String(r[0]).trim(), task, unit: String(r[ix.unit] ?? '').trim(), newRate: nw, chgRate: ch });
      }
      return out;
    }
    async function handleUpload(file) {
      try {
        let sheets;
        if (/\.csv$/i.test(file.name)) {
          const rows = (await file.text()).split(/\r?\n/).filter(Boolean).map(l => l.split(',').map(x => { x = x.replace(/^"|"$/g, ''); return x !== '' && !isNaN(x) ? Number(x) : x }));
          sheets = { 'CSV': rows };
        } else sheets = await XL.read(await file.arrayBuffer());
        const parsed = {}; for (const n in sheets) { const p = parseRateSheet(sheets[n]); if (p.length) parsed[n] = p }
        const names = Object.keys(parsed);
        if (!names.length) return toast('No rate rows found. Expected columns: Vertical, Task Type, Unit Basis, New Work Rate, Changes Work Rate.');
        const pref = names.find(n => /26.?27/.test(n)) || names[0];
        const root = $('#modalRoot');
        root.innerHTML = `<div class="ov"><div class="modal"><h2>Import rate card</h2>
      <div class="fld"><label>Sheet to import</label><select id="shSel">${names.map(n => `<option ${n === pref ? 'selected' : ''}>${H(n)}</option>`).join('')}</select></div>
      <div class="prev" id="imp"></div>
      <div class="fld ck"><label><input type="radio" name="mode" value="merge" checked> Update existing &amp; add new (keeps task types not in the file)</label></div>
      <div class="fld ck"><label><input type="radio" name="mode" value="replace"> Replace the whole rate card with this file</label></div>
      <div class="acts"><button class="btn" data-m="x">Cancel</button><button class="btn pri" id="doImp">Import</button></div></div></div>`;
        const stat = () => {
          const p = parsed[$('#shSel').value]; const keys = new Set(rates.map(r => r.vertical.toLowerCase() + '|' + r.task.toLowerCase()));
          const upd = p.filter(x => keys.has(x.vertical.toLowerCase() + '|' + x.task.toLowerCase())).length;
          $('#imp').innerHTML = `<b>${p.length}</b> task types found &middot; <b>${upd}</b> will update existing, <b>${p.length - upd}</b> are new.`
        };
        stat(); $('#shSel').onchange = stat;
        root.onclick = e => {
          if (e.target.dataset.m === 'x' || e.target.classList.contains('ov')) closeModal();
          if (e.target.id === 'doImp') {
            const p = parsed[$('#shSel').value], mode = document.querySelector('input[name=mode]:checked').value;
            const key = x => x.vertical.toLowerCase() + '|' + x.task.toLowerCase();
            if (mode === 'replace') {
              const old = new Map(rates.map(r => [key(r), r.id])); rates = p.map(x => ({ id: old.get(key(x)) || nextRate++, ...x }));
            } else p.forEach(x => { const ex = rates.find(r => key(r) === key(x)); if (ex) Object.assign(ex, x); else rates.push({ id: nextRate++, ...x }) });
            closeModal(); renderAll(); toast('Imported ' + p.length + ' task types — costs recalculated');
          }
        };
      } catch (err) { toast('Could not read file: ' + err.message) }
    }
    function download(blob, name) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove() }, 500) }
    const rateRows = () => [['Vertical', 'Task Type', 'Unit Basis', 'FY 26-27 New Work Rate', 'FY 26-27 Changes Work Rate'], ...rates.map(r => [r.vertical, r.task, r.unit, r.newRate, r.chgRate])];
    function exportAll() {
      const cc = costCols().map(c => c[1]);
      const mk = (h, rows) => [h.concat(cc), ...rows];
      const save = tab => { const t = ui.tab; ui.tab = tab; const v = ui.vert, c = ui.client, p = ui.project, q = ui.q; ui.vert = 'All'; ui.client = 'All'; ui.project = 'All'; ui.q = ''; const rows = buildRows(); ui.tab = t; ui.vert = v; ui.client = c; ui.project = p; ui.q = q; return rows };
      const toRows = rows => rows.map(r => [r.id, r.name, r.type, r.client, r.division, ...costCols().map(c => Math.round(r.a[c[0]] * 100) / 100)]);
      download(XL.write({
        Projects: mk(['Project ID', 'Project name', 'Project type', 'Client name', 'Client division'], toRows(save('projects'))),
        Tasks: mk(['Task ID', 'Task name', 'Task type', 'Client name', 'Client division'], toRows(save('tasks'))),
        Changes: mk(['Change ID', 'Change name', 'Task type', 'Client name', 'Client division'], toRows(save('changes'))),
        'Rate Card': rateRows()
      }), 'project-cost-analysis.xlsx');
    }

    /* ============ Events ============ */
    document.addEventListener('click', e => {
      const t = e.target.closest('[data-tab],[data-v],[data-rcv],[data-act],[data-sort]'); if (!t) return;
      const d = t.dataset;
      if (d.tab) { ui.tab = d.tab; renderAll(); return }
      if (d.v) { ui.vert = d.v; renderFilters(); renderBody(); return }
      if (d.rcv) { ui.rcVert = d.rcv; renderFilters(); renderBody(); return }
      if (d.sort) { const s = ui.sort[ui.tab]; ui.sort[ui.tab] = s && s.k === d.sort ? { k: d.sort, d: -s.d } : { k: d.sort, d: 1 }; renderBody(); return }
      const id = d.id;
      switch (d.act) {
        case 'add': ui.tab === 'projects' ? projectForm() : ui.tab === 'tasks' ? taskForm() : changeForm(); break;
        case 'edit': ui.tab === 'projects' ? projectForm(projById(id)) : ui.tab === 'tasks' ? taskForm(taskById(id)) : changeForm(changes.find(c => c.id === id)); break;
        case 'del':
          if (ui.tab === 'projects') {
            const n = tasks.filter(t => t.projectId === id).length;
            ask(`Delete ${id} and its ${n} task(s) with their changes?`, () => { const ids = new Set(tasks.filter(t => t.projectId === id).map(t => t.id)); tasks = tasks.filter(t => t.projectId !== id); changes = changes.filter(c => !ids.has(c.taskId)); projects = projects.filter(p => p.id !== id); if (ui.project === id) ui.project = 'All' })
          }
          else if (ui.tab === 'tasks') ask(`Delete ${id} and its changes?`, () => { tasks = tasks.filter(t => t.id !== id); changes = changes.filter(c => c.taskId !== id) });
          else ask(`Delete ${id}?`, () => { changes = changes.filter(c => c.id !== id) });
          break;
        case 'drill': ui.tab = 'tasks'; ui.project = id; renderAll(); break;
        case 'addRate': rateForm(); break;
        case 'editRate': rateForm(rateOf(+id)); break;
        case 'delRate': {
          const r = rateOf(+id), u = tasks.filter(t => t.rateId === r.id).length;
          ask(u ? `"${r.task}" is used by ${u} task(s). Deleting it makes those tasks cost ₹0 until re-assigned. Delete anyway?` : `Delete "${r.task}"?`, () => { rates = rates.filter(x => x !== r) }); break
        }
        case 'upload': $('#file').click(); break;
        case 'tpl': download(XL.write({ 'Rate Card': rateRows() }), 'rate-card-template.xlsx'); break;
        case 'exportRates': download(XL.write({ 'Rate Card FY 26-27': rateRows() }), 'rate-card-fy26-27.xlsx'); break;
        case 'exportAll': exportAll(); break;
      }
    });
    /* in-page confirm (native confirm() is unreliable in sandboxed previews) */
    function ask(msg, fn) {
      const root = $('#modalRoot');
      root.innerHTML = `<div class="ov"><div class="modal"><h2>Please confirm</h2><p>${H(msg)}</p><div class="acts"><button class="btn" data-m="x">Cancel</button><button class="btn pri" id="yes">Delete</button></div></div></div>`;
      root.onclick = ev => { if (ev.target.dataset.m === 'x' || ev.target.classList.contains('ov')) closeModal(); if (ev.target.id === 'yes') { closeModal(); fn(); renderAll(); } };
    }
    document.addEventListener('input', e => {
      if (e.target.id === 'fq') { ui.q = e.target.value; renderBody() }
      if (e.target.id === 'rcq') { ui.rcq = e.target.value; renderBody() }
    });
    document.addEventListener('change', e => {
      if (e.target.id === 'fclient') { ui.client = e.target.value; renderBody() }
      if (e.target.id === 'fproj') { ui.project = e.target.value; renderBody() }
      if (e.target.id === 'file' && e.target.files[0]) { handleUpload(e.target.files[0]); e.target.value = '' }
      if (e.target.dataset.set) { S[e.target.dataset.set] = Math.max(0, Number(e.target.value) || 0); toast('Charge updated — all costs recalculated') }
    });
    renderAll();
  </script>
</body>

</html>
